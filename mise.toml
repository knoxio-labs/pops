dir = "pillars/mcp"
run = """
pnpm install
pnpm dev
"""

[tasks."dev:storybook"]
description = "Run unified Storybook for the UI library"
dir = "libs/ui"
run = "mise run storybook"

# ============================================================================
# Quality Checks
# ============================================================================

[tasks."typecheck:pillars"]
description = "Type check every pillar (fan-out across pillars/*)"
run = "mise run run-all typecheck"

[tasks."typecheck:shell"]
description = "Type check pops-shell"
dir = "pillars/shell"
run = "mise run typecheck"

[tasks."test:watch"]
description = "Run shell tests in watch mode"
dir = "pillars/shell"
run = "pnpm run test:watch"

[tasks."test:pillars"]
description = "Run every pillar's test suite (fan-out across pillars/*)"
run = "mise run run-all test"

[tasks."test:shell"]
description = "Run pops-shell tests"
dir = "pillars/shell"
run = "mise run test"

[tasks."test:scripts"]
description = "Run the root-owned scripts/ test suite (gates CI checks under scripts/)"
# `scripts/` is root-owned tooling (CI guards, extractability checks) that is
# never extracted into a unit, so it has no per-unit mise.toml and the
# `run-all` fan-out cannot see it. The root `vitest.config.ts` includes only
# `scripts/**/*.test.ts`. This task is the entry point CI, the `.husky/pre-push`
# hook and the umbrella `test` task all run. The hook runs it only when the
# push touches `scripts/` (via `scripts/pre-push-scope.mjs`'s `decideScripts`),
# which is correct for the hook and was once the ONLY net: `mise run test`
# skipped this suite entirely, so a change elsewhere that falsified what a
# guard observes was invisible locally and first failed in CI (POPS-2763).
# `[tasks.test]` now depends on this task, which closes that.
run = "vitest run scripts/"

[tasks."typecheck:scripts"]
description = "Build compiled dependencies before checking all root tooling projects"
depends = ["build"]
run = [
  "tsc --noEmit -p scripts/__tests__/tsconfig.json",
  "tsc --noEmit -p scripts/ci/__tests__/tsconfig.json",
  "tsc --noEmit -p scripts/db/__tests__/tsconfig.json",
  "tsc --noEmit -p scripts/extractability/__tests__/tsconfig.json",
]

[tasks."backlog:reconcile"]
description = "Cross-reference a gathered Huly backlog export against merged commits and report orphans (AGENTS.md 'Reconciling on a cadence')"
# No credential lives here — this forwards to a script that reads an export
# you already gathered (via the Huly MCP tools + huly-partition-plan.mjs) and
# never talks to the tracker itself. Usage:
#   mise run backlog:reconcile -- --issues <export.json> [--ref origin/main]
run = "node scripts/huly-backlog-reconcile.mjs \"$@\""

[tasks."implementation:evidence"]
description = "Validate read-only criterion evidence for a canonical Huly implementation ticket"
# The packet records the canonical implementation ticket separately from each
# PR's synced issue. This command never changes Huly or GitHub; it only says
# whether the supplied evidence is safe for a human to act on.
run = "node scripts/implementation-evidence.mjs \"$@\""

# ============================================================================
# Database Management
# ============================================================================
#
# Post-monolith reality: each pillar owns its own SQLite file and applies
# its committed `pillars/<x>/migrations/` journal at runtime when the DB is
# opened (drizzle's `migrate()` in each pillar's `open-<x>-db.ts`). There is
# no drizzle-kit step and no cross-domain seeder — those lived in the
# now-deleted monolith. Seeding and clearing are therefore per pillar, each
# with an umbrella that fans out.
#
# There is no `db:init`: a pillar creates and migrates its own file the first
# time it opens it, so a "fresh database" is an absent file, not a task.
#
# Every task below is development and test only (AGENTS.md "Production").
# `scripts/db/dev-db-guard.ts` enforces that rather than trusting it — it
# refuses under `NODE_ENV=production` and refuses any database resolving
# outside this working tree, which is every deployed one.

[tasks."db:seed:food"]
description = "Wipe food tables only, then seed PRD-113 phase-1 food fixtures into the food pillar's dev DB"
dir = "pillars/food"
env = { SQLITE_PATH = "{{config_root}}/pillars/food/data/food.db" }
run = "pnpm db:seed:food"

# Umbrella seeder. Register each new `db:seed:<id>` here as it lands; food is
# the only pillar shipping deterministic fixtures today.
[tasks."db:seed"]
description = "Seed every pillar that ships a deterministic dev seeder"
depends = ["db:seed:food"]

[tasks."db:clear"]
description = "Truncate every pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts --all"

[tasks."db:clear:ai"]
description = "Truncate the ai pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts ai"

[tasks."db:clear:bfm"]
description = "Truncate the bfm pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts bfm"

[tasks."db:clear:cerebrum"]
description = "Truncate the cerebrum pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts cerebrum"

[tasks."db:clear:contacts"]
description = "Truncate the contacts pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts contacts"

[tasks."db:clear:finance"]
description = "Truncate the finance pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts finance"

[tasks."db:clear:food"]
description = "Truncate the food pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts food"

[tasks."db:clear:inventory"]
description = "Truncate the inventory pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts inventory"

[tasks."db:clear:lists"]
description = "Truncate the lists pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts lists"

[tasks."db:clear:media"]
description = "Truncate the media pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts media"

[tasks."db:clear:purchases"]
description = "Truncate the purchases pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts purchases"

[tasks."db:clear:registry"]
description = "Truncate the registry pillar's dev DB (schema + migration journal preserved)"
run = "tsx scripts/db/db-clear-cli.ts registry"

# ============================================================================
# Food DSL
# ============================================================================

[tasks."food:dsl:generate"]
description = "Regenerate the Lezer parser for the recipe DSL grammar (PRD-120)"
dir = "pillars/food/app"
run = """
# lezer-generator writes BOTH `dsl-parser.ts` (parser tables) and
# `dsl-parser.terms.ts` (numeric term ids) alongside the -o target so we
# get both back from a single invocation. Commit both files together —
# they're a matched pair generated from the same `.grammar` source.
pnpm exec lezer-generator src/dsl/dsl.grammar -o src/dsl/dsl-parser.ts
echo "Regenerated src/dsl/dsl-parser.ts + dsl-parser.terms.ts — commit both alongside any grammar edits."
"""

