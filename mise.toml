# POPS mise configuration
# Run `mise tasks` to see all available tasks
# Run `mise run <task>` or `mise <task>` to execute

# Without this, mise appends its resolved tool bin dirs *after* the inherited
# PATH whenever its shim dir is already on PATH — so a system Node installed
# ahead of the shims (e.g. Homebrew's, which lands in /opt/homebrew/bin) wins
# every PATH lookup inside a task. `mise exec -- node` still reports the pin,
# because mise resolves that command itself, but a `#!/usr/bin/env node`
# shebang does not — and every `node_modules/.bin` entry (vitest, tsc, tsx)
# is such a shebang. The result is a task silently running on an unpinned
# Node major while `mise exec` swears the pin is honoured.
#
# `activate_aggressive` pushes the pinned bin dirs to the FRONT instead, so
# tasks, their shebangs and their subprocesses all agree with `[tools]` below
# regardless of how the developer's PATH is ordered.
[settings]
activate_aggressive = true

[tools]
node = "24.19.0"
pnpm = "11.20.0"
rust = "1.97.1"

[env]
# Add common environment variables here if needed
# Sensitive vars should still use .env files

# Expose the pnpm-workspace-hoisted bin dir so per-unit mise tasks can call
# bare `tsc`/`vitest`/`oxlint`/`tsx` (the §1 templates) without `pnpm exec`.
# mise has no auto node_modules/.bin injection; this is the workspace glue.
_.path = ["{{config_root}}/node_modules/.bin"]

# ============================================================================
# Root aggregate — graph-aware orchestration via `tsc -b` + pnpm filters
# ============================================================================

[tasks.install]
description = "Install all dependencies"
run = "pnpm install"

[tasks.build]
description = "Build the whole compiled TS graph in one ordered pass (^build replacement)"
run = "tsc -b tsconfig.build.json"

[tasks."build:rust"]
description = "Build the cargo workspace"
run = "cargo build --workspace"

[tasks."build:all"]
description = "Build the TS compiled graph and the Rust workspace"
depends = ["build", "build:rust"]

[tasks.run-all]
description = "Run locally declared unit tasks with bounded concurrency and explicit discovery errors"
usage = 'arg "<task>"'
run = 'node scripts/local-dev/run-all.mjs "$usage_task"'

[tasks.test]
description = "Run every unit's test suite plus the root-owned scripts/ suite (fan-out; each unit's test depends on its own build AND any pillar it imports a compiled dist from — POPS-2631)"
# `depends` on `test:scripts` because the `run-all` fan-out cannot reach it:
# `scripts/` is root-owned tooling with no mise.toml of its own. Without this
# the task that reads as "run every test in the workspace" ran every test
# except the ones gating the CI guards, and a full local green could still be
# rejected by the pre-push hook or CI's `Scripts tests` job (POPS-2763). The
# hook only runs `test:scripts` when the push touches `scripts/`, which is
# right for the hook and wrong as the only safety net — a change elsewhere
# can falsify what a `scripts/` guard observes. It costs ~7 seconds.
#
# Also depends on `build`: a unit's `test` task refuses to run against a
# missing sibling `dist/` rather than building it, so the fan-out needs the
# graph built first.
depends = ["test:scripts", "build"]
run = "mise run run-all test"

[tasks."test:coverage"]
description = "Run the coverage suite of every unit that declares one, over pnpm scripts rather than mise tasks"
# `mise run run-all test:coverage` fanned out to NOTHING: `test:coverage` is a
# package.json script in 32 units and a mise task in none, and `run-all`
# resolves mise tasks. The loop body never executed and the task exited 0
# having done nothing (POPS-3104). Both CI matrices already prefer the
# package.json script where a unit declares one, so this runs what CI runs
# rather than asking 32 units to restate it as a mise task.
depends = ["build"]
run = '''
units="$(
  find pillars libs -mindepth 1 -maxdepth 1 -type d -exec test -f '{}/package.json' ';' -print
  find pillars -mindepth 2 -maxdepth 2 -type d -name app -exec test -f '{}/package.json' ';' -print
)"
declaring=0
for unit in $units; do
  if node -e "process.exit((require('./$unit/package.json').scripts||{})['test:coverage']?0:1)"; then
    declaring=$((declaring + 1))
  fi
done
# The same refusal `run-all` makes, for the same reason: a fan-out over zero
# units is a silent success, and this task spent its whole life being one.
if [ "$declaring" -eq 0 ]; then
  echo "test:coverage: no discovered unit declares a 'test:coverage' script — nothing would run." >&2
  echo "test:coverage: it is a package.json script, not a mise task; check the units' package.json." >&2
  exit 1
fi
echo "test:coverage: $declaring unit(s) declare it."
pnpm -r --if-present run test:coverage
'''

[tasks.typecheck]
description = "Build prerequisites, then check every unit with reusable exact-input validation"
run = "node scripts/local-dev/validate.mjs --all --typecheck-only"

[tasks.check]
description = "Lint, format, typecheck and test changed units and their dependents; --all checks everything"
run = 'node scripts/local-dev/validate.mjs "$@"'

[tasks.dev]
description = "Build dependencies and supervise selected development processes concurrently"
run = 'node scripts/local-dev/dev.mjs "$@"'

[tasks."dev:ui"]
description = "Watch a pillar UI remote bundle and reload the shell after successful builds"
run = 'node scripts/local-dev/ui-remote-watch.mjs "$@"'

[tasks.lint]
description = "Lint all units (oxlint is workspace-wide, no per-unit orchestration)"
# The preflight comes first because oxlint's answer in a fresh worktree is
# worse than no answer: a tsconfig error pointing at libs/ui that reads as
# pre-existing repo debt on main, which it is not (POPS-2400).
run = ["node scripts/check-deps-materialised.mjs", "oxlint --type-aware"]

[tasks.registry]
description = "Regenerate the module-registry static manifest (src/generated.ts)"
run = "tsx libs/module-registry/scripts/build.ts"

[tasks."openapi:generate"]
description = "Regenerate every pillar's OpenAPI snapshot + typed client (fans out to each pillar's build codegen)"
run = "mise run run-all build"

# The iOS app's UI-level flow needs a running BFM, and neither unit may reach
# into the other (ADR-043) — so, like the fixture tasks below, the task that
# spans both lives here. It boots a real `@pops/bfm` against a temporary
# database, then hands the base URL to `mise -C clients/ios run e2e`, which
# installs the app on the simulator and runs the Maestro flow.
#
# The script carries the reasoning for every choice in it: why there is no
# Docker (GitHub's macOS runners have no daemon), why the port is not 3014, and
# what the registry-and-finance stub behind the BFM is and is not.
[tasks."e2e:ios"]
description = "Boot a real BFM against a temp database and drive the iOS app's pairing → transaction flow"
dir = "{{config_root}}"
run = "node scripts/ios-e2e/run.mjs"

[tasks."e2e:ios:mcp"]
description = "Boot BFM and MCP against temp state, then drive the iOS flow through MCP pairing"
dir = "{{config_root}}"
run = "node scripts/ios-e2e/run.mjs --pairing-issuer=mcp"

# The inventory-types acceptance suite (POPS-4354) spans the mcp, bfm,
# inventory and shell units and the iOS client, so, like `e2e:ios`, it lives
# here. `--web` adds the Playwright scenario, `--ios` the Maestro one;
# `--pull-request <n> --pr-issue <TICKET>` writes evidence packets. The script
# says what each layer runs and where the evidence lands.
[tasks."inventory:acceptance"]
description = "Run the inventory-types acceptance scenarios against real pillar processes and write evidence records"
dir = "{{config_root}}"
run = "node scripts/inventory-acceptance/run.mjs"

# The iOS↔BFM signature fixture exists twice on purpose — canonical under
# `clients/ios`, vendored inside the BFM's unit boundary (ADR-043) — and the
# copy step belongs to neither unit: a pillar must not read a path under
# `clients/`, and a client must not write into `pillars/`. So it lives here,
# above both, next to the guard that fails on drift
# (scripts/ci/check-device-signature-fixture.mjs).
[tasks."fixture:device-signature:vendor"]
description = "Re-vendor the iOS↔BFM signature fixture into the BFM"
dir = "{{config_root}}"
run = "cp clients/ios/Contracts/device-signature-v1.json pillars/bfm/contracts/device-signature-v1.json"

# Regenerating replaces a reviewed, cross-verified vector with an unreviewed
# one — ECDSA draws a fresh nonce per signature, so every run produces
# different bytes. Run it only when the encoding contract itself changes.
[tasks."fixture:device-signature"]
description = "Regenerate the iOS↔BFM signature fixture (Swift) and re-vendor it — only when the encoding contract changes"
dir = "{{config_root}}"
run = [
  "mise -C clients/ios run fixture:device-signature:generate",
  "oxfmt --write clients/ios/Contracts/device-signature-v1.json",
  "mise run fixture:device-signature:vendor",
]

# The refresh signed-message vector is the same arrangement pointing the other
# way. The format belongs to the BFM — it is the party that rejects a wrong
# message — so the pillar generates and holds the canonical copy and
# `clients/ios` vendors it. The copy step lives here for the same reason as
# above: neither unit may write into the other.
[tasks."fixture:refresh-message:vendor"]
description = "Re-vendor the BFM↔iOS refresh-message vector into the iOS client"
dir = "{{config_root}}"
run = "cp pillars/bfm/contracts/refresh-message-v1.json clients/ios/Contracts/refresh-message-v1.json"

# Safe to re-run, unlike its device-signature neighbour: this vector is derived
# from fixed inputs with no key and no signature, so an unchanged format
# rewrites identical bytes. Changing the format still means changing BOTH sides
# in the same commit — the Swift construction does not follow from regenerating.
[tasks."fixture:refresh-message"]
description = "Regenerate the BFM↔iOS refresh-message vector from the pillar's own construction, and re-vendor it"
dir = "{{config_root}}"
run = [
  "pnpm --filter @pops/bfm exec tsx scripts/generate-refresh-message-fixture.ts",
  "mise run fixture:refresh-message:vendor",
]

# The command-vectors fixture (Inventory ADR-002 D11) is the same arrangement
# again: the inventory pillar's command engine is the party the vectors are
# generated against, so it holds the canonical copy, and `clients/ios` vendors
# it (ADR-043 — the Swift reducer must not read a path under `pillars/`). The
# copy step lives here for the same reason as its two neighbours above.
[tasks."fixture:command-vectors:vendor"]
description = "Re-vendor the inventory command-vectors fixture into the iOS client"
dir = "{{config_root}}"
run = "cp pillars/inventory/contracts/command-vectors-v1.json clients/ios/Contracts/command-vectors-v1.json"

# Safe to re-run: the vectors are derived from a fixed clock, fixed ids and the
# real command engine, so an unchanged engine regenerates identical bytes.
# Changing an op's behaviour still means updating the Swift reducer B3 pins
# against these vectors in the same change — regenerating here does not do
# that for you.
[tasks."fixture:command-vectors"]
description = "Regenerate the inventory command-vectors fixture from the command engine, and re-vendor it"
dir = "{{config_root}}"
run = [
  "pnpm --filter @pops/inventory run generate:command-vectors",
  "mise run fixture:command-vectors:vendor",
]

# The expression-vectors fixture (Inventory ADR-002 D11) is the same
# arrangement as the command vectors: the pillar's evaluator produces the
# results, `clients/ios` vendors them for the Swift evaluator (ADR-043).
[tasks."fixture:expression-vectors:vendor"]
description = "Re-vendor the inventory expression-vectors fixture into the iOS client"
dir = "{{config_root}}"
run = "cp pillars/inventory/contracts/expression-vectors-v1.json clients/ios/Contracts/expression-vectors-v1.json"

[tasks."fixture:expression-vectors"]
description = "Regenerate the inventory expression-vectors fixture from the evaluator, and re-vendor it"
dir = "{{config_root}}"
run = [
  "pnpm --filter @pops/inventory run generate:expression-vectors",
  "mise run fixture:expression-vectors:vendor",
]

# The value-vectors fixture (POPS-4403) has three copies: BFM relays
# inventory's values without depending on the pillar, and iOS vendors under
# ADR-043.
[tasks."fixture:value-vectors:vendor"]
description = "Re-vendor the inventory value-vectors fixture into the iOS client and BFM"
dir = "{{config_root}}"
run = [
  "cp pillars/inventory/contracts/value-vectors-v1.json clients/ios/Contracts/value-vectors-v1.json",
  "cp pillars/inventory/contracts/value-vectors-v1.json pillars/bfm/contracts/value-vectors-v1.json",
]

[tasks."fixture:value-vectors"]
description = "Regenerate the inventory value-vectors fixture from the catalogue/command engine, and re-vendor it"
dir = "{{config_root}}"
run = [
  "pnpm --filter @pops/inventory run generate:value-vectors",
  "mise run fixture:value-vectors:vendor",
]

# The iOS app icon's layers are generated, not drawn. The task lives here rather
# than under `clients/ios` because it writes into both Icon Composer bundles and
# its palette is asserted against `libs/sdk`'s nav enum — three units, so it
# belongs above all of them. Safe to re-run: the SVG and the `icon.json` are
# derived from constants in the script, so an unchanged script rewrites
# identical files, and `scripts/__tests__/ios-app-icon.test.ts` fails if the
# committed bundles and the script disagree. To see a change, render the bundle
# with `xcrun actool` — the recipe is in clients/ios/README.md — never by
# assembling the layers by hand. A change to the icon's palette or its baked
# gloss also needs visual checks of the native appearance exports from Icon
# Composer's bundled ictool; the README includes the export command.
[tasks."icon:ios"]
description = "Regenerate the iOS app icon layers into both Icon Composer bundles"
dir = "{{config_root}}"
run = "node scripts/ios-app-icon.mjs"

