[mcp_servers.design-feedback]
command = "node"
args = ["scripts/design-feedback-mcp.mjs"]

[mcp_servers.huly-agents-knoxiolabs]
url = "https://projects-mcp.knoxiolabs.com/mcp"
bearer_token_env_var = "HULY_MCP_BEARER"
