# This lib imports `@pops/module-registry` and `@pops/pillar-sdk` through
# their built `dist`, not their `src` — so a change to either lib's `src` is
# invisible to `tsc`/vitest here until that lib is rebuilt (POPS-2671). Build
# them first rather than trusting whatever `dist` happens to be on disk.
[tasks.typecheck]
run = ["mise run -C ../module-registry build", "mise run -C ../sdk build", "tsc --noEmit"]

[tasks.test]
run = ["mise run -C ../module-registry build", "mise run -C ../sdk build", "vitest run"]

[tasks.lint]
run = "oxlint src && oxfmt --check ."

[env]
# mise's `_.path` interpolates `config_root` per config FILE, so the root
# mise.toml only ever contributes the workspace-hoisted bin dir — this unit's
# own tools (pinned via its own package.json and resolved by its own lockfile
# importer) are otherwise never on PATH, so a bare tool name above would
# silently resolve the root's node_modules/.bin instead of this unit's own.
_.path = ["{{config_root}}/node_modules/.bin"]
