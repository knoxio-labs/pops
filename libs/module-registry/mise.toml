[tasks.build]
description = "Emit dist/ + .d.ts"
run = "tsc -b tsconfig.build.json"
sources = ["src/**/*.ts", "tsconfig.build.json", "package.json"]
outputs = ["dist/**"]

# This lib imports `@pops/types` through its built `dist`, not its `src`. It
# used to build the sibling first (`mise run -C ../types build`, POPS-2671),
# but mise's and tsc's incremental caches both key off *source* hashes, not
# whether `dist` is actually still on disk — a `dist` removed (or gone stale)
# out of band from those caches can leave that build step reporting "up to
# date" while emitting nothing (POPS-2466, POPS-3488). require-built-graph.mjs
# does a real filesystem check with no cache to lie to it, so run it first and
# refuse with a clear message naming the unbuilt package, rather than let a
# cold or stale sibling surface as a confusing failure deep in a test file.
[tasks.typecheck]
run = ["node ../../scripts/require-built-graph.mjs", "tsc --noEmit"]

[tasks.test]
run = ["node ../../scripts/require-built-graph.mjs", "vitest run"]

[tasks.lint]
run = "oxlint src && oxfmt --check ."

[tasks.dev]
run = "tsc -b tsconfig.build.json --watch --preserveWatchOutput"
