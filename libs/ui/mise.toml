# require-built-graph.mjs refuses a missing sibling dist; an incremental build can no-op when only .tsbuildinfo survives.
[tasks.typecheck]
run = ["node ../../scripts/require-built-graph.mjs", "tsc --noEmit && tsc --noEmit -p scripts/tsconfig.json"]

[tasks.test]
run = ["node ../../scripts/require-built-graph.mjs", "vitest run && node scripts/check-storybook-coverage.mjs"]

[tasks.lint]
run = "oxlint src scripts && oxfmt --check ."

[tasks.storybook]
run = "storybook dev -p 6006"

[env]
# See pillars/shell/mise.toml — same reason (POPS-2715). `storybook` is this
# unit's own dependency and is not hoisted to the workspace bin dir.
_.path = ["{{config_root}}/node_modules/.bin"]
