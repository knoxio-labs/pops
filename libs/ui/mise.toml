# This lib imports `@pops/types` through its built `dist`, not its `src` — so
# a change to `libs/types/src` is invisible to `tsc`/vitest here until that
# lib is rebuilt (POPS-2671). Build it first rather than trusting whatever
# `dist` happens to be on disk.
[tasks.typecheck]
run = ["mise run -C ../types build", "tsc --noEmit && tsc --noEmit -p scripts/tsconfig.json"]

[tasks.test]
run = ["mise run -C ../types build", "vitest run && node scripts/check-storybook-coverage.mjs"]

[tasks.lint]
run = "oxlint src scripts && oxfmt --check ."

[tasks.storybook]
run = "storybook dev -p 6006"

[env]
# See pillars/shell/mise.toml — same reason (POPS-2715). `storybook` is this
# unit's own dependency and is not hoisted to the workspace bin dir.
_.path = ["{{config_root}}/node_modules/.bin"]
