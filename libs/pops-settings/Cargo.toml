[package]
name = "pops-settings"
version = "0.1.0"
# A direct member of the cargo workspace, a shared library under `libs/`
# (a sibling of `pops-ai` and of the `pillars/contacts` crate). 1:1 Rust mirror
# of the TS
# `@pops/pillar-settings` federated RU+reset settings surface — the byte-
# identical `/settings/*` wire contract every pillar serves, so that settings
# ride the manifest like every other cross-pillar dimension (ADR-037).
# Standalone library: it has no in-tree consumer yet (the contacts Rust pillar
# will mount it), so it ships compiled + tested-but-unused, with a
# golden-fixture parity test pinning the wire bytes against the TS schema.
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "POPS settings — Rust mirror of @pops/pillar-settings's federated RU+reset wire contract."

[lib]
name = "pops_settings"
path = "src/lib.rs"

[dependencies]
axum = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
utoipa = { workspace = true }
