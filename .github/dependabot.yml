version: 2

updates:
  # ── GitHub Actions ──────────────────────────────────────────────────────────
  # `directory: /` covers `.github/workflows` and a repo-ROOT `action.yml` only,
  # so the local composite actions under `.github/actions/*` were invisible to
  # it. That matters now that one of them owns the exact-patch `jdx/mise-action`
  # pin the whole fleet's mise setup goes through: a pin nothing bumps is a pin
  # that rots, and this is the ecosystem that would have caught the release
  # carrying the download retry weeks earlier. `directories` (plural) is the
  # only one of the two keys that accepts a glob.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types:
          - minor
          - patch

  # ── Docker (infra compose files + every pillar's Dockerfile) ────────────────
  # `/infra` alone only covered the compose files, leaving the 15
  # `pillars/<id>/Dockerfile` base images (node, nginx, rust, debian) with no
  # update coverage at all.
  - package-ecosystem: docker
    directories:
      - /infra
      - /pillars/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Node majors are excluded because Dependabot only compares tag numbers and
    # has no notion of Node's release train. Adding `/pillars/*` immediately
    # produced 14 PRs moving 24 -> 25; Node 25 is an odd-numbered release that
    # reached end-of-life on 2026-06-01, so merging them would have put the
    # whole fleet on an unsupported runtime while looking like an upgrade.
    # Even-numbered majors are safe only once they reach Active LTS, which is a
    # date, not a version comparison — so a Node major moves deliberately (and
    # together with mise.toml, mise.ci.toml and the workflow pins, which this
    # ecosystem cannot see). Minor/patch bumps within the pinned major still
    # flow automatically.
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major
    groups:
      docker-minor-patch:
        update-types:
          - minor
          - patch

  # ── Cargo (Rust workspace at the repo root) ─────────────────────────────────
  # There was never a cargo entry, so Rust dependencies got no scheduled
  # updates — only unsolicited security-advisory PRs, which Dependabot then
  # refuses to rebase ("the dependabot.yml entry that created this PR has been
  # deleted"), stranding them. The workspace is a single root Cargo.toml, so
  # one entry at / covers every member crate and the shared Cargo.lock.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - minor
          - patch

  # ── npm/pnpm — workspace root (covers all workspace packages) ───────────────
  # Single entry at / so dependabot runs `pnpm install` at the root and keeps
  # the shared pnpm-lock.yaml in sync. Per-directory entries cannot update the
  # root lockfile, causing ERR_PNPM_OUTDATED_LOCKFILE in CI.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 10
    groups:
      workspace-minor-patch:
        update-types:
          - minor
          - patch
