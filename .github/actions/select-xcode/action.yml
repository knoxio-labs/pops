name: Select the pinned Xcode
description: >-
  Point xcode-select at the Xcode that clients/ios/mise.toml pins as
  POPS_XCODE_VERSION and POPS_XCODE_BUILD, and export both pins to the job's
  environment.

# Never the runner image's default Xcode: it moves without notice and turns an
# unrelated change red. One implementation for every macOS job, because iOS
# Quality proving a commit on one Xcode and the TestFlight upload archiving it
# on another would ship a binary nothing tested.
#
# The pins are exported so a caller can key caches on the exact toolchain: a
# build product from another Xcode build is not a cache, Swift rebuilds it from
# scratch.

runs:
  using: composite
  steps:
    - name: Select the pinned Xcode
      shell: bash
      env:
        MISE_TOML: ${{ github.workspace }}/clients/ios/mise.toml
      run: |
        set -euo pipefail
        version=$(sed -nE 's/^POPS_XCODE_VERSION *= *"([^"]+)".*/\1/p' "$MISE_TOML" | head -1)
        build=$(sed -nE 's/^POPS_XCODE_BUILD *= *"([^"]+)".*/\1/p' "$MISE_TOML" | head -1)
        if [ -z "$version" ]; then
          echo "::error::no POPS_XCODE_VERSION pin found in clients/ios/mise.toml [env]"
          exit 1
        fi
        if [ -z "$build" ]; then
          echo "::error::no POPS_XCODE_BUILD pin found in clients/ios/mise.toml [env]"
          exit 1
        fi
        app="/Applications/Xcode_${version}.app"
        if [ ! -d "$app" ]; then
          echo "::error::clients/ios/mise.toml pins Xcode $version, which this runner image does not carry. Available:"
          ls -d /Applications/Xcode*.app
          exit 1
        fi
        echo "pinning Xcode to $version (build $build) (from clients/ios/mise.toml)"
        sudo xcode-select -s "$app/Contents/Developer"
        "$GITHUB_WORKSPACE/clients/ios/scripts/check-xcode-version.sh" check "$version" "$build"
        echo "POPS_XCODE_VERSION=$version" >> "$GITHUB_ENV"
        echo "POPS_XCODE_BUILD=$build" >> "$GITHUB_ENV"
