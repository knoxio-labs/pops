name: Pillar Image

# Push-to-main full pillar Docker image build.
#
# This workflow USED to also run typecheck + test + lint + format + build +
# codegen drift per pillar. That source-side matrix is now owned end-to-end by
# `unit-quality.yml` (disk-discovered, maxdepth-1, a strict SUPERSET — it also
# covers the Rust `contacts` pillar and the libs, which this file never did),
# so keeping it here duplicated every pillar check on every PR. It has been
# removed to kill that overlap (one `finance (pillar) — ts` lane, not two).
#
# What remains is the ONE thing nothing else does automatically: building the
# FULL pillar image (not just the builder stage) on push to main. On PRs the
# builder stage of every `pillars/*/Dockerfile*` is already validated by
# `docker-build.yml`; `publish-images.yml` does full builds but is
# `workflow_dispatch`-only during the colocation series, so without this job
# nothing would surface a broken full-image build when main advances. Pillars
# are discovered from disk so adding/removing one needs no edit here.
#
# NOT a pull_request gate — that trigger was the source of the duplication.

on:
  push:
    branches: [main]
    paths:
      - "pillars/**"
      - "libs/sdk/**"
      - "libs/types/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".oxfmtrc.json"
      - ".github/workflows/pillar-quality.yml"

# cancel-in-progress is deliberately OFF — see the matching note in
# ios-quality.yml and the CONVERGENCE comment in ci-gate.yml: cancelling a
# superseded run and admitting the new one is not atomic, and the race can
# drop the new run's registration entirely rather than merely delaying it.
# This workflow isn't gated by `CI Gate`, but a dropped registration here is
# indistinguishable from a genuine skip to anything else that depends on it.
# A superseded run is left to finish instead; `queue: single` (the default)
# still caps this group at one pending run.
concurrency:
  group: pillar-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover pillar images
    runs-on: ubuntu-latest
    outputs:
      dockerfiles: ${{ steps.list.outputs.dockerfiles }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - id: list
        name: Enumerate pillar images from disk
        # Every image a pillar ships, as a Dockerfile path. Derived from disk
        # so adding or removing one needs no workflow edit.
        #
        # A pillar is any `pillars/<x>` carrying a package.json, and it may
        # ship more than one image: `pillars/design` has a static nginx image
        # for the playground and `Dockerfile.api` for the comment API, since
        # one image cannot be both. Discovering `Dockerfile.*` alongside
        # `Dockerfile` is what keeps a variant image's full build gated on
        # push the same as a primary one — matching the same widening in
        # `docker-build.yml`.
        run: |
          set -euo pipefail
          json=$(find pillars -mindepth 1 -maxdepth 1 -type d 2>/dev/null \
            | sort \
            | while read -r dir; do
                if [ -f "$dir/package.json" ]; then
                  find "$dir" -maxdepth 1 \( -name Dockerfile -o -name 'Dockerfile.*' \) | sort
                fi
              done \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          count=$(echo "$json" | jq 'length')
          echo "dockerfiles=$json" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Discovered $count pillar image(s):"
          echo "$json" | jq .

  docker:
    name: ${{ matrix.dockerfile }} — Docker image build
    needs: [discover]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.discover.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build pillar image (full)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: pops-image-under-test:${{ github.sha }}
