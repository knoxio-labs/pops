name: Main Typecheck
run-name: ${{ github.workflow }} for ${{ github.sha }}

on:
  push:
    branches: [main]

permissions:
  contents: read

env:
  MISE_ENV: ci

jobs:
  typecheck:
    name: Full workspace typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-mise
      - name: Typecheck the full workspace
        run: mise typecheck
