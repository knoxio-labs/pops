name: Release

# Every push to `main` is considered for a release; `release.sh` decides whether
# the commits since the last strict `vX.Y.Z` tag actually warrant one and exits
# without tagging when they don't. `workflow_dispatch` stays for cutting a tag
# out of band.
on:
  push:
    branches: [main]
  workflow_dispatch:

# `contents: write` for the tag push, the GitHub Release and its assets — no
# commits land on main, the repo ruleset forbids direct pushes there, so the
# workflow is tag-only by design and the GitHub Release is the canonical
# changelog. `actions: write` is for the publish dispatch below.
permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Compute release
        id: compute
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash .github/scripts/release.sh

      # The moltbot profile is served from files, not from an image, so the
      # release is where those files get a version. See
      # `pillars/moltbot/README.md` for how a deployer consumes the tarball.
      - name: Pack the moltbot config bundle
        if: steps.compute.outputs.release == 'true'
        env:
          NEW_VERSION: ${{ steps.compute.outputs.version }}
        run: node scripts/pack-moltbot-bundle.mjs --version "v${NEW_VERSION}" --out dist

      - name: Tag and publish release
        if: steps.compute.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.compute.outputs.version }}
        run: |
          git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
          git push origin "v${NEW_VERSION}"
          gh release create "v${NEW_VERSION}" \
            --title "v${NEW_VERSION}" \
            --notes-file release-notes.md \
            "dist/moltbot-bundle-v${NEW_VERSION}.tar.gz"

      # GitHub does not start a workflow run from an event created with
      # GITHUB_TOKEN, so the `v*` tag pushed above never reaches
      # `publish-images.yml` on its own — the semver image tags it exists to
      # produce have never been pushed. `workflow_dispatch` is one of the two
      # documented exceptions to that rule, so ask for the run explicitly.
      # Dispatching at the tag ref is what makes `docker/metadata-action`
      # resolve its `type=semver` patterns.
      - name: Republish the fleet at the new tag
        if: steps.compute.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEW_VERSION: ${{ steps.compute.outputs.version }}
        run: gh workflow run publish-images.yml --ref "v${NEW_VERSION}"
