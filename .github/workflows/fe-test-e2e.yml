name: E2E Tests

# Playwright against the shell and the app bundles it mounts. No pillar
# backend is started: every spec fulfils the REST surface it exercises at the
# `/<pillar>-api` proxy path with `page.route`, so the only processes are the
# two shell dev servers `pillars/shell/playwright.config.ts` defines.
#
# The build step below is wider than the shell's own dependency closure on
# purpose. The finance-only webServer runs `scripts/build-registry-snapshot.ts`
# first, which discovers every pillar's `./manifest` export by importing its
# built `dist/contract/manifest.js`. A pillar the shell does not depend on
# still has to be built, or that server never starts and BOTH projects fail.
#
# The filter below is that same closure, not the shell's. Narrowing it to the
# shell and the app bundles leaves every non-app pillar file — a manifest under
# `pillars/<id>/src/`, anything its `build` script reads — able to break both
# webServers while this workflow reports nothing at all, and the failure then
# surfaces in the merge queue where it ejects the whole batch. `pillars/**` and
# `libs/**` are the two roots the build step's `--filter` expressions resolve
# to; the root configs are what `tsc -b` reads underneath them.
#
# `pillars/design` is carved back out of that closure. The playground mounts
# no app bundle into the shell and no spec here routes at a `/design-api`
# path, so nothing it contains can change a Playwright outcome — it is only
# in the closure at all because the build step's `./pillars/*` filter builds
# every workspace package. A design PR that broke that build would still be
# caught: `Unit Quality` filters on `pillars/**` with no such exclusion and
# builds the same package, and `merge_group` below takes no `paths` filter,
# so the queue runs this lane against the design change regardless.
# `ci-gate.yml`'s PATH_FILTERS mirror carries the same exclusion, and
# `scripts/ci/check-ci-gate-wiring.mjs` fails if the two drift.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pillars/**"
      - "libs/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.build.json"
      - ".github/workflows/fe-test-e2e.yml"
      - "!pillars/design/**"
  merge_group:
  workflow_dispatch:

concurrency:
  group: fe-test-e2e-${{ github.workflow }}-${{ github.ref }}
  # Cancelling a superseded run and admitting its replacement is not atomic on
  # GitHub's side, and `CI Gate` reads an absent run as pending forever. See
  # the MITIGATION note in ci-gate.yml.
  cancel-in-progress: false

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pillars and shared packages
        run: pnpm --filter "./pillars/*" --filter "@pops/shell^..." build

      - name: Let apt wait for the dpkg lock
        run: |
          echo 'DPkg::Lock::Timeout "300";' | sudo tee /etc/apt/apt.conf.d/99lock-timeout

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          cd pillars/shell
          node ../../scripts/ci/playwright-install-retry.mjs \
            --label "playwright install --with-deps" \
            -- npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 15
        run: |
          cd pillars/shell
          node ../../scripts/ci/playwright-install-retry.mjs \
            --label "playwright install-deps" \
            -- npx playwright install-deps

      - name: Run Playwright tests
        run: |
          cd pillars/shell
          pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: pillars/shell/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots
          path: pillars/shell/test-results/
          retention-days: 7
