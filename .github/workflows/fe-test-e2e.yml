name: E2E Tests

# Playwright against the shell and the app bundles it mounts. No pillar
# backend is started: every spec fulfils the REST surface it exercises at the
# `/<pillar>-api` proxy path with `page.route`, so the only processes are the
# two shell dev servers `pillars/shell/playwright.config.ts` defines.
#
# The build step below is wider than the shell's own dependency closure on
# purpose. The finance-only webServer runs `scripts/build-registry-snapshot.ts`
# first, which discovers every pillar's `./manifest` export by importing its
# built `dist/contract/manifest.js`. A pillar the shell does not depend on
# still has to be built, or that server never starts and BOTH projects fail.
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "pillars/shell/**"
      - "pillars/*/app/**"
      - "libs/navigation/**"
      - "libs/module-registry/**"
      - "libs/sdk/**"
      - "libs/types/**"
      - "libs/ui/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/fe-test-e2e.yml"
  merge_group:
  workflow_dispatch:

concurrency:
  group: fe-test-e2e-${{ github.workflow }}-${{ github.ref }}
  # Cancelling a superseded run and admitting its replacement is not atomic on
  # GitHub's side, and `CI Gate` reads an absent run as pending forever. See
  # the MITIGATION note in ci-gate.yml.
  cancel-in-progress: false

jobs:
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build pillars and shared packages
        run: pnpm --filter "./pillars/*" --filter "@pops/shell^..." build

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: |
          cd pillars/shell
          npx playwright install --with-deps

      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: |
          cd pillars/shell
          npx playwright install-deps

      - name: Run Playwright tests
        run: |
          cd pillars/shell
          pnpm test:e2e
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: pillars/shell/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-screenshots
          path: pillars/shell/test-results/
          retention-days: 7
