name: Workflows Quality

# Covers `.github/actions/**` as well as `.github/workflows/**`. A local
# composite action is workflow-shaped YAML that every workflow depends on, and
# a syntax error in one is found at the same place a syntax error in a workflow
# is: at run time, in whichever job reached it first. Both the trigger and the
# lint glob have to name it — a filter that selects the change and a lint that
# never reads the file is the same as no coverage.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - '.github/workflows/**'
              - '.github/actions/**'

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-latest
    needs: [changes]
    if: always()
    steps:
      - name: "Skip — no relevant changes"
        if: github.event_name == 'pull_request' && needs.changes.outputs.relevant != 'true'
        run: echo "Skipping — no workflow changes"
      - uses: actions/checkout@v7
        if: github.event_name == 'push' || needs.changes.outputs.relevant == 'true'
      - name: Lint workflow YAML
        if: github.event_name == 'push' || needs.changes.outputs.relevant == 'true'
        # Globbed by the shell, so an empty `.github/actions` would expand to a
        # literal path and fail the lint rather than quietly shortening it.
        run: npx yaml-lint .github/workflows/*.yml .github/actions/*/action.yml
