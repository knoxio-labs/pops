name: iOS Quality

# The only workflow in this repo that does not run on `ubuntu-latest`, because
# Swift does not build anywhere else. `knoxio-labs/pops` is public, so
# GitHub-hosted macOS runners cost nothing and carry no minute cap; a
# self-hosted Mac was considered and rejected as infrastructure this earns no
# right to yet.
#
# Until this existed, `clients/ios` had no CI at all — `_discover-units.yml`
# scans `pillars/` and `libs/` only, so a Swift-only PR was green having
# compiled nothing (ADR-043). This job is wired into `ci-gate.yml` (both the
# `on.workflow_run.workflows` trigger array AND the `gated` array inside the
# script — either alone is inert) so a broken Swift build blocks the merge.
#
# WHY THE Xcode PIN, and why it is not decoration: the runner image ships seven
# Xcodes and moves its default without notice, which turns an unrelated PR red.
# Worse, `swift-format` ships INSIDE the toolchain rather than being pinned in
# `mise.toml` like SwiftLint, so the Xcode version is what decides which rules
# "formatted" means — and `mise run lint` fails outright when the toolchain's
# rule list and `.swift-format` disagree. The pin lives in `clients/ios/mise.toml`
# next to the tool pins it belongs with, and is read from there rather than
# restated here (the same shape as `rust-quality.yml` reading the Rust pin).
#
# THE SDK CEILING RUNS THE OTHER WAY. The runner image's newest iOS SDK is what
# caps the app's deployment target, not the reverse: an SDK older than the
# deployment target does not build, and an SPM `platforms:` floor cannot be
# overridden from the command line. That constraint is why the app targets iOS
# 26 — see the `deploymentTarget` note in `clients/ios/project.yml`.
#
# `pillars/bfm/openapi/**` is in the path filter deliberately. The BFM contract
# is the input the Swift client is generated from, so a contract change has to
# re-run this job or the generated client rots without a single red check.
#
# THIS JOB ALSO RUNS THE ONLY TEST IN THE REPO THAT TOUCHES AN iOS SCREEN. The
# last steps boot a real `@pops/bfm` and drive the built app against it with
# Maestro; `clients/ios/.maestro/README.md` says why Maestro and not XCUITest,
# and `scripts/ios-e2e/run.mjs` says what the pillar is talking to. It lives
# here rather than in a workflow of its own because it needs what this job
# already paid for — one compile of the tree, one booted simulator — and
# because `ci-gate.yml` already lists "iOS Quality", so a second gated context
# would be a second thing to wire and a second thing to forget.
#
# THERE IS NO DerivedData CACHE HERE, AND THAT IS DELIBERATE. It cannot help
# the step that costs. `build:for-testing` wipes its own private
# `.derived-data` directory before every build, because a complete compiler
# log for `unused_declaration` — a whole-program rule, where a use deleted in
# one file makes a declaration in another unused — requires compiling every
# file. A warm tree by definition recompiles only what changed, so a cache hit
# produces a partial log and `lint:analyze`'s own floor rejects it. A build that
# must be cold cannot be warmed.
#
# It was not merely useless before, it was actively counted against itself: the
# old arrangement ran `clean build-for-testing` against the SHARED default
# location, so the last step of each run emptied the directory that `Save
# DerivedData` then banked. That is what POPS-1683 was seeing.
#
# Removed with it: the `Build (iOS Simulator)` step, the cache's only remaining
# consumer. `build-for-testing` compiles the app as `TEST_HOST`, so nothing
# stopped being compiled — the app-does-not-compile signal now comes from the
# step below, about a minute later than it used to.

on:
  push:
    branches: [main]
    paths:
      - "clients/ios/**"
      - "pillars/bfm/openapi/**"
      - ".github/workflows/ios-quality.yml"
  pull_request:
    paths:
      - "clients/ios/**"
      - "pillars/bfm/openapi/**"
      - ".github/workflows/ios-quality.yml"
  # THE EXPENSIVE ONE, AND DELIBERATELY UNCONDITIONAL. A merge group cannot be
  # path-filtered — `paths:` is rejected outright on this event — so every queue
  # entry pays a full macOS compile, docs-only changes included. That is the
  # price of the queue and it was priced in: the break that motivated it was a
  # Swift signature change and a Swift call site landing six minutes apart, each
  # green against a base that did not contain the other, and this job is the
  # only thing in the repo that can see it. Narrowing the queue lane means
  # hand-rolling this filter against the merge group's diff, and a filter that
  # is wrong reports green having compiled nothing.
  merge_group:

concurrency:
  group: ios-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: build + test + lint + UI flow
    runs-on: macos-latest
    # A wedged simulator is the classic macOS-CI failure and it does not fail —
    # it hangs. Without a ceiling that burns the job's full 6h default.
    timeout-minutes: 45
    defaults:
      run:
        working-directory: clients/ios
    env:
      # mise merges config UP the tree, so a bare `mise install` here would also
      # install the root `mise.toml`'s Rust — a full rustup toolchain download
      # in a job that compiles no Rust.
      #
      # Node and pnpm used to be disabled alongside it, and are not any more:
      # the UI-level step at the bottom of this job runs a real `@pops/bfm`
      # for the app to talk to, and that is a Node process. They cost about
      # twenty seconds to install; Rust costs minutes.
      MISE_DISABLE_TOOLS: rust

    steps:
      - uses: actions/checkout@v7

      - name: Select the pinned Xcode
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^POPS_XCODE_VERSION *= *"([^"]+)".*/\1/p' mise.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::no POPS_XCODE_VERSION pin found in clients/ios/mise.toml [env]"
            exit 1
          fi
          app="/Applications/Xcode_${version}.app"
          if [ ! -d "$app" ]; then
            echo "::error::clients/ios/mise.toml pins Xcode $version, which this runner image does not carry. Available:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          echo "pinning Xcode to $version (from clients/ios/mise.toml)"
          sudo xcode-select -s "$app/Contents/Developer"
          xcodebuild -version
          # Exported so the generator cache below can key on it. A `.build`
          # produced by another toolchain is not a cache — Swift rebuilds it
          # from scratch and the stale one just wastes the restore.
          echo "POPS_XCODE_VERSION=$version" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v4
        with:
          working_directory: clients/ios

      - name: Generate Pops.xcodeproj
        run: mise run generate

      # Keyed on the Package.swift files as well as Package.resolved. Most
      # packages here depend only on their siblings by path and pin nothing;
      # only `Packages/BFMClient` reaches outside the repo, for Apple's
      # swift-openapi runtime. `hashFiles` over a pattern that matches nothing
      # contributes an empty string, so a key built from Package.resolved alone
      # would go constant the moment that one file moved or was removed, and
      # restore a stale cache at every commit after. Scoped to `Packages/*/`
      # rather than every `Package.resolved` under `clients/ios` so a change to
      # `Tools/OpenAPIGenerator`'s own dependency graph — cached separately
      # below and irrelevant to the app's packages — does not invalidate this.
      - name: Cache resolved SPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('clients/ios/Packages/*/Package.swift', 'clients/ios/Packages/*/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Resolve SPM dependencies
        run: xcodebuild -project Pops.xcodeproj -scheme Pops -resolvePackageDependencies

      # The generator's own build products. Regenerating is a `swift run`, so
      # without this every run recompiles OpenAPIKit, Yams and ArgumentParser
      # before it can read a 2 kB contract. Separate from the cache above because
      # it is a separate package graph — `Tools/OpenAPIGenerator` is what keeps
      # the generator out of the app's dependencies, and the price of that is a
      # second thing to cache.
      #
      # ~500 MB uncompressed, which is not free either. It is worth it because
      # the key only moves when the generator pin does, and that is a deliberate
      # bump rather than something an ordinary PR touches — so this is a near-
      # permanent hit that saves a from-scratch dependency build on every run.
      # The restore-keys fall back to any build from the same toolchain: SwiftPM
      # re-resolves and rebuilds what actually changed, so a near-miss is still
      # most of the work already done.
      - name: Cache the OpenAPI generator's build products
        uses: actions/cache@v6
        with:
          path: clients/ios/Tools/OpenAPIGenerator/.build
          key: openapi-generator-${{ runner.os }}-${{ env.POPS_XCODE_VERSION }}-${{ hashFiles('clients/ios/Tools/OpenAPIGenerator/Package.resolved') }}
          restore-keys: |
            openapi-generator-${{ runner.os }}-${{ env.POPS_XCODE_VERSION }}-

      # The iOS half of ADR-040's regenerate-and-diff discipline, and the reason
      # `pillars/bfm/openapi/**` is in this workflow's path filter. Its TypeScript
      # counterpart is the `cross-pillar-clients` job in `quality.yml`.
      #
      # This app is DISTRIBUTED, not deployed: a build already on a phone keeps
      # calling yesterday's contract for as long as its owner declines to update.
      # That makes the gate worth more here than anywhere else in the repo — a
      # producer-side change the client has not followed is not a broken deploy,
      # it is a broken install someone else owns.
      - name: Re-vendor the BFM contract and regenerate the Swift client
        run: mise run generate:bfm-client

      - name: Verify the vendored contract and generated client are up to date
        run: |
          set -euo pipefail
          vendored=Contracts/bfm.openapi.json
          generated=Packages/BFMClient/Sources/BFMClient/Generated

          # Tracked-ness first. `git diff` says nothing about an untracked file,
          # so a client that was generated but never committed — or a rename that
          # left the old path behind — would sail through the diff below having
          # compared a file against itself. Same reasoning as the OpenAPI gate in
          # rust-quality.yml.
          for path in "$vendored" "$generated"; do
            if ! git ls-files --error-unmatch "$path" > /dev/null 2>&1; then
              echo "::error::$path is not committed. Run 'mise run generate:bfm-client' in clients/ios and commit the result."
              exit 1
            fi
          done

          # `git status --porcelain` rather than `git diff --exit-code`: the
          # generator emits one file per mode, so a config change that adds a
          # mode arrives as a NEW file, which a diff does not see.
          drift=$(git status --porcelain -- "$vendored" "$generated")
          if [ -n "$drift" ]; then
            git diff -- "$vendored" "$generated" || true
            echo "$drift"
            echo "::error::The vendored BFM contract or its generated Swift client is out of date."
            echo "Run 'mise run generate:bfm-client' in clients/ios and commit the result."
            exit 1
          fi

      # Every step below is a `mise run` of the task a developer runs locally,
      # never a hand-copied command. A second copy of the command is a copy that
      # drifts, and the moment it does a green local run stops meaning anything.

      # First, because it needs no build at all and answers in seconds. A
      # formatting or SwiftLint violation used to be reported only after the
      # whole tree had been compiled.
      - name: Lint (swift-format + SwiftLint)
        run: mise run lint

      # ONE STEP, because it is one compile. Both tasks depend on
      # `build:for-testing`, and mise resolves a single dependency graph per
      # invocation — so naming them together here runs the shared build once,
      # while naming them in two steps would run it twice and put this back
      # where it started. `mise run test` alone still builds, so nothing about
      # the local command changed.
      #
      # What this replaced: `xcodebuild test` compiled the whole tree against
      # the iOS SDK, and `lint:analyze` then did its own `clean
      # build-for-testing` to get a complete compiler log — two full compiles of
      # the same sources, 399s and 473s when last measured, for a test action
      # whose assertions take 1.5 seconds. The compile is the cost here; the
      # tests are not. That is also why splitting the suites across the host and
      # the simulator was NOT the fix — the packages a host lane would take are
      # dependencies of the app target and the render suites that have to stay,
      # so they get compiled either way and the split would move 1.5 seconds.
      #
      # `:::` is mise's separator between TASKS, and it is not optional.
      # `mise run test lint:analyze` does not run two tasks: it runs `test` and
      # appends `lint:analyze` to its command line as an argument, where it
      # arrives as a second xcodebuild destination and fails the lane. Verified
      # against mise 2026.7.18.
      #
      # `-j 1` IS ALSO NOT OPTIONAL, and it is the more expensive lesson. mise
      # runs the two tasks concurrently by default, which is ~3 minutes faster
      # and turned the job flaky: `swiftlint analyze` saturates the runner's
      # three cores while the simulator suite is running, and the Auth
      # concurrency tests poll for a condition with a timeout.
      # `twentyConcurrentRejectionsRefreshOnce` waits for twenty tasks to reach
      # a barrier; starved of CPU they do not all get there, and it failed with
      # "a request never reached the refresher" on one run in three. A required
      # check that fails one time in three costs far more than three minutes.
      # Running them concurrently on two SEPARATE runners would get both the
      # wall clock and the isolation — costed in POPS-1746.
      - name: Test + SwiftLint analyzer rules (one shared compile)
        run: "mise run -j 1 test ::: lint:analyze"

      # Everything below drives the built app on the simulator the step above
      # just left booted, against a real BFM. `clients/ios/.maestro/README.md`
      # argues for Maestro over XCUITest; what follows is only about getting a
      # pillar running next to it.
      #
      # THERE IS NO DOCKER ON THIS RUNNER. GitHub's macOS images ship no Docker
      # daemon, so `infra/docker-compose.dev.yml` — the obvious way to get a
      # BFM — is not available here and no amount of `docker compose` will make
      # it so. The pillar is a Node process: install its subgraph, build it,
      # run it. `scripts/ios-e2e/run.mjs` does the last two.
      - name: Expose bundled node-gyp on PATH
        # mise-installed node bundles node-gyp under npm but does not put it on
        # PATH, so better-sqlite3 — which the BFM opens its database with —
        # fails its pnpm lifecycle build with `node-gyp: not found` on any
        # platform with no prebuild for this Node ABI. The same step, for the
        # same reason, is in `unit-quality.yml`.
        working-directory: .
        run: |
          set -euo pipefail
          gyp_bin="$(dirname "$(mise which node)")/../lib/node_modules/npm/bin/node-gyp-bin"
          [ -x "$gyp_bin/node-gyp" ] || { echo "::error::bundled node-gyp not found at $gyp_bin"; exit 1; }
          echo "$gyp_bin" >> "$GITHUB_PATH"

      - name: Install the BFM's subgraph
        # Not the whole workspace: this job needs one pillar to run, and
        # `@pops/bfm...` pulls exactly it and what it imports.
        working-directory: .
        run: pnpm install --frozen-lockfile --filter "@pops/bfm..."

      # Last, because it is the only step here that depends on every earlier
      # one: it installs the products `build:for-testing` wrote and drives the
      # simulator `test` booted. Its own task rebuilds when those are missing,
      # so a reordering degrades into a second compile rather than into a lie.
      - name: UI flow (Maestro, against a real BFM)
        working-directory: .
        run: mise run e2e:ios