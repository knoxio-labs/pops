name: Agent Review

# Federation review gate: a row of deterministic structural guards
# (load-bearing, blocking) plus an advisory LLM reviewer (degrades to a no-op
# without ANTHROPIC_API_KEY). The two halves share a job but not authority —
# the guards decide whether a change may merge, the reviewer only comments, so
# an unreachable model can never gate a PR.
#
# The guards live here rather than in `quality.yml` because each is a Node
# script reading the source tree — one job, one checkout, eight invariants.
# Every guard runs its own `--self-test` first, so one that has quietly stopped
# catching anything fails the job instead of passing.
#
# THIS JOB IS TIER B and therefore installs the workspace. Three of the eight
# guards read structured config through a real parser — `check-mise-tool-
# overrides` and `check-node-pin` (TOML), `check-homelab-service-isolation`
# (compose YAML) — and a parser needs `node_modules` on disk. The other five
# read JSON, TypeScript source or Markdown and would run fine without the
# install; they ride along because the tier is a property of the JOB, not of
# each guard, and splitting the job would split the required `agent-review`
# context along with it. Do NOT delete the install because the guard you are
# reading happens not to need it. The install-free Tier A jobs are the guard
# jobs in `quality.yml` that own exactly one guard each; the rule, and the list,
# are in docs/architecture/adr-045-guards-must-prove-they-report.md.
#
# Runs on every non-draft PR so the `agent-review` required check always
# reports a result (a never-triggered required check would block forever).

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  agent-review:
    name: agent-review
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guard self-tests (prove the guards catch violations)
        run: |
          node scripts/ci/check-lib-no-pillar-import.mjs --self-test
          node scripts/ci/check-contract-isolation.mjs --self-test
          node scripts/ci/check-known-pillars-coverage.mjs --self-test
          node scripts/ci/check-mise-tool-overrides.mjs --self-test
          node scripts/ci/check-node-pin.mjs --self-test
          node scripts/ci/check-homelab-service-isolation.mjs --self-test
          node scripts/ci/check-docs-model.mjs --self-test
          node scripts/ci/check-tests-typechecked.mjs --self-test
      - name: Isolation litmus — no cross-contract reach-behind
        run: node scripts/ci/check-contract-isolation.mjs --base "origin/${{ github.base_ref }}"
      - name: Lib-never-imports-pillar guard
        run: node scripts/ci/check-lib-no-pillar-import.mjs
      - name: Known-pillars drift guard (PILLARS tuple vs on-disk data pillars)
        run: node scripts/ci/check-known-pillars-coverage.mjs
      - name: Mise toolchain override guard (root pin intact; only node/rust overridable per unit)
        run: node scripts/ci/check-mise-tool-overrides.mjs
      - name: Node pin coherence guard (mise/CI/engines/workflows/images agree on one major)
        run: node scripts/ci/check-node-pin.mjs
      - name: Homelab-service isolation guard (ADR-039 Inv 4 — HA/MQTT/Zigbee2MQTT/Matter never a pops service)
        run: node scripts/ci/check-homelab-service-isolation.mjs
      - name: Docs-model guard (ADR-041 — unit READMEs; no PRD/theme/ideas tree returns; every doc path a doc or comment names resolves)
        run: node scripts/ci/check-docs-model.mjs
      - name: Test-typecheck guard (a unit's tsconfig.json may not hide its own tests from tsc)
        run: node scripts/ci/check-tests-typechecked.mjs
      - name: LLM review (advisory — federation invariants rubric)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/ci/agent-review.mjs --pr ${{ github.event.number }}
