name: Extractability Sandbox

# The real EX-2 proof: each unit stands alone with zero workspace path
# resolution — `scripts/extractability/sandbox.sh` for TS units,
# `scripts/extractability/cargo-sandbox.sh` for the Rust workspace members.
# Both scripts, and `cargo-extract.mjs` underneath the Rust one, describe
# themselves as "nightly / on-demand" — this file is what makes that true.
# Before this workflow existed, nothing invoked either script anywhere in
# CI; grepping the workflows for "sandbox.sh" found only comments.
#
# Heavy by design (a full `pnpm install`/`cargo build` per unit, cold) — see
# each script's own header for why. That is also why this is its own
# workflow rather than a job inside `quality.yml`: it is NOT part of the
# aggregated `CI Gate` context (`ci-gate.yml` does not list "Extractability
# Sandbox" in its `workflows:`/`gated` arrays) and never blocks a PR or the
# merge queue. A red run here is a nightly signal to fix on its own
# schedule, not a merge blocker.
#
# Scope note: this sweeps every unit nightly plus on demand
# (`workflow_dispatch`, optionally scoped to one unit). The complementary
# "exports+dep changes" push trigger — a faster, narrower fan-out over just
# the units a push to `main` actually touched — lives in its own sibling
# workflow, `extractability-sandbox-push.yml`, rather than as a third trigger
# bolted onto this one: a schedule/dispatch filter (this file's `scope` job,
# below) and a push-diff filter (that file's own `discover`) are different
# enough decisions — "every unit, or one dispatched unit" vs. "whatever a
# push's diff touched" — that composing them into one job's `if:` would cost
# more clarity than the duplicated trigger declaration it avoids. What the
# two workflows DO share is the actual sandboxing: both resolve down to a
# `units` JSON array and hand it to the same reusable `ts`/`rust` matrix,
# `_extractability-sandbox-matrix.yml`, so they can't drift into two
# different sandboxing implementations — each caller's only job is deciding
# WHICH units belong in that array.

on:
  schedule:
    # 03:17 UTC daily — off-peak, offset from the hour so it doesn't line up
    # with every other cron a shared runner pool tends to collect at :00.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      unit:
        description: "Single unit dir to sandbox (e.g. pillars/finance, libs/pops-ai). Leave blank to sweep every unit."
        required: false
        type: string

concurrency:
  # Keyed by ref AND the requested unit (or "all" for a full sweep — schedule
  # always sweeps all, and so does a dispatch with no `unit` input). Ref is
  # load-bearing on its own: without it, a `workflow_dispatch` run on a
  # feature branch shares a group with the nightly sweep on `main` (or a
  # dispatch on another branch) and cancels it. Unit is load-bearing
  # separately: without it, two same-ref dispatches scoping DIFFERENT units
  # are unrelated work that would still cancel each other. A second full
  # sweep on the same ref starting before the first finishes is what this
  # still guards against.
  group: extractability-sandbox-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.unit || 'all' }}
  cancel-in-progress: true

jobs:
  discover:
    uses: ./.github/workflows/_discover-units.yml

  # A `unit` input that matches no discovered dir (a typo, a renamed/removed
  # unit) would otherwise make every matrix entry in `ts`/`rust` skip via
  # their per-step `if:` below — the workflow still reports all-green having
  # sandboxed nothing. Fail loud instead, mirroring the "never a silent skip
  # when there IS something to check" rule the sandbox scripts themselves
  # follow (see sandbox.sh's own `proof-surface.mjs` decision comment).
  validate-unit-input:
    name: Validate workflow_dispatch unit input
    needs: discover
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.unit != ''
    runs-on: ubuntu-latest
    steps:
      - name: unit input names a unit _discover-units.yml actually found
        run: |
          set -euo pipefail
          unit='${{ github.event.inputs.unit }}'
          units='${{ needs.discover.outputs.units }}'
          if ! echo "$units" | jq -e --arg u "$unit" 'any(.[]; .dir == $u)' >/dev/null; then
            echo "::error::unit input '$unit' matches no unit _discover-units.yml discovered (pillars/* or libs/*, maxdepth 1). Every matrix entry below would silently skip and this workflow would report a false green — fix the path." >&2
            exit 1
          fi
          echo "OK — '$unit' is a discovered unit."

  # `needs.discover.outputs.units` (every unit, not `changed`) filtered down
  # to the workflow_dispatch `unit` input when one was given — a nightly
  # sweep proves the whole fleet regardless of what any one PR touched, but a
  # scoped dispatch sandboxes only what was asked for. `validate-unit-input`
  # already rejected an unknown `unit` above, so filtering here can assume
  # whatever `unit` names is real; an empty `unit` (schedule, or a dispatch
  # with none given) keeps the full set.
  scope:
    name: Resolve units to sandbox for this run
    needs: [discover, validate-unit-input]
    # `validate-unit-input` is itself conditionally skipped (schedule, or a
    # dispatch with no `unit`) — an implicit default `if:` inherits that skip
    # transitively and would skip this job too on every nightly run, which is
    # the exact "success() over the whole needs graph" trap quality.yml's
    # header warns about. Spelled explicitly: proceed unless discover failed,
    # or validate-unit-input ran and failed.
    if: always() && needs.discover.result == 'success' && needs.validate-unit-input.result != 'failure' && needs.validate-unit-input.result != 'cancelled'
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.compute.outputs.units }}
    steps:
      - id: compute
        run: |
          set -euo pipefail
          units='${{ needs.discover.outputs.units }}'
          unit='${{ github.event.inputs.unit }}'
          if [ -n "$unit" ]; then
            units=$(echo "$units" | jq -c --arg u "$unit" '[.[] | select(.dir == $u)]')
          fi
          echo "units=$units" >> "$GITHUB_OUTPUT"
          echo "Sandboxing:"
          echo "$units" | jq .

  sandbox:
    needs: scope
    # `scope`'s own ancestors include `validate-unit-input`, which is itself
    # conditionally skipped (schedule, or a dispatch with no `unit`) — the
    # default `if: success()` is evaluated over the WHOLE transitive `needs`
    # graph, not just this job's direct `needs: scope`, so that upstream skip
    # would propagate here too and skip sandboxing on every nightly run even
    # though `scope` itself reported success. Same trap, same fix, as
    # `scope`'s own `if:` above and quality.yml's `scope`-gated jobs.
    if: always() && needs.scope.result == 'success'
    uses: ./.github/workflows/_extractability-sandbox-matrix.yml
    with:
      units: ${{ needs.scope.outputs.units }}
