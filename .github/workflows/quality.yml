name: Quality

# Lint / format / module-boundaries gate, scoped to the units a PR actually
# touches. On `pull_request` these run over `scripts/` (root-owned tooling,
# never a unit) plus whatever `pillars/*` + `libs/*` dirs `_discover-units.yml`
# reports as changed for this head — so an unrelated pillar's pre-existing
# violation no longer reds out a sibling PR that never touched it (E31). On
# `push` to `main` (a post-merge commit) they keep the ORIGINAL unscoped
# full-tree sweep as a safety net: a same-ref diff against `origin/main` is
# degenerate there (see the `scope` job), and main must never quietly
# accumulate drift the per-PR scoping missed.
#
# THOSE FOUR JOBS GUARD ON `needs.scope.result` INSTEAD OF TAKING THE DEFAULT.
# A job's default condition is `success()`, and `success()` is evaluated over
# the WHOLE TRANSITIVE `needs` graph — not just the job's direct `needs`. So
# `discover` (PR-only, two hops upstream) being `skipped` on a `push` skipped
# `lint`/`format`/`boundaries`/`exports` with it, even though the intervening
# `scope` job ran and reported `success`. The safety net described above
# therefore never once executed on `main`, and nothing went red to say so: a
# skipped job does not fail a workflow conclusion, so `Quality` and `CI Gate`
# stayed green over an unswept tree. Only an `if:` built from a STATUS CHECK
# FUNCTION breaks that inherited skip — a plain expression such as
# `github.event_name == 'push'` does not, and would silently restore the bug.
# `scripts/ci/__tests__/job-skip-inheritance.test.ts` fails the build if any job
# in any workflow here loses that guard while something conditional sits
# upstream of it.
#
# `merge_group` TAKES THE PUSH PATH, and that is the whole point of it. A merge
# group is prospective `main` — the PR's commits already sitting on top of the
# base they will land on — so the branch that sweeps the whole tree is the
# correct one to run there, and it is the branch that is already proven. Nothing
# else in this file needed a condition: `github.event_name == 'pull_request'` is
# false on a merge group, so `scope` emits "." exactly as it does on a push.
#
# A merge-group run CANNOT be path-filtered. `paths:` is accepted only on
# `push`, `pull_request` and `pull_request_target`; under `merge_group` it is a
# workflow syntax error. Any scoping in the queue lane therefore has to be
# hand-rolled inside the workflow, which is the one place a scoping bug is
# unaffordable — it would leave the queue reporting green over checks it never
# ran, which is the failure the queue exists to prevent.
#
# NO `paths-ignore`: this workflow must trigger on EVERY PR, including docs-only
# ones. A required status check that never runs is reported as "Expected —
# waiting for status" forever and blocks the PR. The ruleset flag
# `strict_required_status_checks_policy: false` governs only the
# branch-up-to-date requirement — it does NOT make a never-reported check
# non-blocking. Excluding docs paths here is exactly what once left docs-only
# PRs permanently unmergeable — the required `Lint`/`Format`/`Module
# boundaries`/`Duplication check` contexts were never emitted. On a docs-only PR
# the scoped jobs run over `scripts/` (always clean) and report green,
# satisfying the ruleset without weakening any code PR.
#
# EVERY JOB BELOW IS LOAD-BEARING. `ci-gate.yml` observes this workflow's
# WORKFLOW-LEVEL conclusion, so a red job anywhere in this file makes the whole
# `Quality` run conclude `failure` and turns the aggregated `CI Gate` context
# red — whether or not that job's own name is listed in the branch ruleset.
# "Not in the ruleset" therefore does NOT mean "cannot block": the only way to
# make a job here advisory is `continue-on-error: true`, which hides it from the
# workflow conclusion entirely. Nothing in this file is advisory, and
# scripts/ci/check-ci-gate-wiring.mjs asserts that no job reintroduces
# `continue-on-error`. See .github/workflows/README.md.
#
# GUARD JOBS COME IN TWO TIERS, and the difference is deliberate. A guard job
# that reads only JSON, plain text or source code runs straight after
# `actions/checkout` with NO `pnpm install` — it answers in seconds and cannot
# be broken by a dependency problem it exists to be independent of. Every
# install-free job below says so in its own header. A guard that must read YAML
# or TOML gets a real parser instead, and its job installs the workspace; those
# live in `agent-review.yml`, `rust-quality.yml` and `docker-build.yml`, not
# here. If you are about to add a parser import to a guard in this file, you are
# moving its job across that line: read
# docs/architecture/adr-045-guards-must-prove-they-report.md first, and add the
# install in the same commit. `scripts/ci/__tests__/guard-job-tiers.test.ts`
# fails the build if the two ever disagree.

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

jobs:
  discover:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_discover-units.yml

  scope:
    name: Determine changed-unit scope
    needs: discover
    if: always()
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.compute.outputs.dirs }}
      clientDirs: ${{ steps.compute.outputs.clientDirs }}
    steps:
      - id: compute
        name: Changed unit dirs (PR), or "." for a full-tree sweep (merge group / push to main)
        env:
          CHANGED: ${{ needs.discover.outputs.changed }}
          CHANGED_CLIENT_DIRS: ${{ needs.discover.outputs.changedClientDirs }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            dirs=$(echo "$CHANGED" | jq -r '(["scripts"] + [.[].dir]) | join(" ")')
          else
            dirs="."
          fi
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "Scope: $dirs"
          # clients/* is outside the pnpm/cargo workspace (ADR-043) so it is
          # never in `dirs` above — carried as its own output and consumed
          # only by Format below, which is the one PR-scoped gate a markdown/
          # JSON/CSS file under clients/ actually needs (Swift formatting and
          # linting is ios-quality.yml's job, and oxlint/depcruise/tsc have
          # nothing to say about a directory with no .ts source).
          echo "clientDirs=$CHANGED_CLIENT_DIRS" >> "$GITHUB_OUTPUT"
          echo "Client scope: $CHANGED_CLIENT_DIRS"

  lint:
    name: Lint
    needs: scope
    if: always() && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: |
          set -euo pipefail
          dirs="${{ needs.scope.outputs.dirs }}"
          if [ "$dirs" = "." ]; then
            pnpm lint
          else
            pnpm exec oxlint --type-aware $dirs
          fi

  format:
    name: Format
    needs: scope
    if: always() && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format check
        run: |
          set -euo pipefail
          dirs="${{ needs.scope.outputs.dirs }}"
          clientDirs="${{ needs.scope.outputs.clientDirs }}"
          if [ "$dirs" = "." ]; then
            pnpm format:check
          else
            pnpm exec oxfmt --check $dirs $clientDirs
          fi

  boundaries:
    name: Module boundaries
    needs: scope
    if: always() && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Module boundaries
        run: |
          set -euo pipefail
          dirs="${{ needs.scope.outputs.dirs }}"
          if [ "$dirs" = "." ]; then
            pnpm lint:boundaries
          else
            pnpm exec depcruise --config .dependency-cruiser.cjs --ignore-known --output-type err $dirs
          fi

  scripts-tests:
    name: Scripts tests
    # The root `vitest.config.ts` includes only `scripts/**/*.test.ts` — the
    # root-owned CI guards / extractability checks under `scripts/`. They have
    # no per-unit mise.toml and so are invisible to the `run-all` fan-out and to
    # the Unit/App/FE Quality matrices; without this job they only ran if a human
    # typed `vitest` locally. This job lands in the Quality workflow, which the
    # `CI Gate` aggregator observes, so the scripts suite reaches that context.
    #
    # The same blind spot exists for TYPE-CHECKING: `scripts/{,ci/,extractability/}
    # __tests__/tsconfig.json` are real tsconfig projects that neither
    # `tsc -b tsconfig.build.json` (references only libs/* and pillars/*) nor
    # `run-all typecheck` (scripts/ has no mise.toml) ever builds, and vitest's
    # esbuild transform runs the tests without type-checking them — so a type
    # error here can sit on `main` indefinitely while both `mise typecheck` and
    # this job's vitest run stay green. `mise run typecheck:scripts` closes that
    # the same way `test:scripts` already closes it for tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `run-all-clients-discovery.test.ts` shells out to the real `mise`
      # binary against a disposable fixture tree, and
      # `check-mise-tool-overrides.test.ts` runs `mise current -C <dir>
      # <tool>` against this repo's own units expecting the real root pin
      # back — so the tools stay installed rather than disabled the way
      # ios-quality.yml disables them for its Xcode-only job. This job
      # ends up installing the same node/pnpm actions/setup-node and
      # pnpm/action-setup would have set up anyway; the two don't fight
      # over PATH because both resolve to the same pinned major.
      - uses: jdx/mise-action@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run scripts/
      - run: mise run typecheck:scripts

  exports:
    name: Exports discipline
    # P6-T02 / ISO-EXPORTS: proves every unit's exports/files whitelist is
    # self-consistent — every exports/main/types target exists and falls under
    # `files`. The compiled units' targets live in `dist/`, so it builds before
    # checking.
    #
    # On a PR this only builds + checks the CHANGED units — each already owns
    # its own `tsconfig.build.json` sub-graph (referencing just its transitive
    # lib deps, e.g. `pillars/finance/tsconfig.build.json` -> ai-telemetry/sdk/
    # settings/types), so `tsc -b` accepts several as separate project roots in
    # one invocation without touching the other pillars. `push` to `main` keeps
    # building the full root `tsconfig.build.json` graph + checking every unit,
    # since exports/files self-consistency is a whole-tree invariant and main
    # must never silently accumulate a break the per-PR scoping missed.
    needs: scope
    if: always() && needs.scope.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate self-test (proves the gate catches broken manifests)
        run: node scripts/check-exports.mjs --self-test
      - name: Build (exports/main/types targets resolve to compiled dist/)
        run: |
          set -euo pipefail
          dirs="${{ needs.scope.outputs.dirs }}"
          if [ "$dirs" = "." ]; then
            pnpm build
          else
            projects=""
            for d in $dirs; do
              [ -f "$d/tsconfig.build.json" ] && projects="$projects $d/tsconfig.build.json"
            done
            if [ -z "$projects" ]; then
              echo "no changed unit owns a tsconfig.build.json — nothing to build"
            else
              pnpm exec tsc -b $projects
            fi
          fi
      - name: Exports/files whitelist self-consistency
        run: |
          set -euo pipefail
          dirs="${{ needs.scope.outputs.dirs }}"
          if [ "$dirs" = "." ]; then
            pnpm exports:check
          else
            node scripts/check-exports.mjs --dirs="$(echo "$dirs" | tr ' ' ',')"
          fi

  composite-references:
    name: Composite/references (tsc -b project graph)
    # `pillars/documents`, `pillars/mcp` and `pillars/orchestrator` once
    # shipped tsconfig.build.json files missing "composite": true and a
    # "references" entry for the @pops/* libs they import — tsc -b could not
    # resolve those libs' declarations and the Docker builds broke. The only
    # thing that ever caught it was the `exports` job above running `tsc -b`
    # over whatever changed-file scope a PR happens to narrow to, so a PR
    # touching one of those pillars alongside anything else broadens the
    # scope enough that the narrow failure path never fires. Unlike `exports`
    # this job runs UNCONDITIONALLY — no `needs: scope`, no changed-dirs
    # narrowing — so it fires on every PR regardless of what else it touches.
    # Reads tsconfig.build.json (JSON) and pillar source (plain text via the
    # shared import-scan.mjs, itself dependency-free), so it skips
    # `pnpm install`. See scripts/ci/check-composite-references.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches missing composite/references)
        run: node scripts/ci/check-composite-references.mjs --self-test
      - name: Every pillar declares composite/references for every composite lib it imports
        run: node scripts/ci/check-composite-references.mjs

  duplication:
    name: Duplication check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # The lake-migration deleted the `apps/pops-api` monolith and the
      # per-pillar `*-db`/`*-contract` packages, so the migration-tombstone
      # ignore entries that suppressed double-counting of lifted code are
      # gone. The pillars under `pillars/*` are now the single source of
      # truth with no surviving duplicate copy to penalise.
      #
      # `**/src/*-api/**` excludes the per-app Hey API clients generated by
      # `openapi-ts` (`client.gen.ts`/`sdk.gen.ts`/`types.gen.ts` plus the
      # `client/` + `core/` runtime under each `<pillar>-api/` dir). That
      # boilerplate is identical across every consumer by construction —
      # counting it as duplication penalises codegen, not authored code,
      # the same reason `**/generated.ts` is already ignored.
      # Fails when TOTAL duplication exceeds `--threshold` (jscpd v4 gates on
      # the aggregate, not per-format). Current tree sits at 2.33% total
      # (measured 2026-06-23 with these exact flags), so threshold 5 is a real
      # gate that is green now with headroom. NO `--exitCode 0` override — that
      # would pin the exit to 0 and make this required check unable to fail.
      - run: npx jscpd@^4 --threshold 5 --min-lines 8 --min-tokens 70 --ignore "**/*.test.{ts,tsx},**/*.spec.{ts,tsx},**/dist/**,**/node_modules/**,**/*.snap,**/*.d.ts,**/generated.ts,**/src/*-api/**,**/db/schema.ts,**/db/seeder.ts" --reporters "console" .

  # --- Extractability fast gates (EX-1 / EX-3) -------------------------------
  # These surface phantom-dependency and baseline-growth regressions. Like every
  # other job in this workflow they are load-bearing through the aggregated
  # `CI Gate` context — see the file header. EX-2 (full sandbox) is heavy and
  # runs nightly (plus on demand), not here — see
  # .github/workflows/extractability-sandbox.yml, which is NOT part of this
  # aggregated gate.
  extractability-deps:
    name: Extractability — declared deps (EX-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm extractability:deps:self-test
      - run: pnpm extractability:deps

  extractability-baseline:
    name: Extractability — baseline monotonicity (EX-3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm extractability:baseline

  bundle-map-coverage:
    name: Bundle-map coverage (RD-10)
    # Asserts every in-repo `pillars/*/app` package is referenced by the shell's
    # static `bundle-map.tsx`, so adding a pillar app and forgetting its entry
    # fails loudly here instead of silently shipping no UI. ADR-002 keeps the
    # bundle map static (one optimized SPA importing the published `@pops/app-*`
    # contract); this guard keeps it complete. The guard reads the source tree
    # directly and pulls in no third-party deps, so it skips `pnpm install`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches a missing pillar app)
        run: node scripts/check-bundle-map-coverage.mjs --self-test
      - name: Every pillar app is referenced by the shell bundle map
        run: node scripts/check-bundle-map-coverage.mjs

  tailwind-source-coverage:
    name: Tailwind @source coverage
    # Asserts every `@source` glob in the single Tailwind theme entry
    # (libs/ui/src/theme/globals.css) matches real files, and that
    # no className-bearing UI file falls outside those globs. Tailwind v4 never
    # errors on an empty `@source` glob, so the pillars/libs rename silently
    # voided the old `apps/*`/`packages/*` globs and collapsed the UI with no
    # build error. This guard makes that class of rot loud. It reads the source
    # tree directly and pulls in no third-party deps, so it skips `pnpm install`.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches a stale/empty glob)
        run: node scripts/check-tailwind-source-coverage.mjs --self-test
      - name: Every @source glob matches files and every UI file is covered
        run: node scripts/check-tailwind-source-coverage.mjs

  design-tokens:
    name: Design tokens in frontend source
    # AGENTS.md "Styling" says colours come from design tokens and nothing
    # else, and until this job nothing enforced it — so every cleanup grew
    # back, one `text-amber-600` at a time. This guard reports raw Tailwind
    # palette utilities (under any variant chain) and literal hex/rgb/oklch
    # inside arbitrary values, across every frontend source tree. It reads the
    # source directly and pulls in no third-party deps, so it skips
    # `pnpm install`. See scripts/ci/check-design-tokens.mjs for what is
    # deliberately exempt (stories, tests, generated clients, the theme itself).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches a planted raw colour)
        run: node scripts/ci/check-design-tokens.mjs --self-test
      - name: Every colour in frontend source comes from a design token
        run: node scripts/ci/check-design-tokens.mjs

  control-characters:
    name: Control characters in committed text
    # A NUL byte once landed inside a template literal, behaved correctly (NUL
    # is a legal separator), and passed every gate — lint, format, typecheck,
    # the pre-commit hook — because none of them look at raw bytes. It was
    # only noticed because `grep`/`git diff` silently reclassify a file with a
    # NUL as binary. This guard reads every tracked text file in the repo
    # byte-by-byte and fails on any C0 control (0x00–0x1F) or DEL (0x7F)
    # other than tab/LF/CR, with an explicit extension allowlist for genuine
    # binary assets (images, fonts, …). Pure `node:fs`/`node:child_process`,
    # no third-party deps, so it skips `pnpm install`. See
    # scripts/ci/check-control-characters.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches a planted control byte)
        run: node scripts/ci/check-control-characters.mjs --self-test
      - name: No disallowed control characters in tracked text
        run: node scripts/ci/check-control-characters.mjs

  vendored-contracts:
    name: Vendored contract drift (ADR-033)
    # A consumer that vendors a producer pillar's OpenAPI snapshot (because the
    # producer has no npm package to depend on — e.g. the Rust `contacts`
    # pillar) must keep its copy byte-identical to the canonical source, or the
    # generated client silently lags the contract. This guard reads the source
    # tree directly and pulls in no third-party deps, so it skips
    # `pnpm install`. See scripts/ci/check-vendored-contracts.mjs and ADR-033.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches drift + orphan)
        run: node scripts/ci/check-vendored-contracts.mjs --self-test
      - name: Every vendored contract matches its canonical source
        run: node scripts/ci/check-vendored-contracts.mjs

  device-signature-fixture:
    name: Device signature encoding (iOS ↔ BFM)
    # The iOS app signs refresh requests with a Secure Enclave P-256 key and the
    # BFM verifies them with `node:crypto`. CryptoKit and `node:crypto` do not
    # default to the same ECDSA signature encoding, and a mismatch surfaces only
    # as a 401 — indistinguishable from a wrong token in either log. The choice
    # is therefore pinned by a committed fixture that both languages assert
    # against; this job is the Node half, and it runs everywhere rather than
    # under the iOS path filter because the BFM can break the contract without
    # touching a line of Swift. Needs no `pnpm install` — `node:crypto` only.
    #
    # The fixture exists twice — canonical under `clients/ios`, vendored inside
    # the BFM's unit boundary because ADR-043 forbids a pillar reading a path
    # under `clients/` — so this job also enforces byte-equality between the
    # copies. That lives here rather than in `vendored-contracts` above: this
    # pair's producer is the CLIENT, which inverts the direction that guard's
    # filename-convention discovery is built around.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches a swapped encoding)
        run: node scripts/ci/check-device-signature-fixture.mjs --self-test
      - name: The committed fixture verifies under node:crypto
        run: node scripts/ci/check-device-signature-fixture.mjs

  refresh-message-fixture:
    name: Refresh signed-message format (BFM ↔ iOS)
    # The job above pins the ECDSA encodings; this one pins the BYTES those
    # encodings are applied to. A handset signs
    # `BFM-REFRESH-V1\n<nonce>\n<sha256(refreshToken)>` and the BFM rebuilds the
    # same string to verify it — two constructions in two languages that no
    # compiler compares. A disagreement over the prefix, the separator count,
    # the digest or the hex case surfaces only as a 401, indistinguishable from
    # an expired token in either log.
    #
    # Both languages therefore read one committed vector, and it exists twice:
    # canonical in `pillars/bfm/contracts/` because the format is the BFM's to
    # define, vendored into `clients/ios/Contracts/` because ADR-043 forbids the
    # client reading a path under `pillars/`. That is the mirror of the job
    # above, whose producer is the client, which is why the copy machinery takes
    # the canonical path as an argument rather than assuming a direction.
    #
    # This job restates the format's properties rather than only re-deriving
    # them: the two unit suites already catch an accidental change, and what
    # they cannot catch is a deliberate one that regenerated the vector along
    # with it. Runs everywhere rather than under the iOS path filter, because
    # the BFM can break the contract without touching a line of Swift. Needs no
    # `pnpm install` — `node:crypto` only.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches a changed message format)
        run: node scripts/ci/check-refresh-message-fixture.mjs --self-test
      - name: The committed vector holds the format both sides build
        run: node scripts/ci/check-refresh-message-fixture.mjs

  cross-pillar-expectations:
    name: Backend cross-pillar expectations (ADR-040)
    # The backend counterpart to `cross-pillar-clients` below. A pillar's
    # SERVER calls a sibling through the pillar-SDK proxy, which is typed by
    # the CALLER and resolves the call at runtime against the producer's
    # OpenAPI `operationId` — so nothing checks the two agree, and a renamed
    # operation breaks the consumer silently in production rather than at
    # build. There is no generated client to diff on this side, so this guard
    # asserts the narrow thing the consumer depends on: the operation still
    # exists, at the expected path and method, with the query parameters the
    # consumer sends. The curated list of those expectations is kept honest by
    # a disk-derived half that enumerates every `pillar(...)` call site under
    # `pillars/*/src` and fails when one has no row, so a new seam cannot ship
    # unguarded while the guard reports OK (ADR-045). A third enumeration
    # covers the way round both of those: a consumer that hand-rolls the HTTP
    # call resolves no operationId and is invisible to the second half, so a
    # federation-aware file calling `fetch` itself fails unless sanctioned.
    # Reads the source tree directly, so it skips `pnpm install`.
    # See scripts/ci/check-cross-pillar-expectations.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (rename, move, dropped param, unlisted seam, unsanctioned fetch)
        run: node scripts/ci/check-cross-pillar-expectations.mjs --self-test
      - name: Every backend cross-pillar expectation holds, and every call site has one
        run: node scripts/ci/check-cross-pillar-expectations.mjs

  cross-pillar-clients:
    name: Cross-pillar generated FE clients (ADR-040)
    # Per-consumer generated FE clients (a consumer app's own Hey API client
    # for a producer pillar's contract: food/app <- lists, finance/app <-
    # contacts, finance/app <- purchases) are a sanctioned but easily-forgotten
    # seam: nothing forces a regenerate when the producer's contract changes,
    # so the committed client can silently outrun it (see ADR-040 and AGENTS.md
    # "Cross-pillar generated FE clients"). This regenerates every such client
    # from its producer's current `./openapi` export and fails on any diff. The
    # `contacts` leg additionally vendors its OpenAPI snapshot (ADR-033); that
    # copy's own drift is covered separately by the `vendored-contracts` job
    # above — this job only re-runs codegen against whatever is committed. The
    # `purchases` leg is gated here from the day its client landed, ahead of any
    # finance page consuming it, so the client cannot rot in the gap.
    #
    # Every leg is ALSO re-checked, more generally, by app-quality.yml's own
    # per-app `Codegen drift` step (`@pops/app-food` and `@pops/app-finance`
    # each own a matrix row that regenerates every one of their generate:*
    # scripts, cross-pillar ones included). That duplication is deliberate,
    # not drift to clean up: this job stays the ADR-040-scoped, explicit
    # source of truth for "which legs are sanctioned cross-pillar consumers"
    # — the list every doc above points at — while app-quality's gate is the
    # general one that would still catch a regression here even if this job
    # were ever deleted.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Regenerate every per-consumer cross-pillar client
        run: |
          pnpm --filter @pops/app-food generate:lists-client
          pnpm --filter @pops/app-finance generate:contacts-client
          pnpm --filter @pops/app-finance generate:purchases-client
      - name: Verify generated clients are up to date
        run: |
          if ! git diff --exit-code -- pillars/food/app/src/lists-api pillars/finance/app/src/contacts-api pillars/finance/app/src/purchases-api; then
            echo ""
            echo "::error::A cross-pillar generated FE client is out of date."
            echo "Run the owning app's generate:*-client script locally and commit the result."
            exit 1
          fi

  generated-clients:
    name: Generated Hey API clients outside the app matrix
    # app-quality.yml's per-app matrix gates every `pillars/<id>/app` unit's
    # generated Hey API client(s). Two more exist outside that matrix — the
    # shell's registry client and overlay-ego's ego client — and had no drift
    # gate at all until now. Rather than hardcode those two names, this calls
    # the same `scripts/ci/check-generated-clients.mjs` app-quality.yml uses,
    # with `--exclude-app-matrix`: it discovers every generate:* Hey API
    # script in the workspace and runs whichever ones are NOT already covered
    # by an app-quality.yml matrix row, so a future non-app unit that adds a
    # generate:* script is picked up with no edit here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate self-test (proves it catches drift, a generator error, and missing output)
        run: node scripts/ci/check-generated-clients.mjs --self-test
      - name: Regenerate and verify every non-app-matrix generated client
        run: node scripts/ci/check-generated-clients.mjs --exclude-app-matrix

  api-types-drift:
    name: Generated OpenAPI type-map drift
    # Every data pillar with a REST contract carries a
    # `pillars/<id>/scripts/generate-api-types.ts` that projects its committed
    # OpenAPI spec into `src/contract/api-types.generated.ts` (the
    # `paths`/`components` types a frontend composes with `openapi-fetch`).
    # Nothing regenerated and diffed that output before this job — each
    # script's own header comment used to say so. This is deliberately a
    # SEPARATE guard from `generated-clients` above: that one discovers
    # `generate:*` scripts that invoke the `openapi-ts` CLI binary directly;
    # these scripts instead run a project-local TS file that calls the
    # `openapi-typescript` library function itself and writes a path baked
    # into the script, not a `--write <dir>` CLI argument, so they need their
    # own discovery and their own runner. See
    # scripts/ci/check-api-types-drift.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Gate self-test (proves it catches drift, a generator error, and missing output)
        run: node scripts/ci/check-api-types-drift.mjs --self-test
      - name: Regenerate and verify every generated api-types module
        run: node scripts/ci/check-api-types-drift.mjs

  escape-hatches:
    name: Escape-hatch ratchet
    # Type-safety escape hatches (`as any`, `as unknown as`, `as never`,
    # `eslint-disable`) in hand-written source may only ever shrink against the
    # committed baseline (.escape-hatch-baseline.json) — a new one fails here.
    # A `progress as never` once laundered a gutted DTO past tsc and crashed the
    # finance import wizard at runtime; this gate keeps that class of regression
    # from landing. It reads the source tree directly and pulls in no
    # third-party deps, so it skips `pnpm install`. See
    # scripts/check-escape-hatches.mjs. `@ts-ignore`/`@ts-nocheck` are blocked
    # separately by the oxlint `ban-ts-comment` rule.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches a new hatch)
        run: node scripts/check-escape-hatches.mjs --self-test
      - name: No new type-safety escape hatches vs baseline
        run: node scripts/check-escape-hatches.mjs

  touch-targets:
    name: Touch-target ratchet
    # Raw <button>/<a> elements in pillar apps + the shell without provable
    # 44px sizing evidence (WCAG 2.5.5) may only ever shrink against the
    # committed baseline (.touch-target-baseline.json) — a new one fails here.
    # The primitive system (Button, Checkbox, RadioGroupItem, Switch,
    # TabsTrigger) already enforces this at the component level; this gate
    # covers the consumer surfaces that bypass it. It reads the source tree
    # directly and pulls in no third-party deps, so it skips `pnpm install`.
    # See scripts/check-touch-targets.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches an unsized element)
        run: node scripts/check-touch-targets.mjs --self-test
      - name: No new unsized raw interactive elements vs baseline
        run: node scripts/check-touch-targets.mjs

  title-icon-consistency:
    name: Title-icon consistency
    # Within one pillar app, top-level (navConfig) pages must either all pass
    # an `icon` to PageHeader or none do, and a present icon must match that
    # page's own nav icon — documented convention only until now. It reads
    # each app's routes.tsx + page source directly and pulls in no
    # third-party deps, so it skips `pnpm install`. See
    # scripts/check-title-icon-consistency.mjs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Gate self-test (proves the guard catches a mix and a mismatch)
        run: node scripts/check-title-icon-consistency.mjs --self-test
      - name: Every app is all-or-none on PageHeader icons, and icons match nav
        run: node scripts/check-title-icon-consistency.mjs
