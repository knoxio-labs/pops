name: Infra Lint

on:
  push:
    branches: [main]
    paths:
      - "infra/litestream/**"
      - "infra/backup/**"
      - "infra/docker-compose.yml"
      - ".github/workflows/infra-lint.yml"
  pull_request:
    paths:
      - "infra/litestream/**"
      - "infra/backup/**"
      - "infra/docker-compose.yml"
      - ".github/workflows/infra-lint.yml"

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            relevant:
              - 'infra/litestream/**'
              - 'infra/backup/**'
              - 'infra/docker-compose.yml'
              - '.github/workflows/infra-lint.yml'

  yaml-lint:
    name: YAML Lint (infra)
    runs-on: ubuntu-latest
    needs: [changes]
    if: always()
    steps:
      - name: "Skip — no relevant changes"
        if: github.event_name == 'pull_request' && needs.changes.outputs.relevant != 'true'
        run: echo "Skipping — no infra changes"
      - uses: actions/checkout@v7
        if: github.event_name == 'push' || needs.changes.outputs.relevant == 'true'
      - name: Lint infra YAML (litestream + backup)
        if: github.event_name == 'push' || needs.changes.outputs.relevant == 'true'
        run: npx yaml-lint infra/litestream/*.yml infra/backup/*.yml

  sidecar-parity:
    name: Litestream sidecar parity
    # Syntax validity is exactly what let infra/litestream/purchases.yml look
    # healthy while mounted nowhere — this job checks the pairing
    # `yaml-lint` above cannot: every infra/litestream/<id>.yml needs a
    # matching <id>-litestream service in infra/docker-compose.yml, and vice
    # versa. See scripts/ci/check-litestream-sidecar-parity.mjs.
    runs-on: ubuntu-latest
    needs: [changes]
    if: always()
    steps:
      - name: "Skip — no relevant changes"
        if: github.event_name == 'pull_request' && needs.changes.outputs.relevant != 'true'
        run: echo "Skipping — no infra changes"
      - uses: actions/checkout@v7
        if: github.event_name == 'push' || needs.changes.outputs.relevant == 'true'
      - uses: actions/setup-node@v7
        if: github.event_name == 'push' || needs.changes.outputs.relevant == 'true'
        with:
          node-version: "24"
      - name: Guard self-test (proves the guard catches a missing/orphan sidecar)
        if: github.event_name == 'push' || needs.changes.outputs.relevant == 'true'
        run: node scripts/ci/check-litestream-sidecar-parity.mjs --self-test
      - name: Every infra/litestream/<id>.yml has a matching <id>-litestream service, and vice versa
        if: github.event_name == 'push' || needs.changes.outputs.relevant == 'true'
        run: node scripts/ci/check-litestream-sidecar-parity.mjs
