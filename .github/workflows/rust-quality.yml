name: Rust Quality

# Self-contained Rust CI lane for the repo-root cargo workspace and the Rust
# pillars it builds (currently `pillars/contacts`, the first Rust pillar).
#
# ADDITIVE by design: it is path-filtered to the Rust tree and runs the whole
# cargo workspace (no matrix). The per-crate changed-only Rust legs live in
# `unit-quality.yml`. Rust pillars carry no `package.json`, so the pnpm pillar
# discovery never sees them. Adding a Rust crate to the workspace
# `Cargo.toml` (e.g. `pops-ai`, `pops-settings`) is covered here with no
# workflow edit because every step operates on the whole workspace.
#
# Caching uses `actions/cache` (already on the repo's allow-list) rather than a
# third-party Rust cache action so the workflow starts under org action policy.

on:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "libs/pops-ai/**"
      - "libs/pops-settings/**"
      - "pillars/contacts/**"
      - "scripts/extractability/**"
      - ".github/workflows/rust-quality.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - "libs/pops-ai/**"
      - "libs/pops-settings/**"
      - "pillars/contacts/**"
      - "scripts/extractability/**"
      - ".github/workflows/rust-quality.yml"
  # Unfiltered: `paths:` is not a legal filter on a merge group, so the queue
  # lane re-runs this for every entry.
  merge_group:

# cancel-in-progress is deliberately OFF — see the matching note in
# ios-quality.yml and the CONVERGENCE comment in ci-gate.yml: cancelling a
# superseded run and admitting the new one is not atomic, and the race can
# drop the new run's registration entirely rather than merely delaying it,
# which leaves the required `CI Gate` check stuck `in_progress`. A superseded
# run is left to finish instead; `queue: single` (the default) still caps
# this group at one pending run.
concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: fmt + clippy + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Pinned, not `stable`. This lane runs `clippy -- -D warnings`, so a new
      # or retuned lint in a fresh stable turns CI red with no change on our
      # side. The version is read from the root `mise.toml` rather than
      # duplicated here, so there is one pin to bump rather than two to keep
      # in step. This lane uses rustup directly (not mise), hence the parse.
      - name: Install Rust toolchain (pinned from mise.toml + rustfmt + clippy)
        run: |
          set -euo pipefail
          version=$(sed -nE 's/^rust *= *"([^"]+)".*/\1/p' mise.toml | head -1)
          if [ -z "$version" ]; then
            echo "::error::no rust pin found in mise.toml [tools]"
            exit 1
          fi
          if [ "$version" = "stable" ]; then
            echo "::error::mise.toml pins rust = \"stable\"; pin an explicit version so clippy -D warnings cannot break on a toolchain release"
            exit 1
          fi
          echo "pinning rust to $version (from mise.toml)"
          rustup toolchain install "$version" --profile minimal --component rustfmt --component clippy
          rustup default "$version"
          rustc --version
          cargo --version

      # Node powers the crate-boundary guard (scripts/extractability/
      # check-cargo-deps.mjs). Pinned to 24 to match the TS lanes.
      #
      # That guard is TIER B: it reads Cargo manifests through a real TOML
      # parser, so the workspace has to be installed before it runs. The install
      # is free here in a way it would not be in a fast gate — this job already
      # compiles and tests the whole cargo workspace, so a cached pnpm install
      # is noise against a `cargo build --all-targets`. See
      # docs/architecture/adr-045-guards-must-prove-they-report.md.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache cargo registry + workspace target + installed tools
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'pillars/contacts/Cargo.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Format check
        run: cargo fmt --all --check

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Crate-boundary + supply-chain gate (federation isolation, P6-T04):
      #   - cargo deny: licence / advisory / source policy over the whole graph
      #     (config: deny.toml at repo root).
      #   - check-cargo-deps.mjs: a lib crate must not depend on a pillar crate,
      #     and no pillar may depend on another pillar (RUST-2a/2b).
      # `--locked` keeps the cargo-deny install reproducible. The binary is
      # cached in ~/.cargo/bin across runs, so guard the install with `command
      # -v`: a bare `cargo install` over an already-present binary ERRORS
      # ("already exists in destination") rather than no-op'ing, so a cache-warm
      # run would fail this step. NON-required — additive gate, ruleset untouched.
      - name: Boundaries + supply chain
        run: |
          command -v cargo-deny >/dev/null 2>&1 || cargo install cargo-deny --locked
          cargo deny check
          node scripts/extractability/check-cargo-deps.mjs --self-test
          node scripts/extractability/check-cargo-deps.mjs

      - name: Build
        run: cargo build --all-targets

      - name: Test
        run: cargo test --all

      - name: OpenAPI spec is current (3.0 emission drift gate)
        run: |
          spec="pillars/contacts/openapi/contacts.openapi.json"

          # A missing or untracked spec must FAIL, not pass vacuously. `git
          # diff` alone ignores untracked files, so a never-committed spec
          # would slip through silently. Assert the file is tracked first.
          if ! git ls-files --error-unmatch "$spec" >/dev/null 2>&1; then
            echo "::error::$spec is not committed. Run 'cargo run -p contacts --bin emit-openapi' and commit the result."
            exit 1
          fi

          cargo run -p contacts --bin emit-openapi

          if [ ! -s "$spec" ]; then
            echo "::error::$spec is empty after emission — the generator produced no document."
            exit 1
          fi

          # Drift gate: the freshly emitted spec must equal the committed one.
          if ! git diff --exit-code -- "$spec"; then
            echo "::error::$spec is out of date."
            echo "Run 'cargo run -p contacts --bin emit-openapi' and commit the result."
            exit 1
          fi
