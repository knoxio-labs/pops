name: Pillar Schema Coverage

on:
  push:
    branches: [main]
    paths:
      - "pillars/*/src/db/**"
      - "pillars/*/migrations/**"
      - "scripts/check-pillar-schema-coverage.mjs"
      - ".github/workflows/pillar-schema-coverage.yml"
  pull_request:
    paths:
      - "pillars/*/src/db/**"
      - "pillars/*/migrations/**"
      - "scripts/check-pillar-schema-coverage.mjs"
      - ".github/workflows/pillar-schema-coverage.yml"

# cancel-in-progress is deliberately OFF — see the matching note in
# ios-quality.yml and the CONVERGENCE comment in ci-gate.yml: cancelling a
# superseded run and admitting the new one is not atomic, and the race can
# drop the new run's registration entirely rather than merely delaying it.
# This workflow isn't gated by `CI Gate`, but a dropped registration here is
# indistinguishable from a genuine skip to anything else that depends on it.
# A superseded run is left to finish instead; `queue: single` (the default)
# still caps this group at one pending run.
concurrency:
  group: pillar-schema-coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  discover:
    name: Discover pillars
    runs-on: ubuntu-latest
    outputs:
      pillars: ${{ steps.list.outputs.pillars }}
      count: ${{ steps.list.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      # Pinned to the same major the other jobs use rather than the runner's
      # preinstalled node: `--list-pillars` runs the guard's own module scope,
      # which uses `import.meta.main`, and that is not in every node the image
      # might ship. No pnpm and no cache — this step installs nothing.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: list
        name: Enumerate pillars with a migrated schema surface
        # Asks the guard itself rather than re-deriving the set with `find`.
        # The two used to agree only by inspection, and a pillar whose
        # `src/db/schema.ts` barrel was renamed fell out of BOTH at once —
        # no job in this matrix and a green workflow, which is the one
        # failure this job exists to make impossible (POPS-1629).
        #
        # `--list-pillars` needs no install: the script's module scope
        # touches nothing but node builtins. It also exits non-zero when a
        # pillar carries a persistence surface it cannot discover, so that
        # drift fails here rather than disappearing into an empty matrix.
        run: |
          set -euo pipefail
          json=$(node scripts/check-pillar-schema-coverage.mjs --list-pillars)
          count=$(echo "$json" | jq 'length')
          echo "pillars=$json" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Discovered $count pillar(s):"
          echo "$json" | jq .

  coverage:
    name: ${{ matrix.pillar }} schema coverage
    needs: [discover]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pillar: ${{ fromJson(needs.discover.outputs.pillars) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build ${{ matrix.pillar }} pillar (with deps)
        # The script imports the pillar's built dist/db/index.js opener to
        # apply its migrations journal against a fresh SQLite DB. `...`
        # pulls in the pillar's workspace dependencies (@pops/types,
        # @pops/pillar-sdk, …) which the opener needs at import.
        run: pnpm --filter "@pops/${{ matrix.pillar }}..." build
      - name: Run schema-coverage check for ${{ matrix.pillar }}
        run: node scripts/check-pillar-schema-coverage.mjs --pillar ${{ matrix.pillar }}

  selftest:
    name: Self-test (script catches injected missing table)
    needs: [discover]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Pick a self-test pillar
        id: pick
        # Use the first discovered pillar so the self-test never hard-codes
        # a pillar name that a future relocation might delete.
        run: |
          set -euo pipefail
          pillar=$(echo '${{ needs.discover.outputs.pillars }}' | jq -r '.[0]')
          echo "pillar=$pillar" >> "$GITHUB_OUTPUT"
          echo "Self-test pillar: $pillar"
      - name: Build ${{ steps.pick.outputs.pillar }} pillar (with deps)
        run: pnpm --filter "@pops/${{ steps.pick.outputs.pillar }}..." build
      - name: Self-test (script catches injected missing table)
        run: |
          set +e
          pillar='${{ steps.pick.outputs.pillar }}'
          node scripts/check-pillar-schema-coverage.mjs \
            --pillar "$pillar" --inject-fake-table "$pillar:fake_self_test_table" 2>&1 | tee out.log
          actual_exit=${PIPESTATUS[0]}
          if [ "$actual_exit" -eq 0 ]; then
            echo "::error::Self-test failed: script exited 0 with an injected fake table"
            exit 1
          fi
          grep -q "fake_self_test_table" out.log || { echo "::error::Self-test failed: script did not flag injected fake table"; exit 1; }
          grep -q "Missing tables" out.log || { echo "::error::Self-test failed: script did not produce 'Missing tables' message"; exit 1; }
          echo "Self-test passed: script correctly catches injected missing tables"
      - name: Self-test (script catches an injected column-default mismatch)
        # The default check is the half of this guard that compares values
        # rather than existence, so "the migration applies" cannot stand in
        # for it. The injected expectation is planted on a column that already
        # carries a real DEFAULT, so this exercises the disagreement branch —
        # the one a genuine drift takes — not the missing-column one.
        run: |
          set +e
          pillar='${{ steps.pick.outputs.pillar }}'
          node scripts/check-pillar-schema-coverage.mjs \
            --pillar "$pillar" --inject-fake-default 2>&1 | tee default.log
          actual_exit=${PIPESTATUS[0]}
          if [ "$actual_exit" -eq 0 ]; then
            echo "::error::Self-test failed: script exited 0 with an injected fake column default"
            exit 1
          fi
          grep -q "__fake_self_test_default__" default.log || { echo "::error::Self-test failed: script did not flag the injected default"; exit 1; }
          grep -q "Column default mismatches" default.log || { echo "::error::Self-test failed: script did not produce 'Column default mismatches' message"; exit 1; }
          echo "Self-test passed: script correctly catches column-default drift"

  done:
    name: Pillar schema coverage
    needs: [discover, coverage, selftest]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        run: |
          set -euo pipefail
          echo "Discovered ${{ needs.discover.outputs.count }} pillar(s)."
          if [ "${{ needs.coverage.result }}" = "failure" ] || [ "${{ needs.coverage.result }}" = "cancelled" ] \
             || [ "${{ needs.selftest.result }}" = "failure" ] || [ "${{ needs.selftest.result }}" = "cancelled" ]; then
            echo "::error::A schema-coverage job failed (coverage=${{ needs.coverage.result }}, selftest=${{ needs.selftest.result }})."
            exit 1
          fi
          echo "Schema coverage OK (coverage=${{ needs.coverage.result }}, selftest=${{ needs.selftest.result }})."
