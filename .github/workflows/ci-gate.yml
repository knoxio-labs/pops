name: CI Gate

# The run's own title, not just its default "CI Gate" / event summary — see
# the RUN LIST VS CHECK RUN paragraph below for why a `workflow_run` run needs
# one.
run-name: >-
  CI Gate for ${{ github.event.workflow_run.head_sha }} on branch
  ${{ github.event.workflow_run.head_branch }} (via ${{ github.event.workflow_run.name }}:
  ${{ github.event.workflow_run.conclusion }})

# Explicit check runs attach this aggregate to the observed commit; workflow_run
# jobs themselves attach to the default branch. Missing expected runs block.
# Each quality run registers independently per SHA. Only after GitHub reports
# its replacement do we cancel obsolete PR runs (POPS-1869).

on:
  workflow_run:
    workflows:
      - "Unit Quality"
      - "FE Quality"
      - "Rust Quality"
      - "App Quality"
      - "Quality"
      - "Registry Generated Quality"
      - "iOS Quality"
      - "Docker Build"
      - "E2E Tests"
    types: [requested, in_progress, completed]

# Serialize publications for a commit; an interrupted API write can otherwise
# overtake its successor. Each queued evaluation reads current sibling states.
concurrency:
  group: ci-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  actions: write
  checks: write
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Publish CI Gate verdict
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate gated workflow conclusions and publish at the observed head
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGERING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const gated = [
              "Unit Quality",
              "FE Quality",
              "Rust Quality",
              "App Quality",
              "Quality",
              "Registry Generated Quality",
              "iOS Quality",
              "Docker Build",
              "E2E Tests",
            ];
            const passing = new Set(["success", "skipped"]);

            // Mirrors each gated workflow's OWN `pull_request.paths` trigger —
            // "Quality" carries none and is deliberately absent here, since it
            // is expected on every pull request unconditionally.
            // `scripts/ci/check-ci-gate-wiring.mjs` asserts this literal object
            // still matches the real files, so an edit to one without the
            // other fails CI rather than silently drifting.
            const PATH_FILTERS = {
              "Unit Quality": [
                "pillars/**",
                "libs/**",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "tsconfig.base.json",
                "tsconfig.build.json",
                ".oxfmtrc.json",
                ".oxlintrc.json",
                "mise.toml",
                "mise.ci.toml",
                "Cargo.toml",
                "Cargo.lock",
                ".github/workflows/unit-quality.yml",
                ".github/workflows/_discover-units.yml",
                ".github/actions/**"
              ],
              "FE Quality": [
                "pillars/shell/**",
                "pillars/*/app/**",
                "pillars/*/openapi/**",
                "libs/navigation/**",
                "libs/date/**",
                "libs/sdk/**",
                "libs/types/**",
                "libs/ui/**",
                ".github/workflows/fe-quality.yml",
                ".github/actions/**"
              ],
              "Rust Quality": [
                "Cargo.toml",
                "Cargo.lock",
                "deny.toml",
                "libs/pops-ai/**",
                "libs/pops-settings/**",
                "pillars/contacts/**",
                "scripts/extractability/**",
                ".github/workflows/rust-quality.yml"
              ],
              "App Quality": [
                "pillars/*/app/**",
                "pillars/*/openapi/**",
                "libs/navigation/**",
                "libs/date/**",
                "libs/sdk/**",
                "libs/types/**",
                "libs/ui/**",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "tsconfig.base.json",
                "tsconfig.build.json",
                "mise.toml",
                "mise.ci.toml",
                ".github/workflows/app-quality.yml",
                ".github/actions/**"
              ],
              "Registry Generated Quality": [
                "libs/module-registry/**",
                "libs/types/**",
                "pillars/**",
                "packages/**",
                ".github/workflows/registry-generated-quality.yml",
                ".github/actions/**"
              ],
              "iOS Quality": [
                "clients/ios/**",
                "pillars/bfm/**",
                "pillars/inventory/**",
                "scripts/ios-e2e/**",
                "pnpm-lock.yaml",
                ".github/workflows/ios-quality.yml",
                ".github/actions/**"
              ],
              "Docker Build": [
                "infra/docker*/**",
                "infra/docker-compose*.yml",
                "**/Dockerfile",
                "**/Dockerfile.*",
                "pillars/*/nginx.conf",
                "pillars/*/nginx/**",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "tsconfig.base.json",
                ".github/workflows/docker-build.yml",
                ".github/actions/**",
                "scripts/ci/smoke-image.mjs"
              ],
              "E2E Tests": [
                "pillars/**",
                "libs/**",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "tsconfig.base.json",
                "tsconfig.build.json",
                ".github/workflows/fe-test-e2e.yml",
                "!pillars/design/**"
              ]
            };

            // A GitHub Actions `paths:` glob, restricted to what this repo's
            // workflows actually use: literal segments, `*` within a segment,
            // and `**` spanning segments. Not a general glob implementation —
            // `?` and `[...]` are unsupported because no gated workflow's
            // `pull_request.paths` uses them. A leading `!` is NOT handled
            // here: it is a property of the pattern LIST, stripped by
            // `matchesPathFilter` before a pattern reaches this function.
            function escapeGlobLiteral(char) {
              return /[.*+?^${}()|[\]\\]/u.test(char) ? `\\${char}` : char;
            }
            function globToRegExp(glob) {
              let source = "";
              let i = 0;
              while (i < glob.length) {
                if (glob.startsWith("**/", i)) {
                  source += "(?:.*/)?";
                  i += 3;
                } else if (glob.startsWith("**", i) && i + 2 === glob.length) {
                  source += ".*";
                  i += 2;
                } else if (glob[i] === "*") {
                  source += "[^/]*";
                  i += 1;
                } else {
                  source += escapeGlobLiteral(glob[i]);
                  i += 1;
                }
              }
              return new RegExp(`^${source}$`);
            }

            // Would `name`'s OWN path filter select at least one file in
            // `files`? `true` when `name` carries no filter at all (always
            // expected). `null` when `files` is unknown — a caller must not
            // read that as "no match".
            //
            // A pattern prefixed with `!` is an EXCLUSION, matching GitHub's
            // own `paths:` semantics: the list is walked in order and the LAST
            // pattern that matches a file decides whether that file is
            // selected. So a file selected by an earlier positive pattern is
            // dropped by a later `!` one, and re-selected by a positive
            // pattern later still. A file no positive pattern ever matched is
            // never selected, which makes a filter of only exclusions select
            // nothing at all — the same as GitHub, where a negation removes
            // from a selection rather than creating one.
            function matchesPathFilter(name, files) {
              const patterns = PATH_FILTERS[name];
              if (!patterns) return true;
              if (files === null) return null;
              const compiled = patterns.map((pattern) => {
                const excluded = pattern.startsWith("!");
                return { excluded, re: globToRegExp(excluded ? pattern.slice(1) : pattern) };
              });
              return files.some((file) => {
                let selected = false;
                for (const { excluded, re } of compiled) {
                  if (re.test(file)) selected = !excluded;
                }
                return selected;
              });
            }

            // Test-only seam: `scripts/ci/__tests__/ci-gate-path-filters.test.ts`
            // sets this global before evaluating this exact script body, so
            // tests exercise the real, deployed matching logic rather than a
            // duplicate copy that could drift from it. Always undefined in
            // production, so this branch never runs there.
            if (typeof globalThis.__ciGateTestHook === "function") {
              globalThis.__ciGateTestHook({ globToRegExp, matchesPathFilter, PATH_FILTERS });
              return;
            }

            core.info(`Triggered by "${process.env.TRIGGERING_WORKFLOW}" (conclusion=${process.env.TRIGGERING_CONCLUSION}) at ${headSha}`);

            const triggeringRun = context.payload.workflow_run;
            const triggeringEvent = triggeringRun.event;
            if (triggeringEvent !== "pull_request" && triggeringEvent !== "merge_group") {
              core.info("Only pull request and merge-group runs can publish an admission verdict.");
              return;
            }
            const pullRequests = triggeringRun.pull_requests || [];
            let pullRequest = null;
            let changedFiles = null;
            if (triggeringEvent === "pull_request") {
              if (pullRequests.length !== 1) {
                core.setFailed("Cannot identify one pull request for this run; no verdict published.");
                return;
              }
              const response = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullRequests[0].number,
              });
              pullRequest = response.data;
              if (pullRequest.state !== "open" || pullRequest.head.sha !== headSha) {
                core.info("Ignoring a closed or superseded pull request head.");
                return;
              }
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  ...context.repo,
                  pull_number: pullRequest.number,
                  per_page: 100,
                });
                changedFiles = files.length < 3000 ? files.map((file) => file.filename) : null;
              } catch (error) {
                core.warning(`Could not list changed files: ${error instanceof Error ? error.message : String(error)}`);
              }
            }

            // Registration is the precondition for cancellation, not its side effect.
            // Never execute or check out PR content in this privileged observer.
            if (pullRequest && context.payload.action !== "completed") {
              const { data: replacement } = await github.rest.actions.getWorkflowRun({
                ...context.repo,
                run_id: triggeringRun.id,
              });
              const current = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullRequest.number,
              });
              if (replacement.head_sha === current.data.head.sha && current.data.state === "open" &&
                  replacement.event === "pull_request" && replacement.status !== "completed" &&
                  replacement.head_repository?.id &&
                  replacement.pull_requests.some((pr) => pr.number === pullRequest.number)) {
                const candidates = await github.paginate(github.rest.actions.listWorkflowRuns, {
                  ...context.repo,
                  workflow_id: replacement.workflow_id,
                  event: "pull_request",
                  branch: replacement.head_branch,
                  per_page: 100,
                });
                for (const run of candidates) {
                  if (run.workflow_id !== replacement.workflow_id || run.id >= replacement.id || run.status === "completed" ||
                      run.event !== "pull_request" ||
                      run.head_repository?.id !== replacement.head_repository?.id ||
                      !run.pull_requests.some((pr) => pr.number === pullRequest.number)) continue;
                  try {
                    await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id });
                    core.info(`Cancelled superseded run ${run.id} after replacement ${replacement.id} registered.`);
                  } catch (error) {
                    core.warning(`Could not cancel run ${run.id}: ${error instanceof Error ? error.message : String(error)}`);
                  }
                }
              }
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              ...context.repo,
              head_sha: headSha,
              event: triggeringEvent,
              per_page: 100,
            });
            const latest = new Map();
            for (const run of [...runs, triggeringRun]) {
              if (!gated.includes(run.name) || run.event !== triggeringEvent || run.head_sha !== headSha) continue;
              if (pullRequest && !run.pull_requests.some((pr) =>
                pr.number === pullRequest.number && pr.base.ref === pullRequest.base.ref
              )) continue;
              const prev = latest.get(run.name);
              if (!prev || run.run_number > prev.run_number || (run.run_number === prev.run_number &&
                  (run.run_attempt > prev.run_attempt || (run.run_attempt === prev.run_attempt &&
                    run.status === "completed" && prev.status !== "completed")))) {
                latest.set(run.name, run);
              }
            }

            const lines = [];
            const failed = [];
            const pending = [];
            for (const name of gated) {
              const run = latest.get(name);
              if (!run) {
                const expected = triggeringEvent === "merge_group" ? true
                  : triggeringEvent === "pull_request" ? matchesPathFilter(name, changedFiles) : false;
                if (expected === false) {
                  lines.push(`  - ${name}: (did not run — path-filtered, treated as pass)`);
                  continue;
                }
                // expected === true (its filter matches this diff, or it has
                // none) or === null (the diff couldn't be determined) — either
                // way this is NOT a confirmed path-filter exclusion, so it
                // cannot count as a pass.
                pending.push(name);
                lines.push(`  - ${name}: (no run registered yet for this commit — treated as pending, not pass)`);
                continue;
              }
              if (run.status !== "completed") {
                pending.push(name);
                lines.push(`  - ${name}: ${run.status} (not yet completed)`);
                continue;
              }
              const c = run.conclusion;
              lines.push(`  - ${name}: ${c}`);
              if (!passing.has(c)) failed.push(`${name} (${c ?? "missing conclusion"})`);
            }

            core.info("Gated workflow states at this commit:");
            for (const l of lines) core.info(l);

            const settled = failed.length > 0 || pending.length === 0;

            const verdict = failed.length > 0
              ? `Quality gate FAILED — ${failed.length} gated workflow(s) did not pass: ${failed.join(", ")}`
              : pending.length > 0
                ? `Quality gate PENDING — no failure yet; still in flight: ${pending.join(", ")}`
                : "Quality gate PASSED — no gated workflow reported a failure at this commit.";

            if (pullRequest) {
              const { data: current } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: pullRequest.number,
              });
              if (current.state !== "open" || current.head.sha !== headSha || current.base.ref !== pullRequest.base.ref) {
                core.info("Pull request changed during evaluation; no verdict published.");
                return;
              }
            }

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "CI Gate",
              head_sha: headSha,
              status: settled ? "completed" : "in_progress",
              ...(settled ? { conclusion: failed.length > 0 ? "failure" : "success" } : {}),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                // The checks API caps `title` at 255 characters and rejects a
                // longer one outright, which would turn a reported failure into
                // an unreported gate. The full list is in `summary`.
                title: verdict.length > 255 ? `${verdict.slice(0, 252)}...` : verdict,
                summary: ["Gated workflow states at this commit:", "", ...lines].join("\n"),
              },
            });

            if (failed.length > 0) {
              core.setFailed(verdict);
              return;
            }
            core.info(verdict);
