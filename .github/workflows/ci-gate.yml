name: CI Gate

# The run's own title, not just its default "CI Gate" / event summary — see
# the RUN LIST VS CHECK RUN paragraph below for why a `workflow_run` run needs
# one.
run-name: >-
  CI Gate for ${{ github.event.workflow_run.head_sha }} on branch
  ${{ github.event.workflow_run.head_branch }} (via ${{ github.event.workflow_run.name }}:
  ${{ github.event.workflow_run.conclusion }})

# Single static-named aggregate over the quality workflows whose own jobs carry
# DYNAMIC matrix names (`finance (pillar) — ts`, `@pops/app-food`, …) and so
# cannot be listed individually in the branch ruleset. Alongside Lint / Format /
# Module boundaries / Duplication + agent-review, the ruleset requires `CI Gate`
# — the ONE static context that can carry every typecheck / test / build /
# clippy / exports / extractability / bundle-map / cargo-deny / drift job. None
# of those is required by name, and all of them block a merge through this
# context. See .github/workflows/README.md.
#
# WHY workflow_run (not needs:): the gated jobs live across EIGHT separate
# workflows, each with its OWN path filters. `needs:` only sees jobs in the
# same run, and folding them into one workflow would (a) double-run every job
# or (b) rename the existing required `Lint`/`Format`/… contexts and break the
# ruleset. `workflow_run` OBSERVES the sibling workflows' results without re-
# executing anything, so it adds zero CI cost and touches none of them.
#
# WHERE THE VERDICT IS PUBLISHED: GitHub attributes a `workflow_run` job's
# IMPLICIT check run to the default branch's tip, never to
# `github.event.workflow_run.head_sha`. Relying on it therefore produced a
# post-hoc signal on `main` that appeared on no pull request at all, and that no
# ruleset could require. So the job does NOT rely on its implicit check run: it
# reads the aggregate and then POSTs an EXPLICIT check run named `CI Gate`
# against the observed head SHA. That context lands on the pull request, and is
# the one the branch ruleset can list. The job itself is named differently so
# its implicit check run on main's tip can never be mistaken for the verdict.
#
# RUN LIST VS CHECK RUN: the paragraph above fixes where the VERDICT is
# published. It does not fix where THIS RUN is filed. `gh run list` / the
# Actions UI always attribute a `workflow_run` run to the default branch's
# tip, regardless of which commit `github.event.workflow_run.head_sha` names —
# so a run that fails while evaluating an unrelated PR branch still shows up
# as a red `CI Gate` on `main`'s run list, with no visible link to the branch
# it actually judged. `run-name` above states the evaluated SHA and branch in
# the run's own title so that mismatch is visible without opening the log;
# `core.setFailed` below is kept so a genuine failure still sorts to the top
# of the list as red, but the run's status describes the commit named in its
# title, never the branch column beside it. To read a commit's real gate
# state, query the check run directly, never the run list:
#   gh api repos/knoxio-labs/pops/commits/<sha>/check-runs \
#     --jq '.check_runs[] | select(.name=="CI Gate")'
#
# ALWAYS REPORTS: `Quality` is gated and `quality.yml` carries no path filter,
# so it runs on EVERY pull request — including docs-only ones. That is what
# guarantees this workflow fires, and therefore that `CI Gate` reports, on every
# pull request. A required context that never reports blocks its PR forever
# (`strict_required_status_checks_policy` governs only the branch-up-to-date
# requirement), so that unfiltered trigger is load-bearing, not incidental. It
# is asserted by scripts/ci/check-ci-gate-wiring.mjs.
#
# CONVERGENCE: this fires on EACH listed workflow's completion and reads the
# CURRENT conclusion of every gated workflow at the same head SHA via the API.
# GitHub keeps the most-recent check run per name as the gate state, so the
# verdict converges on the authoritative one:
#   - a failure is sticky: the failed run stays at the SHA, so any later re-
#     evaluation (triggered by a slower sibling finishing) still sees it -> RED,
#     concluded immediately, because nothing can clear it;
#   - no failure but a sibling still running -> IN PROGRESS, never green. Green
#     here would let a PR merge minutes before the slowest gated workflow has an
#     opinion, and take its failure post-merge;
#   - all-pass: the last sibling to finish triggers a run that sees every gated
#     workflow success/skipped -> GREEN.
# Only a settled evaluation carries a `conclusion`, and it is posted in a single
# call, so no evaluation leaves a half-written check run behind.
#
# THAT CONVERGENCE ASSUMES THE SIBLING'S RUN EVENTUALLY REGISTERS FOR THIS SHA.
# It says nothing about a sibling whose run for THIS head SHA never comes into
# existence at all, which the API reports identically to one genuinely
# excluded by its own `paths:` filter — both are just an absent row. This was
# reproduced directly, not hypothesised: commit `dec13a17` touched
# `clients/ios/**`, so `ios-quality.yml` should have triggered, but its
# previous run (for the commit `dec13a17` superseded) was still executing
# under that workflow's `cancel-in-progress` concurrency group, and no new run
# had registered yet. `listWorkflowRunsForRepo({ head_sha: "dec13a17..." })`
# legitimately returned zero rows for "iOS Quality" — indistinguishable, from
# this script's point of view, from a genuine path-filter exclusion — and CI
# Gate check run `93839365599` published `success` at `2026-08-11T15:53:30Z`
# reporting "iOS Quality: (did not run — path-filtered, treated as pass)".
# PR-time convergence did NOT correct it: that branch's `ios-quality.yml` run
# history holds exactly one run for the whole branch, against an EARLIER
# commit — neither `dec13a17` nor the branch's eventual HEAD, nor an empty
# commit pushed specifically to force a fresh registration, ever got one.
#
# WHY THIS DOES NOT REACH `main`: `merge_group` cannot carry a `paths:` filter
# at all — GitHub rejects the key outright on that event — so every one of the
# eight gated workflows runs UNCONDITIONALLY in the merge queue regardless of
# the diff (see e.g. `ios-quality.yml`'s own `merge_group:` comment). Confirmed
# on the same commit: the queue entry that carried it (head_sha `47a5fd1f...`,
# the commit that actually landed on `main`) ran "iOS Quality" for real,
# completing at `2026-08-11T17:04:02Z`, and the CI Gate evaluation that
# followed (check run `93860105727`, `17:04:11Z`) reflects that REAL result,
# not the absent-run branch. A premature PR-time `success` is therefore a
# misleading EARLY SIGNAL something could act on too soon — never a way for an
# unvalidated gated workflow to actually merge.
#
# A sibling workflow ABSENT from the API result at this head SHA is treated as
# non-failing ONLY once its own `pull_request.paths` filter is checked against
# this evaluation's diff — the `PATH_FILTERS` map and `matchesPathFilter` below,
# mirroring what `_discover-units.yml` does for `pillars/`/`libs/`, and kept in
# sync with each gated workflow's real trigger by
# `scripts/ci/check-ci-gate-wiring.mjs`. A genuine exclusion (a filter is
# declared and the diff doesn't match it) is a pass. Anything else — the filter
# matches, the workflow carries no filter at all ("Quality"), the diff couldn't
# be determined, or this evaluation is neither a `pull_request` nor a
# `merge_group` event (the only two where the diff is trustworthy) — is
# PENDING, never a pass. A gated workflow that then never actually registers a
# run for this SHA (the concurrency-group race above) leaves CI Gate stuck
# `in_progress` instead of reporting green — an empty commit or re-running the
# missing workflow is then required to unstick it. That is the intended trade:
# a required check that never turns green blocks its own PR, which cannot be
# merged by accident, where a false green could be.
#
# MITIGATION: every gated workflow's own `concurrency:` block now runs with
# `cancel-in-progress: false` (was `true`) for exactly this reason — cancelling
# the superseded run and admitting the new one is not atomic on GitHub's side,
# and that two-phase cancel+admit is what the dec13a17/901923b reproduction
# above raced on. Without a cancellation to race, a superseded run is left to
# finish (this repo is public, so the wasted wall-clock costs no Actions
# minutes) and the next push's run still queues normally. This removes the
# specific mechanism behind the reproduction above; it does not change what
# this file does if a run is absent for some other reason — the pending-not-
# pass handling above stays the correct backstop regardless of cause.

on:
  workflow_run:
    workflows:
      - "Unit Quality"
      - "FE Quality"
      - "Rust Quality"
      - "App Quality"
      - "Quality"
      - "Registry Generated Quality"
      - "iOS Quality"
      - "Docker Build"
    types: [completed]

# Key on the observed head SHA, not the gate's own ref: every sibling
# completion for the same commit collapses onto one evaluation lane, and a
# newer commit's evaluation cancels a stale in-flight one.
concurrency:
  group: ci-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: true

permissions:
  actions: read
  checks: write
  contents: read
  pull-requests: read

jobs:
  gate:
    name: Publish CI Gate verdict
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate gated workflow conclusions and publish at the observed head
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          TRIGGERING_WORKFLOW: ${{ github.event.workflow_run.name }}
          TRIGGERING_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        with:
          script: |
            const headSha = process.env.HEAD_SHA;
            const gated = [
              "Unit Quality",
              "FE Quality",
              "Rust Quality",
              "App Quality",
              "Quality",
              "Registry Generated Quality",
              "iOS Quality",
              "Docker Build",
            ];
            const failing = new Set(["failure", "cancelled", "timed_out", "startup_failure", "action_required", "stale"]);

            // Mirrors each gated workflow's OWN `pull_request.paths` trigger —
            // "Quality" carries none and is deliberately absent here, since it
            // is expected on every pull request unconditionally.
            // `scripts/ci/check-ci-gate-wiring.mjs` asserts this literal object
            // still matches the real files, so an edit to one without the
            // other fails CI rather than silently drifting.
            const PATH_FILTERS = {
              "Unit Quality": [
                "pillars/**",
                "libs/**",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "tsconfig.base.json",
                "tsconfig.build.json",
                ".oxfmtrc.json",
                ".oxlintrc.json",
                "mise.toml",
                "mise.ci.toml",
                "Cargo.toml",
                "Cargo.lock",
                ".github/workflows/unit-quality.yml",
                ".github/workflows/_discover-units.yml"
              ],
              "FE Quality": [
                "pillars/shell/**",
                "pillars/*/app/**",
                "pillars/*/openapi/**",
                "libs/navigation/**",
                "libs/sdk/**",
                "libs/types/**",
                "libs/ui/**",
                ".github/workflows/fe-quality.yml"
              ],
              "Rust Quality": [
                "Cargo.toml",
                "Cargo.lock",
                "deny.toml",
                "libs/pops-ai/**",
                "libs/pops-settings/**",
                "pillars/contacts/**",
                "scripts/extractability/**",
                ".github/workflows/rust-quality.yml"
              ],
              "App Quality": [
                "pillars/*/app/**",
                "pillars/*/openapi/**",
                "libs/navigation/**",
                "libs/sdk/**",
                "libs/types/**",
                "libs/ui/**",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "tsconfig.base.json",
                "tsconfig.build.json",
                "mise.toml",
                "mise.ci.toml",
                ".github/workflows/app-quality.yml"
              ],
              "Registry Generated Quality": [
                "libs/module-registry/**",
                "libs/types/**",
                "pillars/**",
                "packages/**",
                ".github/workflows/registry-generated-quality.yml"
              ],
              "iOS Quality": [
                "clients/ios/**",
                "pillars/bfm/openapi/**",
                ".github/workflows/ios-quality.yml"
              ],
              "Docker Build": [
                "infra/docker*/**",
                "infra/docker-compose*.yml",
                "**/Dockerfile",
                "pnpm-lock.yaml",
                "pnpm-workspace.yaml",
                "tsconfig.base.json",
                ".github/workflows/docker-build.yml",
                "scripts/ci/smoke-image.mjs"
              ]
            };

            // A GitHub Actions `paths:` glob, restricted to what this repo's
            // workflows actually use: literal segments, `*` within a segment,
            // and `**` spanning segments. Not a general glob implementation —
            // `?`, `[...]` and a leading `!` negation are unsupported because
            // no gated workflow's `pull_request.paths` uses them.
            function escapeGlobLiteral(char) {
              return /[.*+?^${}()|[\]\\]/u.test(char) ? `\\${char}` : char;
            }
            function globToRegExp(glob) {
              let source = "";
              let i = 0;
              while (i < glob.length) {
                if (glob.startsWith("**/", i)) {
                  source += "(?:.*/)?";
                  i += 3;
                } else if (glob.startsWith("**", i) && i + 2 === glob.length) {
                  source += ".*";
                  i += 2;
                } else if (glob[i] === "*") {
                  source += "[^/]*";
                  i += 1;
                } else {
                  source += escapeGlobLiteral(glob[i]);
                  i += 1;
                }
              }
              return new RegExp(`^${source}$`);
            }

            // Would `name`'s OWN path filter select at least one file in
            // `files`? `true` when `name` carries no filter at all (always
            // expected). `null` when `files` is unknown — a caller must not
            // read that as "no match".
            function matchesPathFilter(name, files) {
              const patterns = PATH_FILTERS[name];
              if (!patterns) return true;
              if (files === null) return null;
              const regexes = patterns.map(globToRegExp);
              return files.some((file) => regexes.some((re) => re.test(file)));
            }

            // Test-only seam: `scripts/ci/__tests__/ci-gate-path-filters.test.ts`
            // sets this global before evaluating this exact script body, so
            // tests exercise the real, deployed matching logic rather than a
            // duplicate copy that could drift from it. Always undefined in
            // production, so this branch never runs there.
            if (typeof globalThis.__ciGateTestHook === "function") {
              globalThis.__ciGateTestHook({ globToRegExp, matchesPathFilter, PATH_FILTERS });
              return;
            }

            core.info(`Triggered by "${process.env.TRIGGERING_WORKFLOW}" (conclusion=${process.env.TRIGGERING_CONCLUSION}) at ${headSha}`);

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: headSha,
              per_page: 100,
            });

            // The diff is only trustworthy for a `pull_request` evaluation
            // with an identified PR (fetched below), or a `merge_group` one
            // (where every gated workflow is unconditional regardless of the
            // diff — `paths:` is not a legal filter on that event at all, so
            // `matchesPathFilter`'s unfiltered branch already covers it).
            // Anything else (a `push` to `main`, e.g.) keeps the pre-existing
            // behavior below: an absent run is treated as filtered-out and
            // passing. `main` is not gated by branch protection, so getting
            // this wrong there does not admit a broken merge — see the
            // CONVERGENCE / WHY THIS DOES NOT REACH `main` comment at the top
            // of this file.
            const triggeringEvent = context.payload.workflow_run.event;
            const pullRequests = context.payload.workflow_run.pull_requests || [];
            let changedFiles = null;
            if (triggeringEvent === "pull_request" && pullRequests.length > 0) {
              try {
                const files = await github.paginate(github.rest.pulls.listFiles, {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pullRequests[0].number,
                  per_page: 100,
                });
                changedFiles = files.map((f) => f.filename);
              } catch (error) {
                const message = error instanceof Error ? error.message : String(error);
                core.warning(`Could not list changed files for PR #${pullRequests[0].number}: ${message}`);
              }
            }
            const diffIsTrustworthy = triggeringEvent === "pull_request" || triggeringEvent === "merge_group";

            // Keep the newest run per gated workflow name (a re-run supersedes
            // an earlier attempt for the same workflow at this SHA).
            const latest = new Map();
            for (const run of runs) {
              if (!gated.includes(run.name)) continue;
              const prev = latest.get(run.name);
              if (!prev || run.run_number > prev.run_number || (run.run_number === prev.run_number && run.run_attempt > prev.run_attempt)) {
                latest.set(run.name, run);
              }
            }

            const lines = [];
            const failed = [];
            const pending = [];
            for (const name of gated) {
              const run = latest.get(name);
              if (!run) {
                const expected = diffIsTrustworthy ? matchesPathFilter(name, changedFiles) : false;
                if (expected === false) {
                  lines.push(`  - ${name}: (did not run — path-filtered, treated as pass)`);
                  continue;
                }
                // expected === true (its filter matches this diff, or it has
                // none) or === null (the diff couldn't be determined) — either
                // way this is NOT a confirmed path-filter exclusion, so it
                // cannot count as a pass.
                pending.push(name);
                lines.push(`  - ${name}: (no run registered yet for this commit — treated as pending, not pass)`);
                continue;
              }
              if (run.status !== "completed") {
                pending.push(name);
                lines.push(`  - ${name}: ${run.status} (not yet completed)`);
                continue;
              }
              const c = run.conclusion;
              lines.push(`  - ${name}: ${c}`);
              if (failing.has(c)) failed.push(`${name} (${c})`);
            }

            core.info("Gated workflow states at this commit:");
            for (const l of lines) core.info(l);

            // A failure is conclusive immediately — it is sticky, so no later
            // evaluation can clear it. Absence of failure is NOT: a sibling
            // still in flight can fail next. Publishing `success` while one is
            // pending would let a PR go green, and mergeable, minutes before
            // the slowest gated workflow has an opinion — the failure would
            // then arrive after the merge. So a pending gate stays
            // `in_progress`, which reads as "Expected" and holds the merge
            // until the last sibling's completion re-fires this and concludes.
            //
            // An in-progress check run from a settled sibling's completion
            // does not strand a PR on its own: concurrency cancels this job
            // only when a NEWER run for the same head SHA starts, and that
            // successor publishes in turn. What CAN strand it is a gated
            // workflow whose run for this SHA never registers at all — see
            // the CONVERGENCE comment at the top of this file for why that
            // happens and why it is the intended failure mode (stuck, not
            // silently green).
            const settled = failed.length > 0 || pending.length === 0;

            const verdict = failed.length > 0
              ? `Quality gate FAILED — ${failed.length} gated workflow(s) did not pass: ${failed.join(", ")}`
              : pending.length > 0
                ? `Quality gate PENDING — no failure yet; still in flight: ${pending.join(", ")}`
                : "Quality gate PASSED — no gated workflow reported a failure at this commit.";

            await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: "CI Gate",
              head_sha: headSha,
              status: settled ? "completed" : "in_progress",
              ...(settled ? { conclusion: failed.length > 0 ? "failure" : "success" } : {}),
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                // The checks API caps `title` at 255 characters and rejects a
                // longer one outright, which would turn a reported failure into
                // an unreported gate. The full list is in `summary`.
                title: verdict.length > 255 ? `${verdict.slice(0, 252)}...` : verdict,
                summary: ["Gated workflow states at this commit:", "", ...lines].join("\n"),
              },
            });

            if (failed.length > 0) {
              core.setFailed(verdict);
              return;
            }
            core.info(verdict);
