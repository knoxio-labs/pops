name: App Quality
run-name: ${{ github.workflow }} for ${{ github.event_name }} into ${{ github.base_ref || github.event.merge_group.base_ref || github.ref_name }}

# Runs each `pillars/*/app` frontend unit's OWN typecheck + test suite.
#
# These members (`@pops/app-<id>` — real pnpm workspace members per
# `pnpm-workspace.yaml`'s `pillars/*/*`, one per UI-bearing pillar) live at
# maxdepth 2 and collide on basename `app`, so they are deliberately OUT of
# `unit-quality.yml`'s `find -maxdepth 1` disk-discovery.
# Before this workflow they were only type+built TRANSITIVELY by the shell in
# `fe-quality.yml`, which never runs their ~180 standalone vitest files — so
# their unit tests never ran in CI. This closes that gap: a dedicated, disk-
# discovered matrix that runs each app's `typecheck` + `test` script directly.
#
# Since POPS-3227 the shell has NO `@pops/app-*` dependency at all — every
# pillar UI is loaded at runtime from its own bundle — so the transitive
# compile that lane used to provide is gone, and this is the only workflow
# that builds an app on an app-source change. `build` is therefore a step
# here, not an omission: a remote bundle fails at rolldown time in ways
# neither typecheck nor vitest can see (an externalised package compiled to a
# bare `require`, a `process` read at module scope), and the reader's only
# symptom is the loader's placeholder. The dependency closure is built first
# (`^...`) so the app's compiled deps (`@pops/types`, `@pops/ui`, the owning
# pillar's generated client, …) resolve. This generalises the former
# single-app `ai-quality.yml` (now retired — app-ai is just another row in
# this matrix) to every app unit.
#
# Generated clients: every app's Hey API client(s) (an app's own, plus a
# cross-pillar consumer client where it has one) are generated from the
# committed OpenAPI snapshots by scripts/codegen/generate.mjs, which the
# install's postinstall already ran. The `Generated clients` step re-runs it
# scoped to the row's package, which fails if the package owns no generator.
#
# Selectors use the manifest `name` (`@pops/app-<id>`) discovered from disk,
# never a hardcoded list, so a newly added pillar app is covered with no edit.
# The matrix is the reverse transitive dependency closure of the changed
# workspace packages: one app edit runs one row; a pillar contract runs its
# consumers; a shared package runs every app that reaches it. Dependency-graph
# inputs and an untrustworthy git base deliberately fall back to all apps.
# `assert-app-coverage` in `_discover-units.yml` keeps every app routed to a
# covering FE workflow; this workflow now ALSO gives each its own unit lane.

on:
  workflow_call:
    inputs:
      full-validation:
        description: Select every app instead of the affected dependency closure
        required: true
        type: boolean
  push:
    branches: [main]
    paths:
      - "pillars/*/app/**"
      - "pillars/*/openapi/**"
      - "libs/navigation/**"
      - "libs/date/**"
      - "libs/sdk/**"
      - "libs/types/**"
      - "libs/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.build.json"
      - "mise.toml"
      - "mise.ci.toml"
      - ".github/workflows/app-quality.yml"
      - ".github/actions/**"
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - "pillars/*/app/**"
      - "pillars/*/openapi/**"
      - "libs/navigation/**"
      - "libs/date/**"
      - "libs/sdk/**"
      - "libs/types/**"
      - "libs/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.build.json"
      - "mise.toml"
      - "mise.ci.toml"
      - ".github/workflows/app-quality.yml"
      - ".github/actions/**"
  # Unfiltered: `paths:` is not a legal filter on a merge group, so the queue
  # lane re-runs this for every entry.
  merge_group:

concurrency:
  group: app-quality-${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

env:
  MISE_ENV: ci

jobs:
  discover:
    name: Discover affected app units
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.scan.outputs.apps }}
      count: ${{ steps.scan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - id: scan
        name: Compute the reverse dependency closure from the changed files
        run: |
          set -euo pipefail
          node scripts/ci/select-affected-apps.mjs --self-test

          force_all=0
          if [ "${{ github.event_name }}" = "merge_group" ] || [ "${{ inputs['full-validation'] }}" = "true" ]; then
            echo "Promotion validation selects every app."
            force_all=1
          elif [ "${{ github.event_name }}" = "push" ]; then
            before='${{ github.event.before }}'
            if [ -n "$before" ] && [ "$before" != "0000000000000000000000000000000000000000" ] && git merge-base --is-ancestor "$before" HEAD 2>/dev/null; then
              base="$before"
            else
              force_all=1
            fi
          else
            base=$(git merge-base "origin/${{ github.base_ref || 'main' }}" HEAD 2>/dev/null) || force_all=1
          fi

          if [ "$force_all" = 1 ]; then
            echo "No trustworthy diff base; selecting every app."
            apps=$(node scripts/ci/select-affected-apps.mjs --all </dev/null)
          else
            echo "Selecting apps affected since $base:"
            git diff --name-only "$base" HEAD
            apps=$(git diff --name-only "$base" HEAD | node scripts/ci/select-affected-apps.mjs)
          fi
          count=$(echo "$apps" | jq 'length')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Selected $count app unit(s):"
          echo "$apps" | jq .

  app:
    name: ${{ matrix.app.pkg }}
    needs: [discover]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-mise

      - name: Expose bundled node-gyp on PATH
        # `better-sqlite3` (a transitive dep of every app's pillar closure) has
        # an install script `prebuild-install || node-gyp rebuild`. The prebuilt
        # path normally wins on ubuntu-latest, but mise-installed node bundles
        # node-gyp under npm WITHOUT putting it on PATH, so any prebuild miss
        # would fail with `node-gyp: not found`. Add npm's node-gyp-bin dir to
        # PATH so the fallback works — mirrors unit-quality.yml.
        run: |
          set -euo pipefail
          gyp_bin="$(dirname "$(mise which node)")/../lib/node_modules/npm/bin/node-gyp-bin"
          [ -x "$gyp_bin/node-gyp" ] || { echo "::error::bundled node-gyp not found at $gyp_bin"; exit 1; }
          echo "$gyp_bin" >> "$GITHUB_PATH"

      - name: Assert --filter matches exactly one package
        # pnpm --filter exits 0 on zero matches (a warning, not an error), so a
        # dir-name != pkg-name skew would silently run nothing. Fail loud.
        run: |
          set -euo pipefail
          n=$(pnpm ls -r --depth -1 --filter "${{ matrix.app.pkg }}" --json | jq 'length')
          [ "$n" = 1 ] || { echo "::error::--filter ${{ matrix.app.pkg }} matched $n packages (expected 1)"; exit 1; }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build dependency closure
        # Deps only (`^...`), so the compiled .d.ts the app's typecheck, test
        # and bundle build all import are materialised before any of them run.
        run: pnpm --filter "${{ matrix.app.pkg }}^..." build

      - name: Generated clients
        # A no-op when postinstall left them current. Every app unit owns at
        # least one Hey API client, so a package with no generator means a
        # renamed script or a stale matrix entry, and fails.
        run: node scripts/codegen/generate.mjs --pkg "${{ matrix.app.pkg }}"

      - name: Typecheck
        run: pnpm --filter "${{ matrix.app.pkg }}" typecheck

      - name: Build the remote bundle
        # The shell `import()`s this artifact at runtime; nothing else in CI
        # produces it on an app-source change (docker-build triggers on
        # Dockerfiles, not app sources). Its own build asserts the
        # shared-runtime packages stayed external and that no bare `process`
        # read survived — both of which fail only here.
        run: pnpm --filter "${{ matrix.app.pkg }}" build

      - name: Test
        # Prefer `test:coverage` when the unit defines it.
        run: |
          set -euo pipefail
          dir='${{ matrix.app.dir }}'
          if node -e "process.exit((require('./$dir/package.json').scripts||{})['test:coverage']?0:1)"; then
            pnpm --filter "${{ matrix.app.pkg }}" test:coverage
          else
            pnpm --filter "${{ matrix.app.pkg }}" test
          fi
