name: App Quality

# Runs each `pillars/*/app` frontend unit's OWN typecheck + test suite.
#
# These members (`@pops/app-<id>` — real pnpm workspace members per
# `pnpm-workspace.yaml`'s `pillars/*/*`, one per UI-bearing pillar) live at
# maxdepth 2 and collide on basename `app`, so they are deliberately OUT of
# `unit-quality.yml`'s `find -maxdepth 1` disk-discovery.
# Before this workflow they were only type+built TRANSITIVELY by the shell in
# `fe-quality.yml`, which never runs their ~180 standalone vitest files — so
# their unit tests never ran in CI. This closes that gap: a dedicated, disk-
# discovered matrix that runs each app's `typecheck` + `test` script directly.
#
# Since POPS-3227 the shell has NO `@pops/app-*` dependency at all — every
# pillar UI is loaded at runtime from its own bundle — so the transitive
# compile that lane used to provide is gone, and this is the only workflow
# that builds an app on an app-source change. `build` is therefore a step
# here, not an omission: a remote bundle fails at rolldown time in ways
# neither typecheck nor vitest can see (an externalised package compiled to a
# bare `require`, a `process` read at module scope), and the reader's only
# symptom is the loader's placeholder. The dependency closure is built first
# (`^...`) so the app's compiled deps (`@pops/types`, `@pops/ui`, the owning
# pillar's generated client, …) resolve. This generalises the former
# single-app `ai-quality.yml` (now retired — app-ai is just another row in
# this matrix) to every app unit.
#
# Codegen drift: every app's generated Hey API client(s) (`generate:*`
# scripts — an app's own client, plus a cross-pillar consumer client where it
# has one, e.g. app-finance also owns `generate:contacts-client`) are
# checked-in output, not built at image time — `unit-quality.yml`'s own
# codegen-drift gate never sees them (maxdepth-1 exclusion above). This lane
# regenerates and diffs every one via `scripts/ci/check-generated-clients.mjs
# --pkg <app>`, which runs for every row in the matrix (each app's
# pre-existing drift was regenerated and committed ahead of widening this).
# `quality.yml`'s `generated-clients` job covers the Hey API clients that
# live OUTSIDE this matrix (the shell, overlay-ego, …) with the same script.
#
# Selectors use the manifest `name` (`@pops/app-<id>`) discovered from disk,
# never a hardcoded list, so a newly added pillar app is covered with no edit.
# `assert-app-coverage` in `_discover-units.yml` keeps every app routed to a
# covering FE workflow; this workflow now ALSO gives each its own unit lane.

on:
  push:
    branches: [main]
    paths:
      - "pillars/*/app/**"
      - "pillars/*/openapi/**"
      - "libs/navigation/**"
      - "libs/date/**"
      - "libs/sdk/**"
      - "libs/types/**"
      - "libs/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.build.json"
      - "mise.toml"
      - "mise.ci.toml"
      - ".github/workflows/app-quality.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "pillars/*/app/**"
      - "pillars/*/openapi/**"
      - "libs/navigation/**"
      - "libs/date/**"
      - "libs/sdk/**"
      - "libs/types/**"
      - "libs/ui/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "tsconfig.build.json"
      - "mise.toml"
      - "mise.ci.toml"
      - ".github/workflows/app-quality.yml"
      - ".github/actions/**"
  # Unfiltered: `paths:` is not a legal filter on a merge group, so the queue
  # lane re-runs this for every entry.
  merge_group:

# cancel-in-progress is deliberately OFF — see the matching note in
# ios-quality.yml and the CONVERGENCE comment in ci-gate.yml: cancelling a
# superseded run and admitting the new one is not atomic, and the race can
# drop the new run's registration entirely rather than merely delaying it,
# which leaves the required `CI Gate` check stuck `in_progress`. A superseded
# run is left to finish instead; `queue: single` (the default) still caps
# this group at one pending run.
concurrency:
  group: app-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MISE_ENV: ci

jobs:
  discover:
    name: Discover app units from disk
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.scan.outputs.apps }}
      count: ${{ steps.scan.outputs.count }}
    steps:
      - uses: actions/checkout@v7
      - id: scan
        name: Walk pillars/*/app/package.json for the manifest name
        # An app unit is any `pillars/*/app` carrying a package.json. Emit the
        # manifest `name` (the only valid `pnpm --filter` selector — basenames
        # all collide on `app`) plus its dir as a display key. Disk-derived so
        # adding a pillar app needs no edit here. The names MUST be @pops/app-*
        # (enforced by assert-app-coverage); fail loud on a stray name so a
        # mis-named member can't silently drop out of the matrix.
        run: |
          set -euo pipefail
          apps=$(find pillars -mindepth 2 -maxdepth 2 -type d -name app | sort | while read -r d; do
            [ -f "$d/package.json" ] || continue
            pkg=$(jq -r '.name' "$d/package.json")
            case "$pkg" in
              @pops/app-*) : ;;
              *) echo "::error::$d is named '$pkg' (expected @pops/app-*) — fix the name or this unit drops out of app-quality" >&2; exit 1 ;;
            esac
            jq -n --arg pkg "$pkg" --arg dir "$d" '{pkg:$pkg,dir:$dir}'
          done | jq -s -c '.')
          count=$(echo "$apps" | jq 'length')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "Discovered $count app unit(s):"
          echo "$apps" | jq .

  app:
    name: ${{ matrix.app.pkg }}
    needs: [discover]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-mise

      - name: Expose bundled node-gyp on PATH
        # `better-sqlite3` (a transitive dep of every app's pillar closure) has
        # an install script `prebuild-install || node-gyp rebuild`. The prebuilt
        # path normally wins on ubuntu-latest, but mise-installed node bundles
        # node-gyp under npm WITHOUT putting it on PATH, so any prebuild miss
        # would fail with `node-gyp: not found`. Add npm's node-gyp-bin dir to
        # PATH so the fallback works — mirrors unit-quality.yml.
        run: |
          set -euo pipefail
          gyp_bin="$(dirname "$(mise which node)")/../lib/node_modules/npm/bin/node-gyp-bin"
          [ -x "$gyp_bin/node-gyp" ] || { echo "::error::bundled node-gyp not found at $gyp_bin"; exit 1; }
          echo "$gyp_bin" >> "$GITHUB_PATH"

      - name: Assert --filter matches exactly one package
        # pnpm --filter exits 0 on zero matches (a warning, not an error), so a
        # dir-name != pkg-name skew would silently run nothing. Fail loud.
        run: |
          set -euo pipefail
          n=$(pnpm ls -r --depth -1 --filter "${{ matrix.app.pkg }}" --json | jq 'length')
          [ "$n" = 1 ] || { echo "::error::--filter ${{ matrix.app.pkg }} matched $n packages (expected 1)"; exit 1; }

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build dependency closure
        # Deps only (`^...`), so the compiled .d.ts the app's typecheck, test
        # and bundle build all import are materialised before any of them run.
        run: pnpm --filter "${{ matrix.app.pkg }}^..." build

      - name: Gate self-test (proves it catches drift, a generator error, and missing output)
        run: node scripts/ci/check-generated-clients.mjs --self-test

      - name: Codegen drift
        # Runs for every app unit in the matrix — every app's pre-existing
        # drift was regenerated and committed ahead of widening this from
        # app-finance only. `--pkg` scopes discovery to exactly this matrix
        # row's package and fails if it matches zero generate:* scripts, on
        # purpose: every app unit today owns at least one Hey API client, so
        # "found none" means the app's script got renamed or the matrix
        # passed a stale package name, not that there is nothing to check. A
        # future app unit that genuinely has no Hey API client would need
        # this step scoped away from it explicitly, not silently skipped.
        run: node scripts/ci/check-generated-clients.mjs --pkg "${{ matrix.app.pkg }}"

      - name: Typecheck
        run: pnpm --filter "${{ matrix.app.pkg }}" typecheck

      - name: Build the remote bundle
        # The shell `import()`s this artifact at runtime; nothing else in CI
        # produces it on an app-source change (docker-build triggers on
        # Dockerfiles, not app sources). Its own build asserts the
        # shared-runtime packages stayed external and that no bare `process`
        # read survived — both of which fail only here.
        run: pnpm --filter "${{ matrix.app.pkg }}" build

      - name: Test
        # Prefer `test:coverage` when the unit defines it.
        run: |
          set -euo pipefail
          dir='${{ matrix.app.dir }}'
          if node -e "process.exit((require('./$dir/package.json').scripts||{})['test:coverage']?0:1)"; then
            pnpm --filter "${{ matrix.app.pkg }}" test:coverage
          else
            pnpm --filter "${{ matrix.app.pkg }}" test
          fi
