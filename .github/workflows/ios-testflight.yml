name: iOS TestFlight

run-name: >-
  iOS TestFlight for ${{ inputs.sha || github.sha }}

# Ships what iOS Quality already proved, and nothing else. iOS Quality runs
# its full job — suite, analyzer, Release check, UI flow — in the merge queue,
# on the very commit that then lands on `main`, and no longer runs on `push`
# at all (POPS-4152: that second run rebuilt the same commit on the shared
# five-runner macOS pool). So this triggers on the push and asks the API what
# the merge group's run said: `scripts/ci/testflight-ship-sha.mjs` picks the
# newest pushed commit whose merge-group iOS job actually ran and passed, and
# ships nothing if the newest one that ran did not pass. A merge that touches
# no iOS input has its lane scoped out, so there is nothing to ship.
#
# Both apps ship from every run. `DesignPlayground` depends on every Feature
# package and on AppCore and DesignSystem, so the two apps share nearly every
# input and a per-app filter would save little — while a filter diffed against
# the parent commit would silently never ship a change whose own run failed.
#
# Not in `ci-gate.yml`: this runs after merge and has nothing to block.
#
# `workflow_dispatch` is for proving the pipeline without a merge (the first
# upload after the App Store Connect setup, POPS-4136), and for re-shipping a
# commit. It takes a commit already on `main`, never a branch tip.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: A commit on main to archive and upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  # Only once the repository variable TESTFLIGHT_ENABLED is `true`, set as the
  # last step of the App Store Connect setup (POPS-4136). Until then both jobs
  # skip rather than failing on missing secrets after every merge.
  pick:
    name: Pick the commit to ship
    if: vars.TESTFLIGHT_ENABLED == 'true' && github.repository == 'knoxio-labs/pops'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      sha: ${{ steps.dispatch.outputs.sha || steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Take the dispatched commit
        id: dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          SHA: ${{ inputs.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Read the landed commit's iOS verdict
        id: push
        if: github.event_name == 'push'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/testflight-ship-sha.mjs

  upload:
    name: Upload Pops and PopsPlayground
    needs: [pick]
    if: always() && needs.pick.result == 'success' && needs.pick.outputs.sha != ''
    runs-on: macos-latest
    # The environment named `main` — deployments restricted to the `main`
    # branch in the repository settings — is the only holder of the App Store
    # Connect key and the team id. The repo is public: a job that does not
    # name this environment cannot read either.
    environment: main
    timeout-minutes: 60
    # The cleanup and both archives share one runner and one keychain. This
    # prevents another run from revoking a certificate while it is in use and
    # lets both apps reuse the same certificate instead of minting one each.
    # Only runs that actually selected an iOS commit enter this group, so a
    # non-iOS push cannot replace a waiting upload.
    concurrency:
      group: ios-testflight-upload
      cancel-in-progress: false
    defaults:
      run:
        working-directory: clients/ios
    env:
      # `generate` needs xcodegen and nothing else mise would install here.
      MISE_DISABLE_TOOLS: rust,node,pnpm,maestro,swiftlint
      SHA: ${{ needs.pick.outputs.sha }}

    steps:
      # Full history: the build number is the commit count.
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
          fetch-depth: 0

      - name: Refuse a commit that is not on main
        run: |
          set -euo pipefail
          git fetch --quiet origin main
          if ! git merge-base --is-ancestor "$SHA" origin/main; then
            echo "::error::$SHA is not on main; only commits on main are shipped."
            exit 1
          fi

      - uses: ./.github/actions/select-xcode

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - uses: ./.github/actions/setup-mise
        with:
          working_directory: clients/ios

      - name: Generate Pops.xcodeproj
        run: mise run generate

      - name: Write the App Store Connect key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/asc-key.p8"
          printf '%s\n' "$ASC_PRIVATE_KEY" > "$key"
          echo "ASC_KEY_PATH=$key" >> "$GITHUB_ENV"

      - name: Archive and upload
        env:
          DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          node ../../scripts/ci/prune-testflight-certificates.mjs
          status=0
          mise run release:testflight Pops || status=1
          mise run release:testflight PopsPlayground || status=1
          exit "$status"

      - name: Remove the App Store Connect key
        if: always()
        run: rm -f "$RUNNER_TEMP/asc-key.p8"
