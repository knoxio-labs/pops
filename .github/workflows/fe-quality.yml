name: FE Quality

on:
  push:
    branches: [main]
    paths:
      - "pillars/shell/**"
      - "pillars/*/app/**"
      # Every pillar's OpenAPI projection feeds the generated FE client.
      # Globbed from disk so a new pillar (or `lists`, previously omitted)
      # is covered without editing this list.
      - "pillars/*/openapi/**"
      - "libs/navigation/**"
      - "libs/sdk/**"
      - "libs/types/**"
      - "libs/ui/**"
      - ".github/workflows/fe-quality.yml"
      - ".github/actions/**"
  pull_request:
    paths:
      - "pillars/shell/**"
      - "pillars/*/app/**"
      - "pillars/*/openapi/**"
      - "libs/navigation/**"
      - "libs/sdk/**"
      - "libs/types/**"
      - "libs/ui/**"
      - ".github/workflows/fe-quality.yml"
      - ".github/actions/**"
  # A merge group cannot carry a `paths:` filter, and `dorny/paths-filter` has
  # no diff base on this event either — so the queue lane takes the same
  # unconditional route a push to `main` takes. Every step below therefore keys
  # on "not a pull request" rather than on `push`: reading it as `push` alone
  # would leave a merge group running the job with every step skipped, which
  # reports green having checked nothing.
  merge_group:

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.filter.outputs.shell }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            shell:
              - 'pillars/shell/**'
              - 'pillars/*/app/**'
              # Glob every pillar's OpenAPI projection so the filter can't
              # drift from the trigger paths (previously omitted inventory
              # + lists, silently skipping FE quality on those changes).
              - 'pillars/*/openapi/**'
              - 'libs/navigation/**'
              - 'libs/sdk/**'
              - 'libs/types/**'
              - 'libs/ui/**'
              - '.github/workflows/fe-quality.yml'
              - '.github/actions/**'

  quality:
    name: Quality Checks
    runs-on: ubuntu-latest
    needs: [changes]
    if: always()
    steps:
      - name: Skip — no relevant changes
        if: github.event_name == 'pull_request' && needs.changes.outputs.relevant != 'true'
        run: echo "No shell/UI changes detected — skipping quality checks"

      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'

      - name: Install pnpm
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build shared packages
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: pnpm --filter "@pops/shell^..." --filter "!./pillars/*/app" build

      - name: Type check
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: cd pillars/shell && pnpm typecheck

      # The committed nginx.conf is the prod BOOT FALLBACK (PRD-255). Gate it
      # for drift here, not only via the Vitest snapshot, so a stale fallback
      # fails the build.
      - name: nginx fallback conf drift gate
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: cd pillars/shell && pnpm gen:nginx:check

      - name: Test
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: cd pillars/shell && pnpm test

      - name: Build
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'
        run: cd pillars/shell && pnpm build
