name: Docker Build

on:
  pull_request:
    paths:
      - "infra/docker*/**"
      - "infra/docker-compose*.yml"
      - "**/Dockerfile"
      - "pillars/*/nginx.conf"
      - "pillars/*/nginx/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/docker-build.yml"
      - ".github/actions/**"
      - "scripts/ci/smoke-image.mjs"
  push:
    branches: [main]
    paths:
      - "infra/docker*/**"
      - "infra/docker-compose*.yml"
      - "**/Dockerfile"
      - "pillars/*/nginx.conf"
      - "pillars/*/nginx/**"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/docker-build.yml"
      - ".github/actions/**"
      - "scripts/ci/smoke-image.mjs"
  # A merge group cannot carry a `paths:` filter, and `dorny/paths-filter` has
  # no diff base on this event either. The `scope` job below is that filter:
  # it reads the `pull_request.paths` list above off disk and answers it
  # against the merge group's own diff, so the queue lane is scoped by the
  # same declaration as the pull-request lane instead of building and smoking
  # sixteen images on every docs-only merge. The implementation is shared with
  # `ios-quality.yml` — `scripts/ci/merge-group-scope.mjs` — precisely so this
  # is not a second hand-copied glob list to keep in step with the one above.
  #
  # The conditions below still key on "not a pull request" rather than on
  # `push`: the `changes` job does not run on a merge group, so a `push`-only
  # test would skip every step and report green over sixteen images nobody
  # built. `scope` narrows which merge groups reach those steps; it does not
  # change what a merge group that DOES reach them runs, which is the full
  # push-to-main sweep.
  merge_group:

# Workflow-level filter keeps the Docker validation off docs/code-only
# PRs entirely. Per-pillar full images are also validated by the
# `*-quality.yml` workflows — this job re-validates every Dockerfile +
# compose surface in one place, gated on changes. (Theme 13 PRD-220.)
#
# The nginx configs the static images ship are in the trigger set for the
# mirror-image reason: the smoke asserts a served header, so the file that
# decides that header must rerun the smoke. Without it an edit dropping the
# entry document's freshness directive — the one that strands browsers on the
# previous deploy's bundle — reaches main with the guard never having run.
#
# `scripts/ci/smoke-image.mjs` is in the trigger set because it IS the gate:
# a change to the harness that stops it asserting anything must run the
# harness. Its unit tests run elsewhere and cannot see that.
#
# `infra/docker-compose.yml` is in the `docker` filter and not only in
# `compose`, because the smoke reads it to decide which `/data/...` volumes to
# mount fresh and require writable. A compose-only edit that adds or drops one
# changes what every image is held to, so it has to rerun the build+smoke
# matrix rather than just `compose-validate`.
#
# Each Dockerfile is BUILT AND STARTED. Building alone is not a gate: under
# pnpm 11 `pnpm deploy --legacy` wrote workspace-escaping `@pops/*` symlinks,
# every Node pillar image built clean, and every one of them died on its
# first import. Only starting the container sees that, so the health probe —
# not the build — is what this workflow asserts.
#
# One job per Dockerfile, in parallel. Building all sixteen in sequence
# took ~12 minutes and was the long pole on every push, while each one
# alone takes a minute or two — the work was never the problem, the queue
# was. `fail-fast: false` so one broken Dockerfile does not hide the rest,
# which is the whole point of validating them together.

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    outputs:
      relevant: ${{ steps.filter.outputs.docker }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            docker:
              - '**/Dockerfile'
              - 'pillars/*/nginx.conf'
              - 'pillars/*/nginx/**'
              - 'infra/docker*/**'
              - 'infra/docker-compose.yml'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.base.json'
              - '.github/workflows/docker-build.yml'
              - '.github/actions/**'
              - 'scripts/ci/smoke-image.mjs'
            compose:
              - 'infra/docker-compose*.yml'
              - '.github/workflows/docker-build.yml'

  # The merge-queue counterpart of `changes` above: `dorny/paths-filter` has no
  # diff base on a merge group, so this job supplies one. Skipped on every other
  # event, hence the status check functions in the two conditions below it.
  #
  # TIER B — it parses this workflow's YAML with a real parser, so it installs.
  # See docs/architecture/adr-045-guards-must-prove-they-report.md.
  scope:
    name: Scope the merge-group lane
    if: github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.scope.outputs.selected }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the merge group's base commit has to be on disk
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Self-test first, for the reason spelled out in ios-quality.yml's copy of
      # this job: a scoping gate that has quietly stopped selecting reports
      # `success` over sixteen images nobody built.
      - name: Scope this workflow against the merge group's diff
        id: scope
        env:
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          set -euo pipefail
          node scripts/ci/merge-group-scope.mjs --self-test
          node scripts/ci/merge-group-scope.mjs \
            --workflow .github/workflows/docker-build.yml \
            --base "$BASE_SHA" --head "$HEAD_SHA" --head-ref "$HEAD_REF"

  discover:
    name: Discover Dockerfiles
    runs-on: ubuntu-latest
    needs: [changes, scope]
    # `!cancelled()` rather than a bare expression: both `changes` and `scope`
    # are event-conditional, and a job whose transitive `needs` graph holds a
    # skipped job takes the default `success()` and is skipped with it. A `scope`
    # job that FAILED leaves its output empty, so this stays skipped there too.
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.scope.outputs.selected == 'true') }}
    outputs:
      dockerfiles: ${{ steps.list.outputs.dockerfiles }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true'

      - name: List every pillar Dockerfile
        id: list
        # Discovered from disk rather than a static list, so adding or
        # removing a pillar needs no edit here. An empty list is how a PR
        # with no Docker-relevant changes skips the builds entirely.
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] && \
             [ "${{ needs.changes.outputs.relevant }}" != "true" ]; then
            echo "No Docker-relevant changes detected — skipping"
            echo 'dockerfiles=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          found=$(find pillars -maxdepth 2 -name Dockerfile | sort |
            jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "found ${found}"
          echo "dockerfiles=${found}" >> "$GITHUB_OUTPUT"

  docker-build:
    name: Build + smoke image
    runs-on: ubuntu-latest
    needs: [discover]
    if: always() && needs.discover.outputs.dockerfiles != '[]' && needs.discover.outputs.dockerfiles != ''
    strategy:
      fail-fast: false
      matrix:
        dockerfile: ${{ fromJson(needs.discover.outputs.dockerfiles) }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: pnpm

      # The smoke harness parses infra/docker-compose.yml with a real YAML
      # parser rather than a hand-rolled scanner, so it needs the workspace's
      # node_modules. Without this the harness dies on ERR_MODULE_NOT_FOUND
      # before it starts a single container — which reads, from the outside,
      # exactly like sixteen broken images.
      - run: pnpm install --frozen-lockfile

      # The FULL image, not `--target builder`. A builder-stage build cannot
      # see the class of bug that broke every Node pillar image under pnpm 11:
      # `pnpm deploy --legacy` wrote relative `@pops/*` symlinks that escaped
      # the deploy dir, so the build succeeded, the image exported clean, and
      # the container died on its first import. The runtime stage is a handful
      # of COPYs on top of the builder — this costs almost nothing extra.
      - name: Build ${{ matrix.dockerfile }}
        id: build
        run: |
          set -euo pipefail
          tag="pops-smoke:$(basename "$(dirname "${{ matrix.dockerfile }}")")"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          docker build -f "${{ matrix.dockerfile }}" -t "$tag" .

      # Start it on never-before-mounted volumes and require both a health
      # response and a writable data mount. This is the gate; the build above
      # is only its precondition.
      - name: Smoke ${{ matrix.dockerfile }}
        run: node scripts/ci/smoke-image.mjs "${{ matrix.dockerfile }}" "${{ steps.build.outputs.tag }}"

  compose-validate:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    needs: [changes, scope]
    if: ${{ !cancelled() && (github.event_name != 'merge_group' || needs.scope.outputs.selected == 'true') }}
    steps:
      - name: Skip — no compose changes
        if: github.event_name == 'pull_request' && needs.changes.outputs.compose != 'true'
        run: echo "No compose changes detected — skipping"

      - uses: actions/checkout@v7
        if: github.event_name != 'pull_request' || needs.changes.outputs.compose == 'true'

      - name: Stub secret files referenced by compose
        if: github.event_name != 'pull_request' || needs.changes.outputs.compose == 'true'
        run: |
          mkdir -p secrets
          for f in notion_api_token up_bank_token up_webhook_secret claude_api_key \
                   telegram_bot_token telegram_bot_token_dev finance_api_key pops_api_key \
                   tmdb_api_key thetvdb_api_key \
                   paperless_secret_key paperless_admin_password; do
            : > "secrets/$f"
          done

      - name: Validate production compose
        if: github.event_name != 'pull_request' || needs.changes.outputs.compose == 'true'
        run: docker compose -f infra/docker-compose.yml config --quiet

      - name: Validate dev compose
        if: github.event_name != 'pull_request' || needs.changes.outputs.compose == 'true'
        run: docker compose -f infra/docker-compose.dev.yml config --quiet
