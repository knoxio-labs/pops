## Litestream replication config — purchases pillar SQLite.
##
## Mirrors the per-pillar pattern (ADR-026) so each pillar's database
## streams independently of every other.
##
## Production deployment lives in the homelab-infra repo (see AGENTS.md
## for the deployment model); this file is the canonical reference the
## deployer copies into its own Litestream config. The replica target
## (bucket name, region, credentials) is provided by the deployer's
## environment — leave it as a `${PURCHASES_LITESTREAM_REPLICA_URL}`
## style placeholder here.
##
## Restore drill (single line — safe to copy/paste during an incident):
##   litestream restore -o /data/sqlite/purchases.db "${PURCHASES_LITESTREAM_REPLICA_URL}"
## Stop the purchases-api container first so it isn't writing
## concurrently. Reference stub — no sidecar streams this pillar yet;
## the drill is not yet exercised.
##
## Worth backing up despite being derivable: the source exports can be
## re-downloaded, but the confirmed purchase↔transaction links cannot.
## Those are human decisions, and re-deriving them is exactly what the
## engine is forbidden to do (ADR-042).

dbs:
  - path: /data/sqlite/purchases.db
    replicas:
      - url: ${PURCHASES_LITESTREAM_REPLICA_URL}
        sync-interval: 1s
        retention: 24h
        snapshot-interval: 1h
        validation-interval: 12h
