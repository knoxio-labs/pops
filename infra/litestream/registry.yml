## Litestream replication config — registry pillar SQLite (the pillar
## formerly named `core`).
##
## Per-pillar replication config (ADR-026 / ADR-039 Invariant 2): each pillar's
## database streams independently, with no shared database.
##
## Production deployment lives in the homelab-infra repo (see AGENTS.md for the
## deployment model); this file is the canonical reference the deployer copies
## into its own Litestream config. The replica target (S3 bucket name, region,
## credentials) is provided by the deployer's environment — left as a
## `${REGISTRY_LITESTREAM_REPLICA_URL}` style placeholder here.
##
## STATUS (ADR-039): reference stub. No sidecar streams registry in production
## yet — the #3694 pilot covers finance/contacts/cerebrum; registry is part of
## the fan-out. The core→registry rename has shipped (the live on-disk file is
## `registry.db`; the pillar's `REGISTRY_SQLITE_PATH` points at it), so this
## config targets `registry.db`. Restore drill not yet exercised.
##
## Restore drill (single line — safe to copy/paste during an incident):
##   litestream restore -o /data/sqlite/registry.db "${REGISTRY_LITESTREAM_REPLICA_URL}"
## Stop the registry-api container first so it isn't writing concurrently.

dbs:
  - path: /data/sqlite/registry.db
    replicas:
      - url: ${REGISTRY_LITESTREAM_REPLICA_URL}
        # Per-pillar config so a single-pillar restore doesn't pull in
        # another pillar's data.
        sync-interval: 1s
        retention: 24h
        snapshot-interval: 1h
        validation-interval: 12h
