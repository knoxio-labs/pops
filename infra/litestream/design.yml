## Litestream replication config — design pillar SQLite (comment threads).
##
## Per-pillar replication config (ADR-026 / ADR-039 Invariant 2): each pillar's
## database streams independently, with no shared database. A pillar without a
## file here is a pillar with no backup, and nothing anywhere reports that
## absence — which is why this lands with the container rather than after it.
##
## Production deployment lives in the homelab-infra repo (see AGENTS.md for the
## deployment model); this file is the canonical reference the deployer copies
## into its own Litestream config. The replica target (bucket name, region,
## credentials) is provided by the deployer's environment — left as a
## `${DESIGN_LITESTREAM_REPLICA_URL}` style placeholder here.
##
## Like bfm's and unlike the older stubs, this stream is real: `design-api`
## mounts `pops-design-data` at `/data/sqlite` and `design-litestream` mounts
## the same volume read-only, so the path below is a database that exists.
## Restore drill not yet exercised.
##
## Restore drill (single line — safe to copy/paste during an incident):
##   litestream restore -o /data/sqlite/design.db "${DESIGN_LITESTREAM_REPLICA_URL}"
## Stop the design-api container first so it isn't writing concurrently.
##
## Worth backing up despite being small: a comment thread is the only record of
## a design decision that was asked for and not yet made. Losing the file loses
## the questions, not just their answers — nothing else in the tree holds them.

dbs:
  - path: /data/sqlite/design.db
    replicas:
      - url: ${DESIGN_LITESTREAM_REPLICA_URL}
        # Per-pillar config so a single-pillar restore doesn't pull in
        # another pillar's data.
        sync-interval: 1s
        retention: 24h
        snapshot-interval: 1h
        validation-interval: 12h
