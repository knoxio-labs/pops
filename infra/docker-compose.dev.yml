# Development compose — uses local build: contexts. Production uses ghcr.io images (see mu-deploy).
services:
  # ── JOB QUEUE ────────────────────────────────────────────────────
  pops-redis:
    image: redis:7-alpine
    container_name: pops-redis
    restart: unless-stopped
    networks:
      - backend
    volumes:
      - pops-redis-data:/data
    command: redis-server --save "" --appendonly no --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # ── BACKEND ──────────────────────────────────────────────────────

  # Registry pillar API (ADR-026, Phase 3 PR 3; the pillar formerly named
  # `core`). Sibling pillars treat the registry container as the authoritative
  # pillar registry: `GET /pillars` returns a snapshot derived from the
  # `POPS_PILLARS` env plus a synthetic `registry` entry.
  # `depends_on: registry-api (started)` (below) only orders container start —
  # it no longer gates on the registry healthcheck. Every sibling pillar
  # listens before it registers and retries registration in the background
  # (ADR-039 E08), so a slow or unhealthy registry delays self-registration,
  # never fleet cold-start.
  #
  # DUAL-ALIAS RENAME WINDOW: the service is named `registry-api` but carries
  # the legacy `core-api` network alias on BOTH networks so a not-yet-rebuilt
  # pillar image (whose baked-in SDK default still dials `http://core-api:3001`)
  # keeps resolving to this same container during the rename rollout.
  registry-api:
    build:
      context: ..
      dockerfile: pillars/registry/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-registry
    restart: unless-stopped
    networks:
      frontend:
        aliases:
          - core-api
          - registry-api
      backend:
        aliases:
          - core-api
          - registry-api
    volumes:
      - sqlite-data:/data/sqlite
    environment:
      NODE_ENV: production
      PORT: '3001'
      # On-disk SQLite filename stays `core.db` through the rename window; the
      # deployer renames the live file to `registry.db` out of band and flips
      # this path in the same change (flipping early boots the registry empty).
      CORE_SQLITE_PATH: /data/sqlite/core.db
      REGISTRY_SELF_BASE_URL: http://registry-api:3001
      # Cross-pillar registry — registry-api hosts the authoritative
      # `/pillars` snapshot that the shell's nginx proxy fans out to,
      # so it MUST default to the full sibling list rather than empty.
      # Sibling pillars get appended (id:baseUrl,...) as they extract.
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
    expose:
      - '3001'
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Inventory pillar API (ADR-026, Phase 3 PR 2 of the inventory track).
  # Hosts inventory.db reads/writes for locations, home_inventory,
  # fixtures, item_connections, item_documents, item_photos,
  # item_uploaded_files, and item_fixture_connections. Subsequent PRs
  # move the tRPC routers + URI dispatcher behind it.
  inventory-api:
    build:
      context: ..
      dockerfile: pillars/inventory/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-inventory
    restart: unless-stopped
    networks:
      - frontend
      - backend
    volumes:
      - sqlite-data:/data/sqlite
    environment:
      NODE_ENV: production
      PORT: '3002'
      INVENTORY_SQLITE_PATH: /data/sqlite/inventory.db
      INVENTORY_SELF_BASE_URL: http://inventory-api:3002
      # Cross-pillar registry. Includes registry-api by default so /pillars
      # surfaces both host pillars on the synthetic-entry list.
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
    expose:
      - '3002'
    depends_on:
      registry-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3002/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Finance pillar API (ADR-026, Phase 3 PR 2 of the finance track).
  # Hosts finance.db reads/writes for the wish_list slice today;
  # subsequent slices (budgets, transactions, imports, tag rules, tag
  # vocabulary, URI dispatcher) move their tRPC routers behind it.
  finance-api:
    build:
      context: ..
      dockerfile: pillars/finance/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-finance
    restart: unless-stopped
    networks:
      - frontend
      - backend
    volumes:
      - sqlite-data:/data/sqlite
    environment:
      NODE_ENV: production
      PORT: '3004'
      FINANCE_SQLITE_PATH: /data/sqlite/finance.db
      FINANCE_SELF_BASE_URL: http://finance-api:3004
      # AI telemetry sink — the @pops/ai-telemetry wrapper POSTs usage to
      # `${AI_API_URL}/ai-usage/record` (internal-token gated). Read FIRST so it
      # never collides with a self-pointing POPS_API_URL.
      AI_API_URL: http://ai-api:3008
      # Cross-pillar registry — included for parity with siblings even
      # though finance-api today only exposes /health.
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
    expose:
      - '3004'
    depends_on:
      registry-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3004/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Media pillar API (ADR-026, Phase 3 PR 2 of the media track). Hosts
  # media.db reads/writes for the shelf_impressions slice today;
  # subsequent slices (watchlist, watch_history, comparisons, rotation,
  # debrief, …) move their tRPC routers + URI dispatcher behind it.
  media-api:
    build:
      context: ..
      dockerfile: pillars/media/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    image: ghcr.io/${POPS_IMAGE_OWNER:-knoxio-labs}/pops-media:${POPS_IMAGE_TAG:-main}
    container_name: pops-media-api
    restart: unless-stopped
    networks:
      - frontend
      - backend
    volumes:
      - sqlite-data:/data/sqlite
      # Local cache of downloaded poster/backdrop art (regeneratable —
      # excluded from Litestream, see AGENTS.md's exclusion list).
      - media-images-data:/data/media/images
    environment:
      NODE_ENV: production
      PORT: '3003'
      MEDIA_SQLITE_PATH: /data/sqlite/media.db
      MEDIA_SELF_BASE_URL: http://media-api:3003
      # Cross-pillar registry. Includes registry-api + inventory-api by default
      # so /pillars surfaces every host pillar on the synthetic-entry list.
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
      MEDIA_IMAGES_DIR: /data/media/images
    expose:
      - '3003'
    depends_on:
      registry-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3003/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Food pillar API (ADR-026, Phase 3 PR 2 of the food track). Hosts
  # food.db reads/writes today exposes only /health + /pillars;
  # subsequent slices (recipes, ingredients, ingest, meal planning,
  # review queue, URI dispatcher) move their tRPC routers behind it.
  food-api:
    build:
      context: ..
      dockerfile: pillars/food/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-food
    restart: unless-stopped
    networks:
      - frontend
      - backend
    volumes:
      - sqlite-data:/data/sqlite
      # Shares the ingest media root with pops-worker-food — the worker
      # writes downloaded media here and the API serves it back; both must
      # resolve the SAME path or reads/writes silently miss each other.
      - food-ingest-data:/data/food/ingest
    environment:
      NODE_ENV: production
      PORT: '3005'
      FOOD_SQLITE_PATH: /data/sqlite/food.db
      FOOD_SELF_BASE_URL: http://food-api:3005
      # AI telemetry sink — read FIRST so it never collides with a
      # self-pointing POPS_API_URL (see @pops/ai-telemetry report-sink).
      AI_API_URL: http://ai-api:3008
      # Cross-pillar registry — included for parity with siblings even
      # though food-api today only exposes /health.
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
      FOOD_INGEST_DIR: /data/food/ingest
    expose:
      - '3005'
    depends_on:
      registry-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3005/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Lists pillar API (ADR-026, Phase 3 PR 2 of the lists track). Hosts
  # lists.db reads/writes today exposes only /health + /pillars;
  # subsequent slices (list CRUD, item CRUD, bulk-add, reorder,
  # URI dispatcher) move their tRPC routers behind it.
  lists-api:
    build:
      context: ..
      dockerfile: pillars/lists/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-lists
    restart: unless-stopped
    networks:
      - frontend
      - backend
    volumes:
      - sqlite-data:/data/sqlite
    environment:
      NODE_ENV: production
      PORT: '3006'
      LISTS_SQLITE_PATH: /data/sqlite/lists.db
      LISTS_SELF_BASE_URL: http://lists-api:3006
      # Cross-pillar registry — included for parity with siblings even
      # though lists-api today only exposes /health.
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
    expose:
      - '3006'
    depends_on:
      registry-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3006/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # AI Ops pillar API (PRD-055). Hosts ai.db reads/writes for the AI-ops
  # telemetry slice + the cross-pillar ingest `POST /ai-usage/record`
  # (internal-token gated). nginx routes /ai-api/ here on port 3008.
  ai-api:
    build:
      context: ..
      dockerfile: pillars/ai/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-ai
    restart: unless-stopped
    networks:
      - frontend
      - backend
    volumes:
      - sqlite-data:/data/sqlite
    environment:
      NODE_ENV: production
      PORT: '3008'
      AI_SQLITE_PATH: /data/sqlite/ai.db
      AI_SELF_BASE_URL: http://ai-api:3008
      # Verifies a per-caller `x-pops-internal-credential` on `POST /ai-usage/record`
      # (ADR-039 E22). The reporting pillars (finance/food/cerebrum) each present
      # their own credential.
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
    expose:
      - '3008'
    depends_on:
      registry-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3008/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cerebrum pillar API (ADR-026). Hosts the cerebrum REST surface on
  # port 3007; nginx routes /cerebrum-api/ here. Built from the pillar
  # Dockerfile (its default CMD is the API server) — same image the
  # cerebrum-worker ships.
  cerebrum-api:
    build:
      context: ..
      dockerfile: pillars/cerebrum/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-cerebrum-api
    restart: unless-stopped
    networks:
      - frontend
      - backend
    volumes:
      - sqlite-data:/data/sqlite
      - cerebrum-engrams-data:/data/cerebrum/engrams
    environment:
      NODE_ENV: production
      PORT: '3007'
      REDIS_HOST: pops-redis
      REDIS_PORT: '6379'
      CEREBRUM_SQLITE_PATH: /data/sqlite/cerebrum.db
      CEREBRUM_ENGRAMS_DIR: /data/cerebrum/engrams
      CEREBRUM_SELF_BASE_URL: http://cerebrum-api:3007
      # AI telemetry sink — read FIRST so it never collides with the
      # self-pointing POPS_API_URL cerebrum sets elsewhere.
      AI_API_URL: http://ai-api:3008
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
    expose:
      - '3007'
    depends_on:
      pops-redis:
        condition: service_healthy
      registry-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3007/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cerebrum pillar worker (ADR-026). Consumes the `pops-embeddings`
  # (dense-vector index) + `pops-curation` (engram enrichment) queues the
  # cerebrum pillar produces into. Same image the cerebrum-api ships, with
  # the worker entrypoint as the command. Built from the pillar Dockerfile.
  cerebrum-worker:
    build:
      context: ..
      dockerfile: pillars/cerebrum/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-cerebrum-worker
    restart: unless-stopped
    command: ['node', 'dist/worker/index.js']
    networks:
      - backend
    volumes:
      - sqlite-data:/data/sqlite
      - cerebrum-engrams-data:/data/cerebrum/engrams
    environment:
      NODE_ENV: production
      REDIS_HOST: pops-redis
      REDIS_PORT: '6379'
      CEREBRUM_SQLITE_PATH: /data/sqlite/cerebrum.db
      CEREBRUM_ENGRAMS_DIR: /data/cerebrum/engrams
      # AI telemetry sink — the worker's @pops/ai-telemetry wrapper POSTs usage
      # to `${AI_API_URL}/ai-usage/record` (internal-token gated).
      AI_API_URL: http://ai-api:3008
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EMBEDDING_API_URL: ${EMBEDDING_API_URL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-}
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
    depends_on:
      pops-redis:
        condition: service_healthy

  # Contacts pillar API — the first Rust pillar (axum + sqlx + utoipa).
  # Authoritative entities store; nginx routes /contacts-api/ here on port
  # 3010. Built from its hand-written multi-stage Rust Dockerfile. Unlike the
  # TS pillars it self-registers via POPS_REGISTRY_ENABLED=true: its Rust
  # registry transport POSTs the register/heartbeat/deregister envelopes to
  # core, trying the canonical /registry/* path then the legacy
  # /core.registry.* path on a 404.
  contacts-api:
    build:
      context: ..
      dockerfile: pillars/contacts/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-contacts
    restart: unless-stopped
    networks:
      - frontend
      - backend
    volumes:
      - sqlite-data:/data/sqlite
    environment:
      PORT: '3010'
      CONTACTS_SQLITE_PATH: /data/sqlite/contacts.db
      CONTACTS_SELF_BASE_URL: http://contacts-api:3010
      # Opt in to registry self-registration (the Rust lifecycle is gated on
      # this, mirroring the TS SDK's POPS_REGISTRY_ENABLED).
      POPS_REGISTRY_ENABLED: 'true'
      POPS_REGISTRY_URL: ${POPS_REGISTRY_URL:-http://registry-api:3001}
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
    expose:
      - '3010'
    depends_on:
      registry-api:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3010/health']
      interval: 30s
      timeout: 5s
      retries: 3

  # Backend-for-Mobile pillar API (ADR-035 data kind), built from source. The
  # single backend the native iPhone client dials. Owns bfm.db — the device
  # allow-list — on port 3014. Mounts its own `pops-bfm-data` volume rather
  # than the shared `sqlite-data`; see the prod file for why.
  bfm-api:
    build:
      context: ..
      dockerfile: pillars/bfm/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-bfm
    restart: unless-stopped
    networks:
      - frontend
      - backend
    volumes:
      - pops-bfm-data:/data/sqlite
    environment:
      NODE_ENV: production
      PORT: '3014'
      BFM_SQLITE_PATH: /data/sqlite/bfm.db
      BFM_SELF_BASE_URL: http://bfm-api:3014
      POPS_REGISTRY_ENABLED: 'true'
      POPS_REGISTRY_URL: ${POPS_REGISTRY_URL:-http://registry-api:3001}
      # The dev source for the service-account key: inline, where production
      # mounts a file secret. Empty by default, and deliberately not defaulted
      # to a stand-in — once the cross-pillar wiring lands (POPS-1367) an
      # absent key crashes boot with a message naming this variable, which is
      # a better dev experience than a container that starts and 401s.
      #
      # Deliberately NOT given POPS_PILLARS, which every service above sets to
      # a static six-pillar roster. bfm discovers through the registry; reading
      # that roster as overrides would bypass discovery in dev and nowhere
      # else, which is the routing-seam disagreement this fleet has already
      # paid for once.
      POPS_INTERNAL_API_KEY: ${POPS_INTERNAL_API_KEY:-}
    expose:
      - '3014'
    depends_on:
      registry-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3014/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # Cross-pillar orchestrator (ADR-029, epics 06+07). Federates over the
  # pillars via @pops/pillar-sdk (REST); owns no domain DB. nginx routes
  # /orchestrator-api/ here on port 3009. Built from the app Dockerfile;
  # no published image yet.
  pops-orchestrator:
    build:
      context: ..
      dockerfile: pillars/orchestrator/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-orchestrator
    restart: unless-stopped
    networks:
      - frontend
      - backend
    environment:
      NODE_ENV: production
      PORT: '3009'
      ORCHESTRATOR_SELF_BASE_URL: http://pops-orchestrator:3009
      POPS_PILLARS: ${POPS_PILLARS:-registry:http://registry-api:3001,inventory:http://inventory-api:3002,media:http://media-api:3003,finance:http://finance-api:3004,food:http://food-api:3005,lists:http://lists-api:3006}
    expose:
      - '3009'
    depends_on:
      registry-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3009/health').then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── FRONTEND ─────────────────────────────────────────────────────
  pops-shell:
    build:
      context: ..
      dockerfile: pillars/shell/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-shell
    restart: unless-stopped
    networks:
      - frontend
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80']
      interval: 30s
      timeout: 5s
      retries: 3

  # API docs browser — Stoplight Elements pointed at every contract
  # package's OpenAPI snapshot (Theme 13 PRD-219).
  pops-docs:
    build:
      context: ..
      dockerfile: pillars/docs/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-docs
    restart: unless-stopped
    networks:
      - frontend
    expose:
      - '80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:80/healthz']
      interval: 30s
      timeout: 5s
      retries: 3

  metabase:
    image: metabase/metabase:v0.52.5
    container_name: pops-metabase
    restart: unless-stopped
    networks:
      - frontend
    volumes:
      - metabase-data:/metabase-data
      - sqlite-data:/data/sqlite:ro
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
      MB_JETTY_PORT: '3000'
      JAVA_TOOL_OPTIONS: -Xmx512m
    expose:
      - '3000'

  # ── DOCUMENTS ────────────────────────────────────────────────────
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:2.14
    container_name: pops-paperless
    restart: unless-stopped
    networks:
      - documents
    volumes:
      - paperless-data:/usr/src/paperless/data
      - paperless-media:/usr/src/paperless/media
      - paperless-consume:/usr/src/paperless/consume
    secrets:
      - paperless_secret_key
      - paperless_admin_password
    environment:
      PAPERLESS_SECRET_KEY_FILE: /run/secrets/paperless_secret_key
      PAPERLESS_REDIS: redis://paperless-redis:6379
      PAPERLESS_URL: https://pops-paperless.${POPS_DOMAIN:-localhost}
      PAPERLESS_TIME_ZONE: Australia/Melbourne
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_ADMIN_USER: admin
      PAPERLESS_ADMIN_PASSWORD_FILE: /run/secrets/paperless_admin_password
    expose:
      - '8000'
    depends_on:
      - paperless-redis

  paperless-redis:
    image: redis:7-alpine
    container_name: pops-paperless-redis
    restart: unless-stopped
    networks:
      - documents
    volumes:
      - paperless-redis:/data

  # ── MCP HTTP SERVER ──────────────────────────────────────────────
  # Exposes pops data as an MCP server over HTTP (port 3011).
  # Enable with:  docker compose -f infra/docker-compose.dev.yml --profile mcp up -d pops-mcp
  pops-mcp:
    build:
      context: ..
      dockerfile: pillars/mcp/Dockerfile
      args:
        BUILD_VERSION: ${BUILD_VERSION:-dev}
    container_name: pops-mcp
    restart: unless-stopped
    profiles:
      - mcp
    networks:
      - backend
    secrets:
      - pops_api_key
    environment:
      NODE_ENV: production
      # pops-mcp reaches every pillar through the REST pillar SDK (per-pillar
      # POPS_*_API_URL with built-in docker-network defaults); the legacy single
      # POPS_API_URL tRPC client was removed in the 02 decommission.
      POPS_API_KEY_FILE: /run/secrets/pops_api_key
      MCP_PORT: '3011'
    ports:
      - '${MCP_BIND_ADDR:-0.0.0.0}:3011:3011'
    depends_on:
      registry-api:
        condition: service_started
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3011/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ── MOLTBOT (on-demand, staging-bot dev profile) ──────────────────
  # Mounts a separate dev config (pillars/moltbot/config/config.dev.yml) that
  # points at a different Telegram bot token and a separate allowed_user_ids
  # entry, so working on skills never poisons the prod conversation history.
  # Enable with:  mise moltbot:dev   (or: docker compose -f infra/docker-compose.dev.yml --profile moltbot up moltbot)
  moltbot-validator:
    image: alpine:3.20
    container_name: pops-moltbot-validator
    profiles:
      - moltbot
    volumes:
      - ../pillars/moltbot/config/config.dev.yml:/config/config.yml:ro
      - ../pillars/moltbot/scripts/validate-config.sh:/validate.sh:ro
    secrets:
      - telegram_bot_token_dev
      - claude_api_key
      - pops_api_key
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token_dev
    command: ['/bin/sh', '/validate.sh']
    restart: 'no'

  moltbot:
    image: moltbot/moltbot:latest
    container_name: pops-moltbot
    restart: unless-stopped
    profiles:
      - moltbot
    networks:
      - backend
    volumes:
      - ../pillars/moltbot/config/config.dev.yml:/home/node/.moltbot/config.yml:ro
      - ../pillars/moltbot/skills:/home/node/.moltbot/workspace/skills:ro
    secrets:
      - telegram_bot_token_dev
      - claude_api_key
      - pops_api_key
    environment:
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token_dev
      # Skill prompts still describe monolith paths; repointing hosts is
      # necessary but not sufficient (cerebrum/finance skills need REST-path
      # rewrites) — tracked as a follow-up gap.
      POPS_API_URL: http://cerebrum-api:3007
      POPS_API_KEY_FILE: /run/secrets/pops_api_key
      FINANCE_API_URL: http://finance-api:3004
      FINANCE_API_KEY_FILE: /run/secrets/pops_api_key
    depends_on:
      moltbot-validator:
        condition: service_completed_successfully

  # ── PILLAR TEMPLATE (ADR-026) ─────────────────────────────────────
  # Copy this block per pillar (food, finance, media, inventory,
  # cerebrum, core, ai). Each pillar gets its OWN service entry — no
  # shared image, no shared SQLite. See infra/docker/pillar.Dockerfile
  # for the generic build, and `.claude/pillar-migration-roadmap.md`
  # for the rollout DAG. The block below is commented because no
  # pillar packages exist yet; uncomment + rename once the first
  # pillar (core) lands.
  #
  # <pillar>-api:
  #   build:
  #     context: ..
  #     dockerfile: infra/docker/pillar.Dockerfile
  #     args:
  #       PILLAR_PACKAGE: '@pops/<pillar>-api'
  #       PILLAR_PORT: '30XX'           # pick a unique port per pillar
  #       BUILD_VERSION: ${BUILD_VERSION:-dev}
  #   container_name: pops-<pillar>-api
  #   restart: unless-stopped
  #   networks:
  #     - frontend
  #     - backend
  #   volumes:
  #     - <pillar>-sqlite-data:/data/sqlite
  #   secrets: []                        # add only the secrets this pillar needs
  #   environment:
  #     NODE_ENV: production
  #     PORT: '30XX'
  #     <PILLAR>_SQLITE_PATH: /data/sqlite/<pillar>.db
  #     # registry-api hosts the pillar registry; every other pillar resolves
  #     # cross-pillar URIs against POPS_PILLARS or via the registry.
  #     POPS_PILLARS: ${POPS_PILLARS:-}
  #   expose:
  #     - '30XX'
  #   depends_on:
  #     registry-api:                    # every pillar except the registry itself
  #       condition: service_healthy
  #   healthcheck:
  #     test:
  #       [
  #         'CMD',
  #         'node',
  #         '-e',
  #         "fetch('http://localhost:30XX/health').then(r=>{if(!r.ok)process.exit(1)})",
  #       ]
  #     interval: 30s
  #     timeout: 5s
  #     retries: 3
  #
  # Optional worker variant — same image, different entrypoint:
  # <pillar>-worker:
  #   build:
  #     context: ..
  #     dockerfile: infra/docker/pillar.Dockerfile
  #     args:
  #       PILLAR_PACKAGE: '@pops/<pillar>-api'
  #       PILLAR_ENTRYPOINT: worker.js
  #       BUILD_VERSION: ${BUILD_VERSION:-dev}
  #   container_name: pops-<pillar>-worker
  #   restart: unless-stopped
  #   networks: [backend]
  #   volumes:
  #     - <pillar>-sqlite-data:/data/sqlite
  #   environment:
  #     NODE_ENV: production
  #     <PILLAR>_SQLITE_PATH: /data/sqlite/<pillar>.db
  #     REDIS_HOST: pops-redis
  #     REDIS_PORT: '6379'
  #   depends_on:
  #     pops-redis:
  #       condition: service_healthy

networks:
  frontend:
    name: pops-frontend
    driver: bridge
  backend:
    name: pops-backend
    driver: bridge
  documents:
    name: pops-documents
    driver: bridge

volumes:
  sqlite-data:
    name: pops-sqlite-data
  pops-redis-data:
    name: pops-redis-data
  metabase-data:
    name: pops-metabase-data
  paperless-data:
    name: pops-paperless-data
  paperless-media:
    name: pops-paperless-media
  paperless-consume:
    name: pops-paperless-consume
  paperless-redis:
    name: pops-paperless-redis
  cerebrum-engrams-data:
    name: pops-cerebrum-engrams-data
  food-ingest-data:
    name: pops-food-ingest-data
  media-images-data:
    name: pops-media-images-data
  # Per-pillar rather than the shared `sqlite-data` above — bfm is greenfield,
  # so it starts where ADR-039 workstream S11 wants every pillar to end up.
  pops-bfm-data:
    name: pops-bfm-data

secrets:
  notion_api_token:
    file: ../secrets/notion_api_token
  up_bank_token:
    file: ../secrets/up_bank_token
  up_webhook_secret:
    file: ../secrets/up_webhook_secret
  claude_api_key:
    file: ../secrets/claude_api_key
  telegram_bot_token:
    file: ../secrets/telegram_bot_token
  telegram_bot_token_dev:
    file: ../secrets/telegram_bot_token_dev
  finance_api_key:
    file: ../secrets/finance_api_key
  pops_api_key:
    file: ../secrets/pops_api_key
  tmdb_api_key:
    file: ../secrets/tmdb_api_key
  thetvdb_api_key:
    file: ../secrets/thetvdb_api_key
  paperless_secret_key:
    file: ../secrets/paperless_secret_key
  paperless_admin_password:
    file: ../secrets/paperless_admin_password
