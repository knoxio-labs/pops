name: Pops

options:
  bundleIdPrefix: com.knoxiolabs
  # The latest RELEASED major iOS, not the latest one an Xcode beta can build.
  # A deployment target above the SDK does not compile, and the GitHub-hosted
  # macOS runner that gates this app carries no beta Xcode — so a floor set to
  # the unreleased major is a floor nothing but a developer's own laptop can
  # build, which is a merge gate that cannot exist. Raising this means waiting
  # for the runner image to ship that Xcode, then bumping POPS_XCODE_VERSION in
  # mise.toml and every `platforms:` floor under Packages/ in the same commit.
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
  groupSortPosition: none

settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
  configs:
    # Debug builds one architecture — the one the machine will actually run.
    # Without this the simulator ARCHS are `arm64 x86_64` and every Debug build
    # compiles the whole tree twice: measured on a `build-for-testing` log as 66
    # `-target arm64-apple-ios26.0-simulator` invocations beside 66 identical
    # `x86_64` ones. Nothing runs the x86_64 slice — the GitHub macOS runners are
    # Apple Silicon and so is every machine here — so half that compile was
    # produced for no consumer.
    #
    # IT ONLY TAKES EFFECT WITH A CONCRETE DESTINATION. Against
    # `generic/platform=iOS Simulator` Xcode overrides this back to NO, because a
    # generic destination has no active architecture to be; `-showBuildSettings`
    # reports `ONLY_ACTIVE_ARCH = NO, ARCHS = arm64 x86_64` even with this set.
    # That is why both `build` and `build:for-testing` in mise.toml name the
    # simulator rather than taking the generic destination.
    #
    # Release is untouched: a shipped binary is not built for the architecture
    # that happened to compile it.
    Debug:
      ONLY_ACTIVE_ARCH: YES

packages:
  AppCore:
    path: Packages/AppCore
  Auth:
    path: Packages/Auth
  BFMClient:
    path: Packages/BFMClient
  DesignSystem:
    path: Packages/DesignSystem
  FeaturePairing:
    path: Packages/FeaturePairing
  FeatureReceiptCapture:
    path: Packages/FeatureReceiptCapture
  FeaturePurchases:
    path: Packages/FeaturePurchases
  FeatureTransactions:
    path: Packages/FeatureTransactions
  FeatureAccounts:
    path: Packages/FeatureAccounts
  DesignPlayground:
    path: Packages/DesignPlayground

targets:
  Pops:
    type: application
    platform: iOS
    sources:
      # XcodeGen 2.46 predates Icon Composer, so it does not know `.icon` is a
      # bundle and walks into it as a source directory. Excluded from the glob
      # and named once as a file, which is what makes actool compile it as the
      # icon rather than the app carrying two loose PNGs.
      - path: App
        excludes:
          - AppIcon.icon/**
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: AppCore
      - package: Auth
      - package: BFMClient
      - package: DesignSystem
      - package: FeaturePairing
      - package: FeatureReceiptCapture
      - package: FeaturePurchases
      - package: FeatureTransactions
      - package: FeatureAccounts
    # A shared scheme, so `xcodebuild -scheme Pops` resolves on a clean checkout
    # rather than relying on Xcode autocreating one into xcuserdata. This list is
    # what makes `xcodebuild test` run anything at all — an empty one leaves the
    # scheme with no testables and the test action exits 0 having run nothing.
    #
    # Every package's test target is named here alongside `PopsTests` so that ONE
    # `xcodebuild test` covers the whole tree. The alternative — an invocation per
    # package, from inside that package's own directory — makes each package a
    # separate project with a separate build tree, so a package several others
    # depend on is compiled from scratch once per dependent on top of once for the
    # app: `AppCore` is a dependency of `Auth`, of `FeaturePairing` and of `Pops`,
    # and was compiled roughly five times per CI run that way, each invocation
    # paying its own xcodebuild startup and simulator attach as well.
    #
    # `package: <package>/<target>` is how a LOCAL package's test target is named
    # here; a bare name means a target of this project and XcodeGen rejects it.
    # Adding a package to `packages:` above does NOT add its tests to this list,
    # and nothing in XcodeGen notices the omission — so `mise run test` fails when
    # a directory under `Packages/` has a `Tests/` and no testable here. That
    # check is what stops this list from being the place a suite goes to die
    # quietly.
    scheme:
      testTargets:
        - PopsTests
        - package: AppCore/AppCoreTests
        - package: Auth/AuthTests
        - package: BFMClient/BFMClientTests
        - package: DesignSystem/DesignSystemTests
        - package: FeaturePairing/FeaturePairingTests
        - package: FeatureReceiptCapture/FeatureReceiptCaptureTests
        - package: FeaturePurchases/FeaturePurchasesTests
        - package: FeatureTransactions/FeatureTransactionsTests
        - package: FeatureAccounts/FeatureAccountsTests
        - package: DesignPlayground/DesignPlaygroundTests
    # The team lives outside the repo; see Config/Signing.xcconfig. Nothing here
    # may set DEVELOPMENT_TEAM — target build settings outrank a target xcconfig,
    # so doing so would silently win over the developer's own value.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: Pops uses the camera to scan pairing QR codes and photograph receipts.
        PRODUCT_BUNDLE_IDENTIFIER: com.knoxiolabs.pops
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
      configs:
        # Read through App/Info.plist, which is the only way to reach a key Xcode's
        # INFOPLIST_KEY_ allowlist does not cover.
        Debug:
          POPS_BFM_BASE_URL: http://localhost:3014
        # Empty on purpose, and asserted by `mise run verify:release-carries-no-host`.
        # The Release binary names no host: the base URL arrives with the pairing
        # QR, so re-pointing the app at another deployment needs no rebuild.
        Release:
          POPS_BFM_BASE_URL: ''

  # The app's test target. What belongs here rather than in a package's own
  # suite is argued in AppTests/README.md; the short version is that this is the
  # only place a test runs inside an app bundle, on a simulator, carrying the
  # app's entitlements.
  #
  # It sets nothing that affects how Swift is compiled. Swift 6, complete
  # concurrency and warnings-as-errors are project-level above, so they reach
  # this target the same way they reach the app — a test target compiled under
  # looser rules would be testing a different compilation than the one that
  # ships. `mise run test:app` asserts that they still agree rather than
  # trusting it.
  PopsTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      # An application dependency is what makes this a *hosted* test bundle:
      # XcodeGen turns it into TEST_HOST and BUNDLE_LOADER, so the tests are
      # injected into the running app rather than into a bare `xctest` runner.
      # That is not a detail — it is the whole reason this target exists.
      # `Bundle.main` becomes the app bundle, and the process carries the app's
      # entitlements, which is the environment the data-protection keychain
      # needs and the one `swift test` cannot provide.
      - target: Pops
      # Linked into the host already; the test bundle needs the module on its
      # import path, not a second static copy of it.
      - package: BFMClient
        link: false
      - package: Auth
        link: false
      - package: AppCore
        link: false
    # The same team as the app, for the day these run on a physical device: a
    # test bundle signed by nobody cannot be installed alongside a host that is.
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    settings:
      base:
        # A test bundle is code-signed like anything else, and signing needs a
        # plist. Without this the build fails outright — it does not silently
        # produce an unsigned bundle.
        GENERATE_INFOPLIST_FILE: YES
        # Under the app's identifier rather than beside it, so the pair reads as
        # host-and-tests wherever bundle IDs are listed. XcodeGen would
        # otherwise derive `com.knoxiolabs.PopsTests` from the target name.
        PRODUCT_BUNDLE_IDENTIFIER: com.knoxiolabs.pops.tests
        CODE_SIGN_STYLE: Automatic

  # The design playground: a second installable app, sharing the DesignSystem
  # with `Pops` and sharing nothing else.
  #
  # It is a separate target rather than a screen inside `Pops` for the reason
  # its own `PlaygroundApp.swift` gives — the playground must not be able to
  # reach a network, and the only way to make that a fact rather than a promise
  # is to keep it out of a binary that links `BFMClient`. It also means the
  # thing installed on a reviewer's phone carries no pairing, no keychain entry
  # and no BFM host.
  PopsPlayground:
    type: application
    platform: iOS
    sources:
      # Same treatment `Pops` needs and for the same reason: XcodeGen 2.46
      # predates Icon Composer, so it walks into the `.icon` bundle as a
      # source directory unless it is excluded and named once as a file.
      - path: Playground
        excludes:
          - PlaygroundIcon.icon/**
      - path: Playground/PlaygroundIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: DesignPlayground
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    scheme: {}
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # So it is distinguishable from `Pops` on a home screen that has both.
        INFOPLIST_KEY_CFBundleDisplayName: Pops Design
        ASSETCATALOG_COMPILER_APPICON_NAME: PlaygroundIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.knoxiolabs.pops.playground
        MARKETING_VERSION: '0.1.0'
        CURRENT_PROJECT_VERSION: '1'
        TARGETED_DEVICE_FAMILY: '1'
        CODE_SIGN_STYLE: Automatic
