[tools]
jq = "1.8.2"
swiftlint = "0.65.0"
xcodegen = "2.46.0"

[env]
# The Swift tree the formatter and the linter both cover. `.swiftlint.yml`'s
# `included:` names the same three directories — two tools with two config
# formats, one intended scope, so they move together.
SWIFT_SOURCES = "App AppTests Packages"

# Xcode cannot be a `[tools]` pin — mise does not install it — so this is the
# one committed declaration both the CI job and `verify:xcode-version` below
# read, rather than two hand-kept copies. It matters because `swift-format`
# ships inside the toolchain and is therefore the one check whose verdict
# depends on which Xcode ran it; a local Xcode other than this one can
# format-lint differently from CI, and `mise run lint` refuses to trust that
# difference rather than let it pass silently.
# The value must be an Xcode the GitHub macOS runner image actually carries, and
# that image is the reason the iOS floor is 26 and not the newest SDK — see the
# `deploymentTarget` note in project.yml.
POPS_XCODE_VERSION = "26.6"

# The simulator `mise run test` and `mise run test:app` boot. Named rather than
# left to xcodebuild's choice so the local run and the CI run test the same
# device, and chosen from the intersection of what the runner image and a
# current Xcode both ship.
POPS_IOS_SIMULATOR = "iPhone 17"

[tasks.generate]
description = "Regenerate Pops.xcodeproj from project.yml"
run = '''
set -euo pipefail

# Point the committed xcconfig at this machine's team, if it has one. A
# project-referenced xcconfig cannot expand `~` or `$(HOME)` in an include path,
# so the absolute path is resolved here and written to a gitignored file instead.
# Rewritten every run, and removed when the machine has no team config, so the
# generated file is never a stale pointer at a team that was renamed away.
team_config="$HOME/.config/pops/ios-signing.xcconfig"
if [ -f "$team_config" ]; then
  printf '#include? "%s"\n' "$team_config" > Config/Signing.local.xcconfig
else
  rm -f Config/Signing.local.xcconfig
fi

xcodegen generate
'''

[tasks.build]
description = "Build the app for the iOS Simulator"
depends = ["generate"]
run = "xcodebuild -project Pops.xcodeproj -scheme Pops -destination 'generic/platform=iOS Simulator' build"

[tasks."build:device"]
description = "Build a signed Release for a physical iPhone"
depends = ["generate"]
# -allowProvisioningUpdates lets automatic signing register the App ID and fetch
# a profile, which is what Xcode does on its own when you press Run. Without it
# the first build on a machine fails with "No profiles for … were found".
run = "xcodebuild -project Pops.xcodeproj -scheme Pops -destination 'generic/platform=iOS' -configuration Release -allowProvisioningUpdates build"

[tasks."build:packages"]
description = "Type-check every package on the host toolchain, without Xcode"
run = '''
for package in Packages/*/; do
  swift build --package-path "$package" || exit 1
done
'''

[tasks."test:packages"]
description = "Run every package's tests on the host toolchain, without Xcode"
run = '''
for package in Packages/*/; do
  # `swift test` fails outright on a package with no test target, so a package
  # whose tests are still a later ticket must not fail the run. Hardware-backed
  # suites skip themselves — see Packages/Auth/README.md.
  if [ -d "$package/Tests" ]; then
    swift test --package-path "$package" || exit 1
  fi
done
'''


# The one entry point for the simulator, same idea as `lint`: the CI job invokes
# this rather than restating the lanes, because a lane the workflow has to
# remember to add is a lane it will one day forget.
[tasks.test]
description = "Run every package's tests, and the app's own target, on the iOS Simulator"
run = '''
set -eu
set -o pipefail

ran=0
for package in Packages/*/; do
  # `xcodebuild test` fails outright on a package with no test target, so a
  # package whose tests are still a later ticket must not fail the run.
  [ -d "$package/Tests" ] || continue

  # A directory holding a Package.swift is a project as far as xcodebuild is
  # concerned, which is what lets these tests run against the iOS SDK instead of
  # the host's macOS one — the gap `test:packages` cannot close.
  #
  # Which scheme is testable is not a free choice. Xcode synthesises one scheme
  # per product plus an aggregate `<name>-Package` when a package has more than
  # one, and ONLY the aggregate carries the test action: `xcodebuild test
  # -scheme AppCore` fails with "not currently configured for the test action"
  # while `-scheme AppCore-Package` runs all 58 tests. A single-product package
  # has no aggregate and its lone scheme is testable. Both the name and the
  # scheme list are read back out of xcodebuild rather than guessed from the
  # directory name, so a package renamed on one side only fails here by name.
  listing=$(cd "$package" && xcodebuild -list -json 2>/dev/null) || listing=''
  scheme=$(printf '%s' "$listing" | jq -er '
    .workspace.name as $n
    | .workspace.schemes as $s
    | if ($s | index($n + "-Package")) then $n + "-Package"
      elif ($s | index($n)) then $n
      else error("no scheme named \($n) or \($n)-Package among \($s)") end
  ') || {
    echo "test: could not resolve a testable scheme for '$package'." >&2
    exit 1
  }

  (cd "$package" && xcodebuild test \
    -scheme "$scheme" \
    -destination "platform=iOS Simulator,name=$POPS_IOS_SIMULATOR,OS=latest") || exit 1
  ran=$((ran + 1))
done

# Every package's tests being "a later ticket" is a green run that asserted
# nothing, and looks identical to a passing one.
if [ "$ran" -eq 0 ]; then
  echo "test: no package under Packages/ has a Tests directory — this run checked nothing." >&2
  exit 1
fi

# The second lane. Everything above runs a package against the iOS SDK; this
# runs the app itself, which is the only way to reach an app bundle and the
# entitlements that come with one. Invoked from here rather than added to the
# CI workflow as a step of its own, so a lane can never exist locally and be
# missing from the gate.
mise run test:app
'''

[tasks."verify:app-test-target"]
description = "Assert the app test target is hosted and compiles like the app"
depends = ["generate"]
run = '''
set -eu
set -o pipefail

work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT

# xcodebuild's stderr is where a renamed target, a missing project and a
# toolchain mismatch all announce themselves. Discarding it and letting jq choke
# on the empty result turns any of those into a jq parse error with no build
# output anywhere in the log — a lane that fails undiagnosably is one nobody can
# fix from a CI run.
settings() {
  if ! xcodebuild -project Pops.xcodeproj -target "$1" -configuration Debug \
    -destination 'generic/platform=iOS Simulator' -showBuildSettings -json \
    > "$work/$1.json" 2> "$work/$1.err"; then
    echo "verify:app-test-target: xcodebuild could not read build settings for '$1'." >&2
    tail -20 "$work/$1.err" >&2
    return 1
  fi
  # A zero exit with a shapeless result is the same failure wearing a smile.
  if ! jq -ec '.[0].buildSettings // empty' < "$work/$1.json"; then
    echo "verify:app-test-target: '$1' has no build settings — was the target renamed?" >&2
    return 1
  fi
}

app=$(settings Pops)
tests=$(settings PopsTests)

# Hosted, not standalone, which is the whole reason this target exists. A test
# bundle with no TEST_HOST runs in a bare `xctest` process carrying none of the
# app's entitlements — the same environment `swift test` already provides, and
# the one the data-protection keychain refuses to work in.
if [ -z "$(printf '%s' "$tests" | jq -r '.TEST_HOST // ""')" ]; then
  echo "PopsTests declares no TEST_HOST, so it is not hosted by the app." >&2
  exit 1
fi

# Read off the app rather than restated here: a test target compiled under
# looser rules than the app is testing a different compilation than the one that
# ships, and the way that happens is somebody silencing a red build on the test
# target alone.
status=0
for setting in SWIFT_VERSION SWIFT_STRICT_CONCURRENCY SWIFT_TREAT_WARNINGS_AS_ERRORS \
  GCC_TREAT_WARNINGS_AS_ERRORS; do
  expected=$(printf '%s' "$app" | jq -r --arg key "$setting" '.[$key] // ""')
  actual=$(printf '%s' "$tests" | jq -r --arg key "$setting" '.[$key] // ""')
  # Two absent settings compare equal. Without this, renaming one out of
  # project.yml would leave this loop comparing nothing against nothing and
  # calling it agreement.
  if [ -z "$expected" ]; then
    echo "Pops defines no $setting, so this check is guarding a setting that moved." >&2
    status=1
  elif [ "$expected" != "$actual" ]; then
    echo "PopsTests has $setting=${actual:-<unset>}, Pops has $setting=$expected." >&2
    status=1
  fi
done

if [ "$status" -eq 0 ]; then
  echo "PopsTests is hosted by Pops and compiles under the same settings."
fi
exit $status
'''

# Reached through `test` rather than run on its own in CI, but nameable so a
# developer changing the app target can run this lane alone.
[tasks."test:app"]
description = "Run the app's test target on the iOS Simulator, and assert it ran something"
depends = ["generate"]
run = '''
set -eu
set -o pipefail

mise run verify:app-test-target

work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT
result="$work/test.xcresult"

status=0
xcodebuild test -project Pops.xcodeproj -scheme Pops \
  -destination "platform=iOS Simulator,name=$POPS_IOS_SIMULATOR,OS=latest" \
  -resultBundlePath "$result" > "$work/test.log" 2>&1 || status=1

# A run that died before producing a bundle has no count to report, and the
# reason is in the log rather than in anything below.
if [ ! -e "$result" ]; then
  tail -60 "$work/test.log" >&2
  echo "test:app: xcodebuild produced no result bundle." >&2
  exit 1
fi

summary=$(xcrun xcresulttool get test-results summary --path "$result") || {
  tail -60 "$work/test.log" >&2
  echo "test:app: could not read a summary out of the result bundle." >&2
  exit 1
}

if [ "$status" -ne 0 ]; then
  tail -60 "$work/test.log" >&2
  # `// []` because a build failure produces a bundle with no failed *tests* in
  # it. Without it jq aborts on `null[]`, and under `set -e` that replaces the
  # failure this branch exists to report with a jq error about reporting it.
  printf '%s' "$summary" \
    | jq -r '(.testFailures // [])[] | "FAILED  \(.testName): \(.failureText // "no message")"' >&2
  exit 1
fi

# Absence is a failure, not a pass — a summary with no counts in it would make
# the guard below compare nothing against zero and wave the run through.
total=$(printf '%s' "$summary" | jq -r '.totalTestCount // empty')
skipped=$(printf '%s' "$summary" | jq -r '.skippedTests // empty')
if [ -z "$total" ] || [ -z "$skipped" ]; then
  echo "test:app: the result bundle reports no test counts, so nothing here is checking anything." >&2
  exit 1
fi

# The defect this whole target was created for. A lane that runs nothing and
# reports success is worse than no lane: it is a green signal for an empty set,
# and nobody re-reads a green check. Skipped tests count towards the total the
# bundle reports, so subtracting them is what makes this a claim about what
# actually executed rather than about what was collected.
if [ "$((total - skipped))" -le 0 ]; then
  echo "test:app: the test action executed 0 tests ($total collected, $skipped skipped)." >&2
  echo "          Check that project.yml still lists PopsTests under the Pops scheme." >&2
  exit 1
fi

echo "test:app: executed $((total - skipped)) tests ($skipped skipped)."
'''

[tasks."verify:release-carries-no-host"]
description = "Assert the Release build names no BFM host"
depends = ["generate"]
run = '''
set -euo pipefail

derived=$(mktemp -d)
trap 'rm -rf "$derived"' EXIT

# Read the host to look for out of the Debug configuration rather than repeating
# it here, so the check cannot drift away from the value it is guarding against.
debug_url=$(xcodebuild -project Pops.xcodeproj -scheme Pops -configuration Debug -showBuildSettings \
  -destination 'generic/platform=iOS Simulator' \
  | awk -F ' = ' '$1 ~ /^ *POPS_BFM_BASE_URL$/ { print $2 }')
if [ -z "$debug_url" ]; then
  echo "Debug defines no POPS_BFM_BASE_URL, so this check has nothing to look for." >&2
  exit 1
fi

# The simulator SDK, so the check needs no signing identity and runs anywhere.
if ! xcodebuild -project Pops.xcodeproj -scheme Pops -configuration Release \
  -destination 'generic/platform=iOS Simulator' -derivedDataPath "$derived" build > "$derived/build.log" 2>&1; then
  tail -40 "$derived/build.log" >&2
  exit 1
fi

app="$derived/Build/Products/Release-iphonesimulator/Pops.app"

# Absence is a failure, not a pass. A key that never reaches the plist — renamed
# on one side only, or set through an INFOPLIST_KEY_ Xcode silently drops — looks
# exactly like an empty one, and would make the rest of this check vacuous.
if ! baked=$(plutil -extract POPSBFMBaseURL raw -o - "$app/Info.plist" 2>/dev/null); then
  echo "Release Info.plist carries no POPSBFMBaseURL key, so nothing here is being checked." >&2
  exit 1
fi
if [ -n "$baked" ]; then
  echo "Release bakes a BFM host into Info.plist: $baked" >&2
  exit 1
fi

if grep -rqa -- "$debug_url" "$app"; then
  echo "Release build carries the Debug BFM host ($debug_url)" >&2
  exit 1
fi

echo "Release build names no BFM host."
'''

# swift-format, in whichever of its two modes. Both go through here so the check
# and the fix cannot disagree about which files they cover or which config they
# read. `xcrun` rather than a bare name: swift-format ships inside the Xcode
# toolchain and is not otherwise on PATH.
[tasks."swift-format"]
description = "swift-format over the Swift sources — `lint` to check, `format` to rewrite"
hide = true
usage = 'arg "<mode>"'
run = '''
# mise already runs task scripts under `sh -e`, but NOT under pipefail, and
# every check below reads the head of a pipe. Without this, a failing
# `swift-format dump-configuration` leaves jq succeeding on empty input, both
# rule lists come out empty, and the drift check "passes" having compared
# nothing against nothing. Verified: mise reports `$-` as `ehBc`.
set -eu
set -o pipefail

work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT

# The file set, enumerated rather than left to `--recursive`. swift-format walks
# past dot-directories on its own today, so `.build` happens not to be visited —
# but the failure mode if that ever changes is `format` rewriting SwiftPM's
# dependency checkouts in place, which is not a bet worth taking to save a
# `find`. It is also the only place the formatter can be told to leave generated
# code alone, since swift-format honours no ignore file. Both exclusions, the
# reasons for them, and the roots' own existence checks live in the script,
# which is what `check` and `self-test` below reason about — an enumeration
# written out twice is one that can disagree with the guard that polices it.
scripts/swift-sources.sh list $SWIFT_SOURCES > "$work/sources"

# `.swift-format`'s `rules` map replaces the defaults rather than merging into
# them, so a rule the file does not name is a rule that is off. A toolchain bump
# that introduced one would disable it silently while the config still looked
# complete. Compare what this swift-format ships against what the file lists and
# refuse to run on a mismatch; the fix is to add the rule, deliberately, with a
# reason next to it.
xcrun swift-format dump-configuration | jq -r '.rules | keys[]' > "$work/shipped"
xcrun swift-format dump-configuration --effective | jq -r '.rules | keys[]' > "$work/listed"
# Belt to pipefail's braces: two empty lists compare equal, so an empty one has
# to be a failure in its own right rather than something the diff waves through.
if [ ! -s "$work/shipped" ] || [ ! -s "$work/listed" ]; then
  echo "swift-format: could not read the rule list from the toolchain or from" >&2
  echo "              .swift-format, so the drift check would have compared" >&2
  echo "              nothing against nothing." >&2
  exit 1
fi
if ! diff -u "$work/shipped" "$work/listed" > "$work/drift"; then
  echo "swift-format: .swift-format does not list every rule this toolchain ships." >&2
  echo "      '-' shipped but unlisted (silently off); '+' listed but withdrawn." >&2
  sed -n '4,$p' "$work/drift" >&2
  exit 1
fi

case "$usage_mode" in
  lint) xargs -0 xcrun swift-format lint --strict --parallel < "$work/sources" ;;
  format) xargs -0 xcrun swift-format format --in-place --parallel < "$work/sources" ;;
  *)
    echo "swift-format: unknown mode '$usage_mode' — expected 'lint' or 'format'." >&2
    exit 1
    ;;
esac
'''

# The boundary that keeps generated code out of both tools, and the proof that
# both tools respect it. Part of `lint` rather than a task of its own: the two
# exclusions exist to stop someone reaching for a suppression comment, so a
# check that only runs when remembered is one that runs after the damage.
[tasks."generated-boundary"]
description = "Generated code is where the tools' exclusions say it is — and only there"
hide = true
run = '''
set -u
status=0
# Self-test first: with no generated sources in the tree yet, `check` alone
# compares an empty set against an empty set and passes having read nothing.
scripts/swift-sources.sh self-test || status=1
scripts/swift-sources.sh check $SWIFT_SOURCES || status=1
exit $status
'''

# swift-format's verdict depends on which Xcode ran it. Self-test first, same
# reasoning as `generated-boundary` above: the pure parsing and message logic
# is exercised on every run rather than only on a machine that happens to have
# the wrong Xcode installed.
[tasks."verify:xcode-version"]
description = "Local Xcode matches the version CI pins (POPS_XCODE_VERSION in [env] above)"
hide = true
run = '''
set -u
status=0
scripts/check-xcode-version.sh self-test || status=1
scripts/check-xcode-version.sh check "$POPS_XCODE_VERSION" || status=1
exit $status
'''

# The one entry point. The iOS CI job does not exist yet; when it does it is to
# invoke this task rather than restate the commands, because the moment the two
# are written out separately they drift and a green local run means nothing.
[tasks.lint]
description = "swift-format + SwiftLint over the Swift sources"
depends = ["verify:xcode-version"]
run = '''
set -u
# All three run even when an earlier one fails, so one invocation reports every
# problem.
status=0
mise run swift-format lint || status=1
swiftlint lint --strict --quiet || status=1
mise run generated-boundary || status=1
exit $status
'''

[tasks.format]
description = "Rewrite the Swift sources with swift-format (the fixer for half of `lint`)"
run = "mise run swift-format format"

# Generates this client's canonical copy and stops there. The BFM vendors its
# own copy and a repo-root guard fails on drift, so regenerating without
# re-vendoring breaks the build — but the re-vendor step cannot live here:
# ADR-043 says a client never reaches into a pillar's directory. The task that
# does both is `fixture:device-signature` at the repo root; prefer it.
[tasks."fixture:device-signature:generate"]
description = "Regenerate this client's copy of the iOS↔BFM signature fixture (the repo root's `fixture:device-signature` also re-vendors)"
run = "swift Tools/generate-device-signature-fixture.swift > Contracts/device-signature-v1.json"

# Re-vendor the BFM contract and regenerate the Swift client from it, in that
# order and in one command. Two commands would be two things to remember, and
# the one people forget is the copy — which is the failure the vendored-contract
# gate exists to catch, arriving as a red CI run instead of a local diff.
#
# The counterpart of `pnpm --filter <app> generate:<pillar>-client` on the
# TypeScript side, named to match. Both are re-run by CI and diffed (ADR-040).
[tasks."generate:bfm-client"]
description = "Re-vendor the BFM OpenAPI snapshot and regenerate the Swift client from it"
run = '''
set -eu

canonical=../../pillars/bfm/openapi/bfm.openapi.json
vendored=Contracts/bfm.openapi.json

# The producer's snapshot is a build artefact of the bfm pillar, so a clone that
# has never built it has no file here. Copying nothing would leave the previous
# vendored bytes in place and regenerate an identical client — a silent no-op
# that looks exactly like "already up to date".
if [ ! -f "$canonical" ]; then
  echo "generate:bfm-client: no canonical snapshot at $canonical." >&2
  echo "                     Run 'pnpm --filter @pops/bfm generate:openapi' first." >&2
  exit 1
fi

cp "$canonical" "$vendored"

# Generated FROM THE VENDORED COPY, never from the pillar's path: the copy is
# what makes this unit extraction-ready (ADR-033), and generating from the
# original would make that copy decorative — it could rot without breaking
# anything here.
swift run --package-path Tools/OpenAPIGenerator swift-openapi-generator generate \
  "$vendored" \
  --config Packages/BFMClient/openapi-generator-config.yaml \
  --output-directory Packages/BFMClient/Sources/BFMClient/Generated
'''
