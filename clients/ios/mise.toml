[tools]
jq = "1.8.2"
# The UI-level test runner — see .maestro/README.md for why it and not
# XCUITest. Pinned like every other tool here: Maestro's element matching and
# its command set both move between releases, so an unpinned one turns a flow
# that passed yesterday into a red required check with no commit behind it.
maestro = "cli-2.8.0"
swiftlint = "0.65.0"
xcodegen = "2.46.0"

[env]
# The Swift tree the formatter and the linter both cover. `.swiftlint.yml`'s
# `included:` names the same four directories — two tools with two config
# formats, one intended scope, so they move together.
SWIFT_SOURCES = "App AppTests Packages Tools"

# Xcode cannot be a `[tools]` pin — mise does not install it — so this is the
# one committed declaration both the CI job and `verify:xcode-version` below
# read, rather than two hand-kept copies. It matters because `swift-format`
# ships inside the toolchain and is therefore the one check whose verdict
# depends on which Xcode ran it; a local Xcode other than this one can
# format-lint differently from CI, and `mise run lint` refuses to trust that
# difference rather than let it pass silently.
# The value must be an Xcode the GitHub macOS runner image actually carries, and
# that image is the reason the iOS floor is 26 and not the newest SDK — see the
# `deploymentTarget` note in project.yml.
POPS_XCODE_VERSION = "26.6"

# The simulator `mise run test` and `mise run test:app` boot. Named rather than
# left to xcodebuild's choice so the local run and the CI run test the same
# device, and chosen from the intersection of what the runner image and a
# current Xcode both ship.
POPS_IOS_SIMULATOR = "iPhone 17"

# Where the one shared iOS-Simulator compile lands, and the compiler log it
# leaves behind. `build:for-testing` writes both; `test` runs against the
# products and `lint:analyze` reads the log, so the tree is compiled once per
# run instead of once for each of them.
#
# A path of our own rather than xcodebuild's default under
# `~/Library/Developer/Xcode/DerivedData`, for two reasons. It can be wiped
# outright, which is what makes the compiler log complete by construction
# (`xcodebuild clean` does not clear the SwiftPM package artifacts, and a log
# missing those is the defect this whole arrangement exists to avoid). And
# wiping it leaves the default location alone, which is where `mise run build`
# still writes — the two lanes no longer clear each other's products. That the
# old arrangement DID clear them, by running `clean` against the shared
# location, is what made the CI DerivedData cache appear to buy nothing; that
# cache is gone now (POPS-1683), and `ios-quality.yml` says why.
#
# THE LEADING DOT IS LOAD-BEARING. This puts a gigabyte of build output inside
# the repo tree, and the guards under `scripts/` walk that tree — `check-docs-
# model.mjs` reads comments out of every source file it finds, looking for doc
# paths that do not resolve. Every one of them skips dot-directories, which is
# already how `.build` stays out of their way; a directory named `DerivedData`
# would instead need adding to each walker's skip list, including the ones
# nobody has written yet. Ignored via the root `.gitignore`.
POPS_IOS_DERIVED_DATA = "{{config_root}}/.derived-data"
POPS_IOS_COMPILER_LOG = "{{config_root}}/.derived-data/compiler.log"

[tasks.generate]
description = "Regenerate Pops.xcodeproj from project.yml"
run = '''
set -euo pipefail

# Point the committed xcconfig at this machine's team, if it has one. A
# project-referenced xcconfig cannot expand `~` or `$(HOME)` in an include path,
# so the absolute path is resolved here and written to a gitignored file instead.
# Rewritten every run, and removed when the machine has no team config, so the
# generated file is never a stale pointer at a team that was renamed away.
team_config="$HOME/.config/pops/ios-signing.xcconfig"
if [ -f "$team_config" ]; then
  printf '#include? "%s"\n' "$team_config" > Config/Signing.local.xcconfig
else
  rm -f Config/Signing.local.xcconfig
fi

xcodegen generate
'''

[tasks.build]
description = "Build the app for the iOS Simulator"
depends = ["generate"]
run = "xcodebuild -project Pops.xcodeproj -scheme Pops -destination 'generic/platform=iOS Simulator' build"

[tasks."build:device"]
description = "Build a signed Release for a physical iPhone"
depends = ["generate"]
# -allowProvisioningUpdates lets automatic signing register the App ID and fetch
# a profile, which is what Xcode does on its own when you press Run. Without it
# the first build on a machine fails with "No profiles for … were found".
run = "xcodebuild -project Pops.xcodeproj -scheme Pops -destination 'generic/platform=iOS' -configuration Release -allowProvisioningUpdates build"

[tasks."build:packages"]
description = "Type-check every package on the host toolchain, without Xcode"
run = '''
for package in Packages/*/; do
  swift build --package-path "$package" || exit 1
done
'''

[tasks."test:packages"]
description = "Run every package's tests on the host toolchain, without Xcode"
run = '''
for package in Packages/*/; do
  # `swift test` fails outright on a package with no test target, so a package
  # whose tests are still a later ticket must not fail the run.
  if [ -d "$package/Tests" ]; then
    swift test --package-path "$package" || exit 1
  fi
done
'''


# The single iOS-SDK compile of the whole tree, and the log it leaves behind.
#
# `test` and `lint:analyze` both used to compile everything — `xcodebuild test`
# built the test action, and `lint:analyze` then did its own `clean
# build-for-testing` to get a compiler log. Two full compiles of the same
# sources, ~7 minutes each on the runner, for a test action whose assertions
# take 1.5 seconds. Both now depend on this instead, and because mise resolves
# one dependency graph per invocation, `mise run -j 1 test ::: lint:analyze` —
# what `ios-quality.yml` runs — compiles once and both read what it produced.
#
# The `:::` is mise's TASK separator and is not decoration: without it,
# `mise run test lint:analyze` runs `test` alone and appends `lint:analyze` to
# its command line, where it lands as a second xcodebuild destination and fails
# the lane. `-j 1` is the other half — mise would otherwise run the two
# concurrently, which starves the Auth concurrency suites of the runner's three
# cores while `swiftlint analyze` is going. The workflow carries the full
# reasoning for both.
#
# THE WIPE IS THE POINT, and it is not the same as `clean`. `xcodebuild clean`
# leaves the SwiftPM package artifacts under the derived-data root in place,
# and with those warm only the files xcodebuild actually recompiled reach the
# log. Measured on this tree, same command, same sources: warm gave `Found 0
# violations, 0 serious in 14 files` with none of the changed files among the
# 14; wiped gave 88. Both exit 0. Both read as clean. A compiler log that is
# real but partial is the one failure `lint:analyze`'s floor exists to catch,
# and this is the other end of it — the floor proves the log covered the tree,
# this makes it cover the tree in the first place.
[tasks."build:for-testing"]
description = "Compile the tree once for the simulator, keeping the compiler log `test` and `lint:analyze` share"
hide = true
depends = ["generate"]
run = '''
set -eu
set -o pipefail

rm -rf "$POPS_IOS_DERIVED_DATA"
mkdir -p "$POPS_IOS_DERIVED_DATA"

# `build-for-testing`, not `build`: a plain build compiles only what the
# scheme's build action names, which is the `Pops` target alone. That leaves
# every test target — `AppTests` and each package's `Tests/`, all of them part
# of `SWIFT_SOURCES` and linted by `swiftlint lint` already — outside both the
# products `test` needs and the log `swiftlint analyze` reads.
# The destination names the simulator `test` is about to run on, rather than
# `generic/platform=iOS Simulator`. That is not cosmetic: against a generic
# destination Xcode forces `ONLY_ACTIVE_ARCH` back to NO, because there is no
# active architecture to be, and the whole tree is compiled twice — once for
# arm64 and once for an x86_64 slice no runner and no machine here will ever
# execute. Naming the destination is what lets project.yml's Debug
# `ONLY_ACTIVE_ARCH: YES` apply. It is also simply the honest thing to build:
# these products exist to be run on this destination and nowhere else.
xcodebuild -project Pops.xcodeproj -scheme Pops \
  -destination "platform=iOS Simulator,name=$POPS_IOS_SIMULATOR,OS=latest" \
  -derivedDataPath "$POPS_IOS_DERIVED_DATA" \
  build-for-testing | tee "$POPS_IOS_COMPILER_LOG"
'''

# The one entry point for the simulator, same idea as `lint`: the CI job invokes
# this rather than restating the lanes, because a lane the workflow has to
# remember to add is a lane it will one day forget.
#
# ONE `xcodebuild test`, not one per package. Every package's test target is a
# testable of the `Pops` scheme — project.yml carries the reasoning — so the
# tree compiles once into one build directory and one simulator boots. Running
# each package from inside its own directory instead made every package a
# separate project with a separate build tree, so `AppCore` was compiled from
# scratch for its own tests, again for `Auth`'s, again for `FeaturePairing`'s
# and again for the app, each invocation paying its own xcodebuild startup and
# simulator attach on top of the compile it duplicated.
#
# What collapsing it costs is the enumeration. While each package was its own
# invocation the loop WAS the list, so a package with tests could not be missed
# and one counter was enough. One scheme can miss one silently, and in the worst
# possible direction: a package added under `Packages/` and never added to
# project.yml's `testTargets` is a suite that never runs, inside a run that
# stays green and gets faster for it. So the claim is made from both ends, and
# neither end is a list written out here:
#
#   - every directory under `Packages/` with a `Tests/` is named as a testable
#     container in the scheme — checked below, before anything is built;
#   - every testable the scheme names reported results in the run's result
#     bundle — `--require-testable`, checked in app-test-lane.sh afterwards.
#
# Read out of the generated scheme rather than out of project.yml, because the
# scheme is the thing xcodebuild will act on, and `depends = ["generate"]`
# means it was written from project.yml seconds earlier.
[tasks.test]
description = "Run every package's tests, and the app's own target, on the iOS Simulator"
depends = ["build:for-testing"]
run = '''
set -eu
set -o pipefail

scheme=Pops.xcodeproj/xcshareddata/xcschemes/Pops.xcscheme

# Checked for separately from its contents. Without this a scheme that moved,
# or a `generate` that wrote nothing, arrives at the guard below as an empty
# testable list and gets reported as an empty test action — a true statement
# about the wrong problem.
if [ ! -f "$scheme" ]; then
  echo "test: no scheme at $scheme. 'mise run generate' writes it from" >&2
  echo "      project.yml; a shared scheme that moved out of xcshareddata is" >&2
  echo "      not one xcodebuild can resolve on a clean checkout either." >&2
  exit 1
fi

testables() {
  attribute=$1
  # `|| true` because an empty XPath result is an xmllint failure — exit 10 —
  # and under `set -e` with pipefail that aborts this task with a bare status
  # and no output, in the one case it most needs to explain itself. Swallowed
  # here so an empty test action reaches the guard below as an empty string
  # and gets reported by name instead.
  xmllint --xpath "//TestAction/Testables/TestableReference/BuildableReference/@$attribute" \
    "$scheme" \
    | tr ' ' '\n' \
    | sed -n 's/^'"$attribute"'="\(.*\)"$/\1/p' \
    || true
}

names=$(testables BlueprintName)
containers=$(testables ReferencedContainer)

# Absence is a failure, not a pass: an unparseable scheme and a scheme with an
# empty test action look the same from here, and both would leave every check
# below comparing against nothing.
if [ -z "$names" ]; then
  echo "test: read no testables out of $scheme. Either its test action is empty" >&2
  echo "      — in which case xcodebuild would run nothing and exit 0 — or this" >&2
  echo "      task can no longer parse it." >&2
  exit 1
fi

covered=0
uncovered=''
for package in Packages/*/; do
  # A package whose tests are still a later ticket has nothing to cover; the
  # same guard `test:packages` uses.
  [ -d "$package/Tests" ] || continue
  if printf '%s\n' "$containers" | grep -qxF "container:${package%/}"; then
    covered=$((covered + 1))
  else
    uncovered="$uncovered ${package%/}"
  fi
done
if [ -n "$uncovered" ]; then
  echo "test: these have a Tests directory and no testable in the Pops scheme:$uncovered" >&2
  echo "      Add each to project.yml under the Pops scheme's testTargets as" >&2
  echo "      'package: <package>/<test target>'. Until then their suites never" >&2
  echo "      run, and this run would have been green having skipped them." >&2
  exit 1
fi

# The other half of that check, and the one the loop above cannot make: with
# nothing under `Packages/` to iterate, every package is trivially covered. The
# app's own testable would still carry the run to green on 24 tests while every
# package's suite had quietly stopped existing.
if [ "$covered" -eq 0 ]; then
  echo "test: no package under Packages/ has a Tests directory — this run would" >&2
  echo "      have checked only the app target." >&2
  exit 1
fi

mise run verify:app-test-target

set --
for name in $names; do
  set -- "$@" --require-testable "$name"
done

# `--without-building` against the products `build:for-testing` just wrote.
# Rebuilding here would be the second full compile this arrangement exists to
# remove, and would also mean the log `lint:analyze` reads described a build
# that is no longer the one that was tested.
scripts/app-test-lane.sh "platform=iOS Simulator,name=$POPS_IOS_SIMULATOR,OS=latest" \
  --derived-data "$POPS_IOS_DERIVED_DATA" --without-building \
  --forbid-skips "$@"
'''

[tasks."verify:app-test-target"]
description = "Assert the app test target is hosted and compiles like the app"
depends = ["generate"]
run = '''
set -eu
set -o pipefail

work=$(mktemp -d)
trap 'rm -rf "$work"' EXIT

# xcodebuild's stderr is where a renamed target, a missing project and a
# toolchain mismatch all announce themselves. Discarding it and letting jq choke
# on the empty result turns any of those into a jq parse error with no build
# output anywhere in the log — a lane that fails undiagnosably is one nobody can
# fix from a CI run.
settings() {
  if ! xcodebuild -project Pops.xcodeproj -target "$1" -configuration Debug \
    -destination 'generic/platform=iOS Simulator' -showBuildSettings -json \
    > "$work/$1.json" 2> "$work/$1.err"; then
    echo "verify:app-test-target: xcodebuild could not read build settings for '$1'." >&2
    tail -20 "$work/$1.err" >&2
    return 1
  fi
  # A zero exit with a shapeless result is the same failure wearing a smile.
  if ! jq -ec '.[0].buildSettings // empty' < "$work/$1.json"; then
    echo "verify:app-test-target: '$1' has no build settings — was the target renamed?" >&2
    return 1
  fi
}

app=$(settings Pops)
tests=$(settings PopsTests)

# Hosted, not standalone, which is the whole reason this target exists. A test
# bundle with no TEST_HOST runs in a bare `xctest` process carrying none of the
# app's entitlements — the same environment `swift test` already provides, and
# the one the data-protection keychain refuses to work in.
if [ -z "$(printf '%s' "$tests" | jq -r '.TEST_HOST // ""')" ]; then
  echo "PopsTests declares no TEST_HOST, so it is not hosted by the app." >&2
  exit 1
fi

# Read off the app rather than restated here: a test target compiled under
# looser rules than the app is testing a different compilation than the one that
# ships, and the way that happens is somebody silencing a red build on the test
# target alone.
status=0
for setting in SWIFT_VERSION SWIFT_STRICT_CONCURRENCY SWIFT_TREAT_WARNINGS_AS_ERRORS \
  GCC_TREAT_WARNINGS_AS_ERRORS; do
  expected=$(printf '%s' "$app" | jq -r --arg key "$setting" '.[$key] // ""')
  actual=$(printf '%s' "$tests" | jq -r --arg key "$setting" '.[$key] // ""')
  # Two absent settings compare equal. Without this, renaming one out of
  # project.yml would leave this loop comparing nothing against nothing and
  # calling it agreement.
  if [ -z "$expected" ]; then
    echo "Pops defines no $setting, so this check is guarding a setting that moved." >&2
    status=1
  elif [ "$expected" != "$actual" ]; then
    echo "PopsTests has $setting=${actual:-<unset>}, Pops has $setting=$expected." >&2
    status=1
  fi
done

if [ "$status" -eq 0 ]; then
  echo "PopsTests is hosted by Pops and compiles under the same settings."
fi
exit $status
'''

# One of `test`'s testables, on its own. CI reaches this target through `test`
# above and never invokes this task, so nothing here can be a lane the gate is
# missing; it exists for a developer changing the app target who does not want
# to wait on six packages' suites first.
#
# `--only` narrows the shared `Pops` scheme rather than this lane owning a
# scheme of its own. A second scheme would be a second list of testables to
# keep in step with the first, and the failure that list has is silence.
#
# `--forbid-skips` here as well as on `test` above, and on `test:device` below:
# app-test-lane.sh's own reasoning for the flag — "nobody re-reads a green
# check" — describes an automatic, unattended run far more than a manual one.
# Without it, the Secure Enclave and Keychain suites this target exists for
# could start skipping on the runner and CI would stay green.
[tasks."test:app"]
description = "Run the app's test target on the iOS Simulator, and assert it ran something"
depends = ["generate"]
run = '''
set -eu
set -o pipefail

mise run verify:app-test-target

scripts/app-test-lane.sh "platform=iOS Simulator,name=$POPS_IOS_SIMULATOR,OS=latest" \
  --only PopsTests --require-testable PopsTests --forbid-skips
'''

# The same target on real hardware. Not reachable from `test` and never run in
# CI — no runner has a phone attached.
#
# It is no longer the only place `SecureEnclaveKeyStore` can be exercised: an
# Apple Silicon simulator reaches the host Mac's Enclave, so `test:app` covers
# that code on every run and this lane covers the one thing it cannot, which is
# a particular phone. Worth keeping for exactly that, and for the pairing QA on
# a device.
#
# `--forbid-skips` here too, for the same reason as `test:app`: nothing in the
# app target skips today, and a lane that starts skipping should have to argue
# for it here rather than pass unnoticed — a device run being rare and manual
# is, if anything, more reason a skip would go unremarked, not less.
[tasks."test:device"]
description = "Run the app's test target on a physical iPhone"
depends = ["generate"]
run = '''
set -eu
set -o pipefail

if [ -z "${POPS_IOS_DEVICE:-}" ]; then
  echo "test:device: set POPS_IOS_DEVICE to the attached iPhone's name." >&2
  echo "             'xcrun xctrace list devices' lists what is attached. Unlike" >&2
  echo "             POPS_IOS_SIMULATOR this is not pinned in this file: it names" >&2
  echo "             one person's phone, which is not a property of the repo." >&2
  exit 1
fi

mise run verify:app-test-target

scripts/app-test-lane.sh "platform=iOS,name=$POPS_IOS_DEVICE" \
  --only PopsTests --require-testable PopsTests \
  --forbid-skips --allow-provisioning-updates
'''

[tasks."verify:release-carries-no-host"]
description = "Assert the Release build names no BFM host"
depends = ["generate"]
run = '''
set -euo pipefail

derived=$(mktemp -d)
trap 'rm -rf "$derived"' EXIT

# Read the host to look for out of the Debug configuration rather than repeating
# it here, so the check cannot drift away from the value it is guarding against.
debug_url=$(xcodebuild -project Pops.xcodeproj -scheme Pops -configuration Debug -showBuildSettings \
  -destination 'generic/platform=iOS Simulator' \
  | awk -F ' = ' '$1 ~ /^ *POPS_BFM_BASE_URL$/ { print $2 }')
if [ -z "$debug_url" ]; then
  echo "Debug defines no POPS_BFM_BASE_URL, so this check has nothing to look for." >&2
  exit 1
fi

# The simulator SDK, so the check needs no signing identity and runs anywhere.
if ! xcodebuild -project Pops.xcodeproj -scheme Pops -configuration Release \
  -destination 'generic/platform=iOS Simulator' -derivedDataPath "$derived" build > "$derived/build.log" 2>&1; then
  tail -40 "$derived/build.log" >&2
  exit 1
fi

app="$derived/Build/Products/Release-iphonesimulator/Pops.app"

# Absence is a failure, not a pass. A key that never reaches the plist — renamed
# on one side only, or set through an INFOPLIST_KEY_ Xcode silently drops — looks
# exactly like an empty one, and would make the rest of this check vacuous.
if ! baked=$(plutil -extract POPSBFMBaseURL raw -o - "$app/Info.plist" 2>/dev/null); then
  echo "Release Info.plist carries no POPSBFMBaseURL key, so nothing here is being checked." >&2
  exit 1
fi
if [ -n "$baked" ]; then
  echo "Release bakes a BFM host into Info.plist: $baked" >&2
  exit 1
fi

if grep -rqa -- "$debug_url" "$app"; then
  echo "Release build carries the Debug BFM host ($debug_url)" >&2
  exit 1
fi

echo "Release build names no BFM host."
'''

# swift-format, in whichever of its two modes. Both go through here so the check
# and the fix cannot disagree about which files they cover or which config they
# read. `xcrun` rather than a bare name: swift-format ships inside the Xcode
# toolchain and is not otherwise on PATH.
[tasks."swift-format"]
description = "swift-format over the Swift sources — `lint` to check, `format` to rewrite"
hide = true
usage = 'arg "<mode>"'
run = '''
# mise already runs task scripts under `sh -e`, but NOT under pipefail, and
# every check below reads the head of a pipe. Without this, a failing
# `swift-format dump-configuration` leaves jq succeeding on empty input, both
# rule lists come out empty, and the drift check "passes" having compared
# nothing against nothing. Verified: mise reports `$-` as `ehBc`.
set -eu
set -o pipefail

work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT

# The file set, enumerated rather than left to `--recursive`. swift-format walks
# past dot-directories on its own today, so `.build` happens not to be visited —
# but the failure mode if that ever changes is `format` rewriting SwiftPM's
# dependency checkouts in place, which is not a bet worth taking to save a
# `find`. It is also the only place the formatter can be told to leave generated
# code alone, or a shebang script's first line alone, since swift-format honours
# no ignore file. All three exclusions, the reasons for them, and the roots' own
# existence checks live in the script, which is what `check` and `self-test`
# below reason about — an enumeration written out twice is one that can
# disagree with the guard that polices it.
scripts/swift-sources.sh list $SWIFT_SOURCES > "$work/sources"

# `.swift-format`'s `rules` map replaces the defaults rather than merging into
# them, so a rule the file does not name is a rule that is off. A toolchain bump
# that introduced one would disable it silently while the config still looked
# complete. Compare what this swift-format ships against what the file lists and
# refuse to run on a mismatch; the fix is to add the rule, deliberately, with a
# reason next to it.
xcrun swift-format dump-configuration | jq -r '.rules | keys[]' > "$work/shipped"
xcrun swift-format dump-configuration --effective | jq -r '.rules | keys[]' > "$work/listed"
# Belt to pipefail's braces: two empty lists compare equal, so an empty one has
# to be a failure in its own right rather than something the diff waves through.
if [ ! -s "$work/shipped" ] || [ ! -s "$work/listed" ]; then
  echo "swift-format: could not read the rule list from the toolchain or from" >&2
  echo "              .swift-format, so the drift check would have compared" >&2
  echo "              nothing against nothing." >&2
  exit 1
fi
if ! diff -u "$work/shipped" "$work/listed" > "$work/drift"; then
  echo "swift-format: .swift-format does not list every rule this toolchain ships." >&2
  echo "      '-' shipped but unlisted (silently off); '+' listed but withdrawn." >&2
  sed -n '4,$p' "$work/drift" >&2
  exit 1
fi

case "$usage_mode" in
  lint) xargs -0 xcrun swift-format lint --strict --parallel < "$work/sources" ;;
  format) xargs -0 xcrun swift-format format --in-place --parallel < "$work/sources" ;;
  *)
    echo "swift-format: unknown mode '$usage_mode' — expected 'lint' or 'format'." >&2
    exit 1
    ;;
esac
'''

# The boundary that keeps generated code out of both tools, and the proof that
# both tools respect it. Part of `lint` rather than a task of its own: the two
# exclusions exist to stop someone reaching for a suppression comment, so a
# check that only runs when remembered is one that runs after the damage.
[tasks."generated-boundary"]
description = "Generated code is where the tools' exclusions say it is — and only there"
hide = true
run = '''
set -u
status=0
# Self-test first: with no generated sources in the tree yet, `check` alone
# compares an empty set against an empty set and passes having read nothing.
scripts/swift-sources.sh self-test || status=1
scripts/swift-sources.sh check $SWIFT_SOURCES || status=1
exit $status
'''

# swift-format's verdict depends on which Xcode ran it. Self-test first, same
# reasoning as `generated-boundary` above: the pure parsing and message logic
# is exercised on every run rather than only on a machine that happens to have
# the wrong Xcode installed.
[tasks."verify:xcode-version"]
description = "Local Xcode matches the version CI pins (POPS_XCODE_VERSION in [env] above)"
hide = true
run = '''
set -u
status=0
scripts/check-xcode-version.sh self-test || status=1
scripts/check-xcode-version.sh check "$POPS_XCODE_VERSION" || status=1
exit $status
'''

# The one entry point. `.github/workflows/ios-quality.yml` invokes this task
# rather than restating the commands, because the moment the two are written
# out separately they drift and a green local run means nothing.
#
# THE Xcode GUARD IS PER-TOOL, NOT PER-TASK, and that distinction is the whole
# shape of this task. It used to be a `depends`, which refused the entire task
# on a machine whose Xcode is not the pin — and the consequence was not a
# degraded local lint, it was NO local Swift lint of any kind. On a machine
# carrying only a newer Xcode the only way to discover an unused import or a
# SwiftLint violation was to push and wait out the macOS job.
#
# The guard was always only ever about one of these tools:
#
#   - `swiftlint` is pinned in `[tools]` above. The same binary, the same
#     rules, the same verdict on every machine. Xcode has no bearing on it.
#   - `swift-format` ships INSIDE the Xcode toolchain. A different Xcode both
#     formats to different bytes and ships a different rule list — and the
#     `swift-format` task below refuses to run at all when that list and
#     `.swift-format` disagree. Its verdict is meaningful only on the pin.
#
# So SwiftLint runs everywhere and swift-format's result is authoritative only
# on the pinned toolchain. On a mismatched one it still runs, because seeing it
# try is more useful than not knowing, but it cannot contribute to the exit
# code — and the run as a whole then exits non-zero however clean it looked,
# because a lint that could not check half of what it claims to check must not
# be reportable as a pass. `format` keeps its outright refusal: rewriting files
# with the wrong toolchain commits bytes CI rejects.
[tasks.lint]
description = "swift-format + SwiftLint over the Swift sources (SwiftLint runs on any Xcode; swift-format is authoritative only on the pin)"
run = '''
set -u
# Everything runs even when an earlier one fails, so one invocation reports
# every problem.
status=0
authoritative=1

# First, and unconditionally: the half that does not care which Xcode is
# selected. On a mismatched machine this is the only real verdict available,
# so it is the one that must not be behind a guard.
swiftlint lint --strict --quiet || status=1
mise run generated-boundary || status=1

if mise run verify:xcode-version; then
  mise run swift-format lint || status=1
else
  authoritative=0
  mise run swift-format lint || true
fi

if [ "$authoritative" -eq 0 ]; then
  echo "" >&2
  echo "lint: NOT A CLEAN RUN — swift-format was not checked authoritatively." >&2
  echo "      SwiftLint's verdict above holds; swift-format's does not, because" >&2
  echo "      this machine's Xcode is not the one CI pins (see the mismatch" >&2
  echo "      reported above). Whatever swift-format printed, formatting on this" >&2
  echo "      branch is unverified until CI or a pinned toolchain says otherwise." >&2
  echo "      'mise run format' still refuses outright, so nothing was rewritten." >&2
  # Non-zero even with nothing to report: an exit code of 0 here would be read
  # as "lint passed", which is the one thing this run cannot claim.
  [ "$status" -eq 0 ] && status=2
fi
exit $status
'''

[tasks.format]
description = "Rewrite the Swift sources with swift-format (the fixer for half of `lint`)"
# The write-path version of the same defect `lint` guards against: a mismatched
# Xcode wouldn't just misreport `lint` results, it would rewrite files to a
# DIFFERENT toolchain's rules and commit bytes CI's swift-format then rejects.
depends = ["verify:xcode-version"]
run = "mise run swift-format format"

# SwiftLint's analyzer rules (`unused_declaration`, `unused_import`) need a
# full compiler log, which `swiftlint lint` never produces — that is why they
# live here and not in `lint` above. The log comes from `build:for-testing`,
# which `test` also depends on, so the tree is compiled once and both read the
# result. Before that, this task did its own `clean build-for-testing` and the
# job paid for the same compile twice.
#
# NO Xcode PIN HERE, unlike `lint` and `format`. These two rules are
# SwiftLint's, and SwiftLint is pinned in `[tools]` — a declaration nothing
# references is unreferenced whichever compiler noticed. What the toolchain
# decides is whether a usable log comes out at all, and a log that does not
# cover the tree fails the floor below rather than passing quietly. So a
# machine carrying only a newer Xcode gets the same answer CI gets, which is
# the entire point: an unused import used to be discoverable only by pushing.
#
# One `xcodebuild` covers the whole tree because the `Pops` scheme's test
# action names every package's test target as well as `PopsTests` — the same
# property `[tasks.test]` above is built on. That was not always true: a
# package's `Tests/` belongs to that package's own SwiftPM graph, and while the
# scheme referenced none of them no app build ever asked a compiler to look at
# one, so `swiftlint lint` and `swiftlint analyze` disagreed about scope in
# silence. The stopgap was a `swift build --build-tests` per package appended
# to this log; with the scheme naming them it is dead weight — a second, host-
# toolchain compile of code `build-for-testing` has already compiled against
# the iOS SDK, which is the better of the two logs to be reading anyway.
#
# Nothing about that is taken on trust. The floor below counts the tree on
# disk and refuses a log that covers less of it, so a scheme that stops
# naming a test target fails here rather than quietly narrowing what these
# two rules see.
[tasks."lint:analyze"]
description = "SwiftLint's analyzer rules against the shared compiler log (unused_declaration, unused_import)"
depends = ["build:for-testing"]
run = '''
set -eu
set -o pipefail

log="$POPS_IOS_COMPILER_LOG"

# Absence is a failure, not a pass — the same rule as everything else here. A
# missing log would otherwise reach `swiftlint analyze` as an empty one and
# report zero violations over zero files.
if [ ! -s "$log" ]; then
  echo "lint:analyze: no compiler log at $log. 'mise run build:for-testing'" >&2
  echo "              writes it; without one these two rules see nothing." >&2
  exit 1
fi

status=0
output=$(swiftlint analyze --strict --compiler-log-path "$log" --config .swiftlint.yml 2>&1) || status=$?
printf '%s\n' "$output"

# Same reasoning as app-test-lane.sh's executed-test count: absence is a
# failure, not a pass. A log with nothing usable in it reports zero
# violations in zero files, which reads exactly like a clean pass unless
# something reads the file count back out and refuses to call zero a result.
#
# Zero is not the only shape that lies, though — a log covering half the
# repo still reports a healthy, nonzero count for the half it did see, which
# is exactly how this task shipped blind to every package's `Tests/` in the
# first place. So the floor below is the tree itself, read back out fresh on
# every run, rather than a constant: a future regression of the same shape (a
# target quietly dropped from the log again) fails here instead of reading as
# a second clean pass.
#
# The floor is `App`, `AppTests` and `Packages` — not `Tools`, though
# `.swiftlint.yml`'s `included:` names that too. `Tools/generate-device-
# signature-fixture.swift` is a loose script run by hand via `swift <path>`,
# never a member of any target the app, `PopsTests` or a package builds — no
# compiler log this task can produce will ever name it, so counting it here
# would fail this guard forever. `swiftlint lint` still lints it straight
# from source; only the analyzer rules, which need a build, cannot reach it.
#
# Counted by hand here rather than through `scripts/swift-sources.sh list`,
# on purpose: that script enumerates the FORMATTER's file set, which now
# also drops any file whose first line is a shebang — a distinction that
# exists for `swift-format` alone and means nothing to `swiftlint lint` or
# to `.swiftlint.yml`'s `included:`/`excluded:`. Reusing it here would let
# this floor silently track a different tool's notion of scope, which is the
# exact failure this task exists to close, one layer further in. `.build`,
# `Generated` and `Package.swift` are excluded because `.swiftlint.yml`
# excludes them too — the same reasoning as CGFloat's `always_keep_imports`
# entry in that file: build configuration and generated code are not the
# application code these two rules are about.
analyzed=$(printf '%s' "$output" | sed -nE 's/.*in ([0-9]+) files\.$/\1/p' | tail -1)
# `sed -E '/pattern/d'` rather than `grep -vE`: under `set -o pipefail`, `grep`
# exits 1 when nothing matches (here: no non-Package.swift file at all), which
# would abort this pipeline before the guard below ever runs and replace its
# message with a bare pipeline failure. `sed` exits 0 regardless of how many
# lines it deleted, so an empty result still reaches the check as $total=0.
total=$(find App AppTests Packages \
    \( -name .build -o -name Generated \) -type d -prune \
    -o -type f -name '*.swift' -print \
  | sed -E '/^Packages\/[^/]+\/Package\.swift$/d' \
  | wc -l | tr -d ' ')
if [ -z "$analyzed" ] || [ "$analyzed" -lt "$total" ]; then
  echo "lint:analyze: analyzed ${analyzed:-0} file(s), but $total live under" >&2
  echo "              App, AppTests and Packages (excluding Package.swift) —" >&2
  echo "              the compiler log did not cover the whole tree." >&2
  exit 1
fi

exit $status
'''

# Generates this client's canonical copy and stops there. The BFM vendors its
# own copy and a repo-root guard fails on drift, so regenerating without
# re-vendoring breaks the build — but the re-vendor step cannot live here:
# ADR-043 says a client never reaches into a pillar's directory. The task that
# does both is `fixture:device-signature` at the repo root; prefer it.
# The UI-level lane: install the built app on the simulator and drive every
# flow in `.maestro/` against a BFM that is already running. That README argues
# for Maestro over XCUITest; this task is about what has to be true before a
# flow can run.
#
# THE FLOWS ARE FOUND, NOT LISTED. A list here is a list to forget, and the way
# it is forgotten is silent: a flow nobody added runs nowhere and the job stays
# green. The glob is checked for emptiness instead, so a directory that moved
# fails the lane rather than passing it having driven nothing.
#
# IT DOES NOT START A SERVER, and that is a boundary rather than an omission.
# ADR-043 says a client consumes the federation over HTTP and never reaches
# into a pillar's directory, so booting `@pops/bfm` belongs to the repo root —
# `mise run e2e:ios` there does both halves and is the one command to run. What
# this task does over HTTP, it does through the BFM's published contract:
# `POST /operator/pairing/codes` is the same route the operator's Devices page
# calls.
#
# IT DOES NOT BUILD EITHER, unless it has to. `build:for-testing` wipes its own
# derived-data directory and recompiles the whole tree — seven minutes, and the
# reason is in that task — so a lane that always depended on it would double
# the cost of the CI job it runs inside, seconds after `test` compiled the same
# sources. It builds when the products are missing or older than a Swift file,
# and says which it did.
[tasks.e2e]
description = "Drive every UI flow on the simulator against a running BFM (repo root: `mise run e2e:ios`)"
depends = ["generate"]
run = '''
set -eu
set -o pipefail

base="${POPS_BFM_BASE_URL:-}"
control="${POPS_E2E_CONTROL_URL:-}"
if [ -z "$base" ] || [ -z "$control" ]; then
  echo "e2e: no POPS_BFM_BASE_URL and/or POPS_E2E_CONTROL_URL. This lane drives the app" >&2
  echo "     against a BFM that is already running; it does not start one. From the" >&2
  echo "     repo root:" >&2
  echo "         mise run e2e:ios" >&2
  echo "     boots a real pillar against a temporary database, starts the control plane" >&2
  echo "     the recovery flows throw their switches through, and calls this task." >&2
  echo "     Both addresses are needed: the recovery flows cannot revoke a device or" >&2
  echo "     age a token against a BFM nobody here controls." >&2
  exit 1
fi

app="$POPS_IOS_DERIVED_DATA/Build/Products/Debug-iphonesimulator/Pops.app"

# Rebuilt when there is nothing to install, or when any build input is newer
# than what was installed last time.
#
# ANY FILE, not just `*.swift`, and generated sources are NOT excluded. An
# earlier version of this borrowed `lint:analyze`'s prune list, which is wrong
# here because the two are asking different questions: that task is counting
# the files a person wrote, this one is asking whether the binary is stale.
# `Packages/BFMClient/Sources/BFMClient/Generated` is compiled into the app —
# `mise run generate:bfm-client` rewriting it is exactly the change this must
# catch — and so are asset catalogues, entitlements and `Info.plist`, none of
# which end in `.swift`.
#
# Two things are still pruned, each because it would report staleness that is
# not there:
#
#   - `.build`, SwiftPM's own output. It is not a source, and a checkout
#     restored from cache carries a fresh mtime.
#   - `Config/Signing.local.xcconfig`, which the `generate` this task depends on
#     rewrites on every run when the machine has a team configured. Left in, it
#     would make every run a rebuild on exactly those machines.
#
# Compared against a FILE INSIDE the bundle rather than the bundle directory. A
# directory's mtime moves when an entry is added or removed from it and not
# when the bytes of an existing entry change, so a rebuild that only rewrote
# the binary can leave the `.app` looking older than the sources it was built
# from. `Info.plist` is rewritten by every build, and its absence is itself a
# reason to rebuild — which is why one test covers both.
stamp="$app/Info.plist"
needs_build=false
if [ ! -f "$stamp" ]; then
  needs_build=true
elif [ -n "$(find App AppTests Packages Config project.yml \
    -name .build -type d -prune \
    -o -name Signing.local.xcconfig -prune \
    -o -type f -newer "$stamp" -print -quit)" ]; then
  needs_build=true
fi

if [ "$needs_build" = true ]; then
  echo "e2e: compiling — no products at $app, or a source is newer than them."
  mise run build:for-testing
else
  echo "e2e: reusing the products under $POPS_IOS_DERIVED_DATA."
fi

# The simulator `test` runs on, and the one it leaves booted. Preferring an
# already-booted device of that name is what keeps this from starting a second
# one alongside it; `bootstatus -b` boots only if it has to and waits either
# way.
udid=$(xcrun simctl list devices available -j \
  | jq -r --arg name "$POPS_IOS_SIMULATOR" \
    '[.devices[][] | select(.name == $name)] | (map(select(.state == "Booted")) + .) | .[0].udid // empty')
if [ -z "$udid" ]; then
  echo "e2e: no simulator named '$POPS_IOS_SIMULATOR' is available. 'xcrun simctl list devices'" >&2
  echo "     lists what this Xcode has; POPS_IOS_SIMULATOR in this file names the one" >&2
  echo "     every lane here uses." >&2
  exit 1
fi
xcrun simctl bootstatus "$udid" -b > /dev/null
xcrun simctl install "$udid" "$app"

flows=$(find .maestro -maxdepth 1 -name '*.yaml' | sort)
if [ -z "$flows" ]; then
  echo "e2e: no flows under .maestro. A lane that drives nothing and reports success is" >&2
  echo "     worse than one that fails, so this is a failure." >&2
  exit 1
fi
echo "e2e: driving $(echo "$flows" | wc -l | tr -d ' ') flow(s)."

for flow in $flows; do
  # Between flows rather than inside them, and before the code is minted. A
  # flow that fails halfway leaves the harness however it left it — finance
  # still refusing, a token-ageing still armed — and the next flow would then
  # fail for a reason that belongs to the previous one. Counters go back to
  # zero here too, so a flow asserting "one refresh" means its own.
  curl -fsS -X POST "$control/__e2e/reset" -o /dev/null

  # Minted per flow and as late as possible: every flow pairs from scratch, a
  # code is spent once, and the BFM expires an unspent one on its own TTL —
  # five minutes by default, raised for the BFM `scripts/ios-e2e/run.mjs`
  # starts (`BFM_PAIRING_CODE_TTL_MS`, see that file) because installing
  # Maestro's own driver and settling the simulator both happen after this
  # curl and before the flow's first step.
  # `|| true` so a refused connection or an HTTP error reaches the message below
  # rather than aborting the task under `set -e` with a bare curl exit code.
  code=$(curl -fsS -X POST "$base/operator/pairing/codes" \
    -H 'content-type: application/json' -d '{}' | jq -r '.code // empty' || true)
  if [ -z "$code" ]; then
    echo "e2e: $base/operator/pairing/codes returned no code. A 401 here means that BFM" >&2
    echo "     is running with NODE_ENV=production, where the route needs a Cloudflare" >&2
    echo "     Access identity this task has no way to present." >&2
    exit 1
  fi

  echo "e2e: $flow"
  maestro --device "$udid" test "$flow" \
    -e BFM_BASE_URL="$base" \
    -e CONTROL_BASE_URL="$control" \
    -e PAIRING_CODE="$code"
done
'''

[tasks."fixture:device-signature:generate"]
description = "Regenerate this client's copy of the iOS↔BFM signature fixture (the repo root's `fixture:device-signature` also re-vendors)"
run = "swift Tools/generate-device-signature-fixture.swift > Contracts/device-signature-v1.json"

# Re-vendor the BFM contract and regenerate the Swift client from it, in that
# order and in one command. Two commands would be two things to remember, and
# the one people forget is the copy — which is the failure the vendored-contract
# gate exists to catch, arriving as a red CI run instead of a local diff.
#
# The counterpart of `pnpm --filter <app> generate:<pillar>-client` on the
# TypeScript side, named to match. Both are re-run by CI and diffed (ADR-040).
[tasks."generate:bfm-client"]
description = "Re-vendor the BFM OpenAPI snapshot and regenerate the Swift client from it"
run = '''
set -eu

canonical=../../pillars/bfm/openapi/bfm.openapi.json
vendored=Contracts/bfm.openapi.json

# The producer's snapshot is a build artefact of the bfm pillar, so a clone that
# has never built it has no file here. Copying nothing would leave the previous
# vendored bytes in place and regenerate an identical client — a silent no-op
# that looks exactly like "already up to date".
if [ ! -f "$canonical" ]; then
  echo "generate:bfm-client: no canonical snapshot at $canonical." >&2
  echo "                     Run 'pnpm --filter @pops/bfm generate:openapi' first." >&2
  exit 1
fi

cp "$canonical" "$vendored"

# Generated FROM THE VENDORED COPY, never from the pillar's path: the copy is
# what makes this unit extraction-ready (ADR-033), and generating from the
# original would make that copy decorative — it could rot without breaking
# anything here.
swift run --package-path Tools/OpenAPIGenerator swift-openapi-generator generate \
  "$vendored" \
  --config Packages/BFMClient/openapi-generator-config.yaml \
  --output-directory Packages/BFMClient/Sources/BFMClient/Generated
'''
