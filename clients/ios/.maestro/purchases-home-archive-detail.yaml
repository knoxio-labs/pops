appId: com.knoxiolabs.pops.local
name: Purchases home opens both archive scopes and a full detail
---
- clearState
- clearKeychain
- launchApp
- runFlow: subflows/dismiss-stale-pairing-open-prompt.yaml

- assertVisible:
    id: 'pairing-code-field'

# Purchases must be reachable before pairing because bootstrap starts as soon
# as the credentials land. The control plane owns that switch and forwards the
# paired app to the same real BFM every other flow uses.
- runScript: scripts/receipts-become-available.js
- assertTrue: ${output.receipts.status == 200}
- assertTrue: ${output.receipts.state.purchasesReachable == true}

- runFlow:
    file: subflows/enter-the-pairing-details.yaml
    env:
      SERVER_URL: ${CONTROL_BASE_URL}

- runFlow: subflows/open-purchases.yaml

# The figure comes from the month-summary request. The tiles carry server
# counts; the unmatched tile covers both unsettled purchases across the whole
# backlog, while the month figure covers the single September purchase.
- assertVisible: 'A?\$12\.50'
- assertVisible:
    id: 'purchases-home-unmatched'
    text: '2, Unmatched'
- assertVisible:
    id: 'purchases-home-all'
    text: '3, All purchases'

- tapOn:
    id: 'purchases-home-unmatched'
- assertVisible: 'Unmatched'
- assertVisible: 'Corner Store.*'
- assertVisible: 'Market.*'
- assertNotVisible: 'Hardware Shop.*'

- tapOn: 'Corner Store.*'
- assertVisible:
    id: 'purchase-detail'
- assertVisible: 'Awaiting a bank match'
- assertVisible:
    id: 'purchase-detail'
    text: 'Items'
- assertVisible: 'Breakfast, A?\$12\.50'
- assertVisible:
    id: 'purchase-detail-receipt'

# Back returns to the archive with its scope intact. Switching the segmented
# control to All must reveal the linked fixture that Unmatched excluded.
- tapOn:
    id: 'BackButton'
- assertVisible: 'Corner Store.*'
- tapOn: 'All'
- assertVisible: 'Hardware Shop.*'

- scrollUntilVisible:
    direction: DOWN
    element:
      text: 'Everything since July 2026'
- assertVisible: 'Everything since July 2026'
