appId: com.knoxiolabs.pops.local
name: S8.1 A user-defined type syncs to the phone, an item of it is created and edited through its generic fields, its computed value shows, and an edit made offline replays
---
# The inventory-types acceptance flow (POPS-4354, scenario S8). It lives one
# directory below the lane's own flows so the default `mise run e2e:ios` glob
# does not pick it up; `mise run inventory:acceptance -- --ios` runs it by
# setting POPS_E2E_FLOWS. `../README.md` says how to run it and what it has
# and has not been run against.
- clearState
- clearKeychain
- launchApp

- assertVisible:
    id: 'pairing-code-field'

# Armed before pairing, for the reason `inventory-smoke.yaml` gives.
- runScript: ../scripts/inventory-becomes-available.js
- assertTrue: ${output.inventory.status == 200}

# The type is published by an owner before the phone ever sees it: it
# reaches the phone as data, not as a build.
- runScript: ../scripts/inventory-user-defined-type.js
- assertTrue: ${output.userDefinedType.status == 200}

- runFlow:
    file: ../subflows/enter-the-pairing-details.yaml
    env:
      SERVER_URL: ${CONTROL_BASE_URL}

# Pairing starts the first download on its own (POPS-4354's sync on
# pairing), so there is no setup prompt to press: the dashboard's counts are
# what appear once the replica holds a download.
- tapOn: 'Inventory'
- extendedWaitUntil:
    visible: 'Items, \d+'
    timeout: 60000

# Create an item of the synced type, through the form's generic protocol-2
# fields rather than any code written for this type.
- tapOn: 'Inventory'
- tapOn: 'Items, \d+'
- tapOn: 'Add an item|New item'
- tapOn:
    id: 'inventory-item-name-field'
- inputText: Gadget ${output.inventory.run}
- assertVisible: Gadget ${output.inventory.run}

# The keyboard is still up from Name, and a tap fired while it is mid-dismiss
# lands on the field just typed into rather than the one the flow means next
# — observed on a simulator run (POPS-4508): a tap resolved to the correct
# element by id still typed into Name, producing an item named
# "Gadget 123456 21". `InventoryItemFormView` now declares
# `scrollDismissesKeyboard(.interactively)` for exactly this, matching
# `ReceiptDraftView`'s own fix for the same class of tap; the drag is what
# takes the keyboard with it, not a wait.
- swipe:
    start: 50%, 25%
    end: 50%, 85%
    duration: 600

# A new item's Type defaults to the first non-archived type the catalogue
# declares (`InventoryItemFormModel.seed`), and this run's temp inventory
# pillar has exactly one non-legacy type to default to — `Phone gadget`,
# published above with key `acc_phone_gadget` (`inventory-user-type.mjs`).
# Asserted rather than assumed: if a future default ever resolves to a
# different type, the item would still get created, just of the wrong type,
# and every assertion after it would fail on an unrelated screen instead of
# here, where it is obvious what went wrong.
- assertVisible: 'Type, Phone gadget'

# The Type choice itself, driven through the menu the design keeps (a
# SwiftUI `Picker` in menu style, so a `UIMenu`). By id, not by the words on
# it: the row's label changes with every choice and a type's label is
# owner-authored. The option is waited for rather than tapped straight
# away, because the menu animates in and a tap aimed at a hierarchy read
# mid-presentation lands on nothing (POPS-4556); and the menu is waited
# out again before the next tap, which would otherwise only dismiss it.
#
# The tap goes to the current value inside the row, not to the row: the
# row's element spans the whole cell, but only its trailing value is the
# button that opens the menu, and a tap at the row's centre lands on the
# "Type" label and opens nothing (observed on a simulator run, POPS-4556).
- tapOn:
    text: 'Phone gadget'
    childOf:
      id: 'inventory-item-type'
- extendedWaitUntil:
    visible:
      id: inventory-item-type-option-${output.userDefinedType.state.userDefinedType.typeId}
    timeout: 10000
- tapOn:
    id: inventory-item-type-option-${output.userDefinedType.state.userDefinedType.typeId}
- extendedWaitUntil:
    notVisible:
      id: inventory-item-type-option-${output.userDefinedType.state.userDefinedType.typeId}
    timeout: 10000
- assertVisible: 'Type, Phone gadget'

# By id, not by the word "Price": `InventoryProtocol2ValueEditor`'s scalar
# editor is a `LabeledContent` whose label and field are two elements.
# `InventoryAccessibility.protocol2Field(id:)` names the field's own TextField
# for exactly this, and the field's id is this run's own seeding response, not
# a hardcoded guess.
- tapOn:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.priceFieldId}
- inputText: '21'
# id and text on the same selector match the one element that carries both:
# the TextField itself is what `protocol2Field(id:)` names (it has no
# children an assertion could target `childOf`), and its value is its text.
- assertVisible:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.priceFieldId}
    text: '21'
# The keyboard Price raised covers the rows below it, and a tap aimed at one
# of them lands on a key instead (observed on a simulator run: Price read
# "21E" after the tap meant for Tags' Add). The same drag as after Name takes
# the keyboard down before every tap below a field just typed into.
- swipe:
    start: 50%, 25%
    end: 50%, 85%
    duration: 600

# `Tags` is the seeded type's many-valued field (POPS-4359's many-cardinality
# gap): add two values, reorder them, remove one, and confirm the survivor is
# read back from Item detail once saved. Every entry's editor and its
# move/remove buttons are plain rows and icon buttons, addressed by
# `InventoryAccessibility.protocol2FieldEntry(id:index:)` and its
# `...MoveEarlier`/`...MoveLater`/`...Remove` siblings, so unlike the Type
# menu above there is no presentation to wait for.
- tapOn:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.tagsFieldId}-add
- tapOn:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.tagsFieldId}-0
- inputText: 'blue'
- swipe:
    start: 50%, 25%
    end: 50%, 85%
    duration: 600
- tapOn:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.tagsFieldId}-add
- tapOn:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.tagsFieldId}-1
- inputText: 'red'
- swipe:
    start: 50%, 25%
    end: 50%, 85%
    duration: 600
# Moving the second entry earlier swaps the two positions: the identifier
# that now reads "red" is index 0, not index 1, because the id is the row's
# position, not the entry's own.
- tapOn:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.tagsFieldId}-1-move-earlier
- assertVisible:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.tagsFieldId}-0
    text: 'red'
# Removing the entry now at index 1 ("blue") leaves "red" as the one
# surviving value, at index 0.
- tapOn:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.tagsFieldId}-1-remove
- assertVisible:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.tagsFieldId}-0
    text: 'red'
- tapOn: 'Create'
- tapOn: Gadget ${output.inventory.run}

# The computed value is the server's evaluation, relayed through the BFM:
# Price + Price.
- extendedWaitUntil:
    visible: 'Doubled price.*42.*'
    timeout: 60000

# Tags reads back "red" only: the reorder moved it to the surviving
# position, and the remove took out "blue", so Item detail's Details
# section — which joins a many-valued field's entries with " · "
# (`InventoryProtocol2Display.text`) — shows exactly one value, in the order
# the edit left it in.
- assertVisible: 'red'
- assertNotVisible: 'blue'

# Offline: every relayed sync request fails. An edit still lands on the phone
# first and waits; once the pillar answers again, it replays and the computed
# value follows it.
- runScript:
    file: ../scripts/inventory-sync-outage.js
    env:
      SYNC: down
- assertTrue: ${output.syncOutage.state.inventorySyncOutage == true}
- tapOn: 'Inventory'
- tapOn: 'Items, \d+'
- tapOn: Gadget ${output.inventory.run}
- tapOn: 'Edit'
# The sheet animates in, and a tap aimed at a hierarchy read before it
# settles lands on nothing (POPS-4508). `assertVisible` waits; settling on
# the sheet's own title is what the tap after it can trust.
- assertVisible: 'Edit item'
# A plain tap puts the cursor before the existing "21" (POPS-4508), so an
# erase after it removes nothing. Typing over "Select All" replaces the value
# wherever the cursor sat. The field is focused first: a long press on a field
# that is not yet editing only focuses it and raises no menu (observed on a
# simulator run), while on a focused one it raises the edit menu every time.
- tapOn:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.priceFieldId}
- longPressOn:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.priceFieldId}
- extendedWaitUntil:
    visible: 'Select All'
    timeout: 10000
- tapOn: 'Select All'
- inputText: '30'
- assertVisible:
    id: inventory-field-${output.userDefinedType.state.userDefinedType.priceFieldId}
    text: '30'
- tapOn: 'Save'
- tapOn: 'Inventory'
- tapOn: 'Sync status: .*'
- assertVisible: 'Waiting to sync'
- runScript:
    file: ../scripts/inventory-sync-outage.js
    env:
      SYNC: up
- assertTrue: ${output.syncOutage.state.inventorySyncOutage == false}
- swipe:
    start: 50%, 35%
    end: 50%, 85%
- extendedWaitUntil:
    notVisible: 'Waiting to sync'
    timeout: 60000
- tapOn: 'Inventory'
- tapOn: 'Items, \d+'
- tapOn: Gadget ${output.inventory.run}
- extendedWaitUntil:
    visible: 'Doubled price.*60.*'
    timeout: 60000
