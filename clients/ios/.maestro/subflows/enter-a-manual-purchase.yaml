appId: com.knoxiolabs.pops.local
name: Fill in a blank receipt draft and submit it
---
# The manual-entry half of `receipt-manual-entry.yaml`, pulled into its own
# subflow for the same reason `enter-the-pairing-details.yaml` is: the fields
# share the one typing hazard that file's own header explains at length —
# `tapOn` returns once the tap is delivered, not once the tapped field has
# become first responder, so a field can silently keep whatever it already
# held. Asserting every field's own text AFTER all of them are typed, and
# retrying the whole set together on a miss, is what keeps the values that
# reach Save the values that were checked.
#
# `receipt-draft-item-description` and `receipt-draft-item-amount` are safe to
# address by id without an index: `ReceiptDraftPresentation.blankDraft`
# starts with exactly one line, so each identifier matches exactly one field
# on this screen.

# The merchant is not a text field: it opens a sheet to choose a merchant on
# file or create one by name (`ReceiptDraftRecordSelect`). Creating is local to
# the draft — nothing is sent until Save — so it needs nothing from the stub.
# Its own retry, for the typing hazard above, and the name is confirmed in the
# sheet before Create, because Create takes whatever the field holds.
- retry:
    maxRetries: 2
    commands:
      - tapOn:
          id: 'receipt-draft-merchant'
      - tapOn:
          id: 'receipt-draft-record-new-name'
      - eraseText
      - inputText: 'Corner Store'
      # The identifier sits on `PopsTextField`'s wrapper and the typed text on
      # the field inside it, so the text is matched as its child.
      - assertVisible:
          text: 'Corner Store'
          childOf:
            id: 'receipt-draft-record-new-name'
      - tapOn:
          id: 'receipt-draft-record-create'
      - assertVisible: 'Corner Store'

# The keyboard is put away after every field, and each next field is scrolled
# to the middle of the screen before it is tapped (only on the way down: the
# date sits too near the top of the form ever to reach the middle, and the
# upward scrolls are only for the checks). With the keyboard up, the
# form's action bars ride above it, and together they cover more than half of
# an iPhone 17 — the middle included — while `tapOn` aims at an element
# without asking whether something is drawn over it. A tap meant for the item
# amount once landed on Done and discarded the draft (POPS-4189); on iOS 26 a
# tap meant for the next field landed on the bars and everything after it was
# typed into the date. Return is no way out: iOS 26 moves focus to the next
# field instead of putting the keyboard away, and `hideKeyboard` fails
# outright. Dragging the form down is: the form declares
# `scrollDismissesKeyboard(.interactively)`, so the drag takes the keyboard
# with it on every iOS this runs on.
#
# Each field is tapped inside its text box at the trailing end, not at its
# wrapper's centre: the wrappers carry a label or a note, and a caret placed
# after the existing text is what lets `eraseText` clear a retry's first try.
# The typed text sits on the field inside each `PopsTextField`'s identified
# wrapper, hence `childOf` for the checks.
- retry:
    maxRetries: 2
    commands:
      - scrollUntilVisible:
          direction: UP
          element:
            id: 'receipt-draft-date'
      - tapOn:
          id: 'receipt-draft-date'
          point: '90%,60%'
      - eraseText
      - inputText: '2026-09-01'
      - swipe:
          start: 50%, 25%
          end: 50%, 85%
          duration: 600
      - scrollUntilVisible:
          centerElement: true
          element:
            id: 'receipt-draft-item-description'
      - tapOn:
          id: 'receipt-draft-item-description'
          point: '90%,30%'
      - eraseText
      - inputText: 'Coffee'
      - swipe:
          start: 50%, 25%
          end: 50%, 85%
          duration: 600
      - scrollUntilVisible:
          centerElement: true
          element:
            id: 'receipt-draft-item-amount'
      - tapOn:
          id: 'receipt-draft-item-amount'
          point: '90%,10%'
      - eraseText
      - inputText: '5.00'
      - swipe:
          start: 50%, 25%
          end: 50%, 85%
          duration: 600
      - scrollUntilVisible:
          centerElement: true
          element:
            id: 'receipt-draft-total'
      - tapOn:
          id: 'receipt-draft-total'
          point: '90%,60%'
      - eraseText
      - inputText: '5.00'
      - assertVisible:
          text: '5.00'
          childOf:
            id: 'receipt-draft-total'
      - swipe:
          start: 50%, 25%
          end: 50%, 85%
          duration: 600
      - scrollUntilVisible:
          direction: UP
          element:
            id: 'receipt-draft-item-amount'
      - assertVisible:
          text: '5.00'
          childOf:
            id: 'receipt-draft-item-amount'
      - assertVisible:
          text: 'Coffee'
          childOf:
            id: 'receipt-draft-item-description'
      - scrollUntilVisible:
          direction: UP
          element:
            id: 'receipt-draft-date'
      - assertVisible:
          text: '2026-09-01'
          childOf:
            id: 'receipt-draft-date'
