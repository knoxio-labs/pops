# SwiftLint — defects and size. `.swift-format` is the formatter.
#
# The division of labour, because it decides where a new rule belongs:
# swift-format owns what the code LOOKS like and rewrites it; SwiftLint owns
# what the code may DO and rewrites nothing. A defect is reported once, by its
# owner. The two run as separate commands from `mise run lint`, so a
# reformatting diff can never bury a lint regression.
#
# Every violation here fails: `mise run lint` passes `--strict`, which turns
# warnings into a non-zero exit. That is why each limit below sets `warning`
# and nothing else — a two-tier limit means the first tier is advisory, and an
# advisory limit is one nobody fixes.
#
# There are no `swiftlint:disable` comments in this tree and there should never
# be one. A rule that turns out to be wrong for this codebase gets deleted from
# this file, in a commit, with the reason written next to it — the same standard
# the TypeScript side holds against `eslint-disable`.

included:
  - App
  - AppTests
  - Packages
  - Playground
  - Tools

excluded:
  # SwiftPM checkout and build products.
  - '**/.build'
  # A `Package.swift` is build configuration that happens to be written in
  # Swift. It declares no module boundary, its length says nothing about its
  # readability, and the rules below are all about application code. The
  # formatter still covers it. `Tools/OpenAPIGenerator`'s manifest is the same
  # case as `Packages/*/Package.swift` below it, one level deeper.
  - 'Packages/*/Package.swift'
  - 'Tools/*/Package.swift'
  # Generated code. Every rule below describes code a person wrote, and
  # generated OpenAPI Swift breaks four of them by construction: a schema type
  # is `Components.Schemas.X`, which is two levels of nesting; a `Types.swift`
  # for a real contract is thousands of lines; long signatures pass 120
  # columns; and an optional boolean in the contract becomes `Bool?`. Holding a
  # generator to rules written for people has one outcome — the blanket
  # `swiftlint:disable` this file's header forbids — so the generator's output
  # is out of scope instead, and the hand-written wrapper around it is not.
  #
  # Keyed on the directory name and nothing else, so it cannot quietly grow
  # into "the BFMClient module": a generated file that lands anywhere else is
  # still linted, and still fails. That both halves hold is checked rather than
  # hoped — scripts/swift-sources.sh, run by `mise run lint`, fails on a
  # generated file outside one of these directories AND on a hand-written file
  # inside one, and self-tests both against fixtures built from this file.
  #
  # swift-format is excluded from the same directories, for a different reason
  # that is written down in scripts/swift-sources.sh.
  - '**/Generated'

# ---------------------------------------------------------------------------
# Size
#
# The numbers are the TypeScript side's numbers (.oxlintrc.json) unless Swift's
# grammar makes them mean something different, in which case they are adjusted
# and the adjustment is explained. One repo, one idea of "too big".
# ---------------------------------------------------------------------------

# oxlint `max-lines` is 200 counting neither blanks nor comments. SwiftLint can
# discount comment-only lines but has no equivalent for blank ones, so 250 is
# the same 200-line code budget plus the vertical space Swift's one-declaration-
# per-line layout spends.
file_length:
  warning: 250
  ignore_comment_only_lines: true

# Just under file_length. Swift convention is one primary type per file, so the
# type is nearly the whole file; the 50-line gap is what is left for imports,
# the doc comment above the type, and extensions below it. A type that needs
# more than this is several types.
type_body_length:
  warning: 200

# Tighter than oxlint's `max-lines-per-function` of 60, and the counting rule is
# identical (SwiftLint excludes comments and whitespace here too). 60 on the TS
# side has to accommodate React components, which are functions that contain
# their own markup. In Swift the markup lives in `var body`, a computed property
# — see the note under type_body_length — so every `func` this rule sees is
# logic, and 40 lines of logic is already a lot.
function_body_length:
  warning: 40

# oxlint `max-params` is 4, and so was this. SwiftLint exempts initialisers from
# the rule, which is the right exemption to have: a value type with six stored
# properties needs a six-parameter `init` and that says nothing bad about the
# type.
#
# It is 5 because of exactly one function, and the fifth parameter is not this
# repo's to remove. `ClientMiddleware.intercept(_:body:baseURL:operationID:next:)`
# is declared by swift-openapi-runtime and is how a caller attaches a credential
# to a generated client; a conformance must match the requirement's signature.
# `AuthenticatingMiddleware` in `Packages/Auth` is the only one in this tree,
# and there will not be a second — a middleware is the seam, and one is enough.
#
# The alternatives were all worse in the way this file's header describes. A
# `swiftlint:disable` comment is forbidden here. `excluded:` is file-scoped
# rather than rule-scoped, so it would turn off every other rule on the one
# piece of code that most needs them. And giving a parameter a default value
# purely to drop the count past `ignores_default_parameters` is gaming a linter
# rather than answering it. SwiftLint offers no path- or type-scoped exemption
# for this rule; the number is the only lever there is.
#
# What that costs, stated plainly: a hand-written five-parameter function no
# longer fails the build. Nothing automated replaces it. What does is that a
# five-parameter signature is now rare enough to be worth a comment in review,
# and this one is the reason the limit moved.
function_parameter_count:
  warning: 5

# oxlint `complexity`, unchanged. Branching is branching in either language.
cyclomatic_complexity:
  warning: 12

# This rule counts nested *declarations*, not statement or closure depth — a
# SwiftUI view tree twelve closures deep does not register, and there is no
# SwiftLint equivalent of oxlint's `max-depth`. So the numbers are about
# declarations only.
#
# One nested type is a `CodingKeys` or a `State` enum, which belong to their
# parent. Two is a namespace pretending to be a type.
#
# One nested function is a local helper, which is a readable factoring. Two is a
# helper inside a helper, which is a type that has not admitted it exists yet.
# This is tighter than SwiftLint's default of 2 on purpose.
nesting:
  type_level:
    warning: 1
  function_level:
    warning: 1

# The hard ceiling, not the day-to-day width. swift-format wraps at 100 (the
# same column oxfmt uses) and is what actually shapes the code — but it gives up
# silently on anything it cannot break, so a 135-character string literal exits
# the formatter clean. Verified, not assumed. This catches that residue; the
# 20-column gap is the tolerance for it. Past 120 the literal gets split by hand.
line_length:
  warning: 120
  ignores_urls: true

# ---------------------------------------------------------------------------
# Correctness
# ---------------------------------------------------------------------------

opt_in_rules:
  # The three ways to convert "this might not be here" into a crash.
  - force_unwrapping
  - implicitly_unwrapped_optional
  # `Bool?` has three states and every reader assumes two.
  - discouraged_optional_boolean
  # `count == 0` on a Collection is O(n) for some conformances; `isEmpty` is not.
  - empty_count
  # `[unowned self]` is a dangling pointer the moment the assumption behind it
  # stops holding. `[weak self]` fails visibly instead.
  - unowned_variable_capture
  - redundant_nil_coalescing
  # Every top-level declaration states its access level, so a module's public
  # surface is something someone wrote rather than something that defaulted.
  # `explicit_acl` — its whole-file sibling — was considered and rejected: it
  # demands the keyword on every member of every type, which buries the two
  # places the boundary is actually decided in a hundred that it is not.
  - explicit_top_level_acl

# `force_cast` and `force_try` are on by default and stay on; they are the same
# category as `force_unwrapping` above.

# An orphan TODO is a finding that will never be done — this repo's rule is that
# a finding is a Huly issue or it is nothing. Error, so the comment cannot be
# committed with the intention of coming back to it.
todo:
  severity: error

# SwiftLint's default floor of 3 rejects `xs`, `sm`, `md`, `lg` and `xl` while
# accepting `xxl`, which is not a distinction anyone would make on purpose — a
# spacing scale is named that way in every design system there is. Two is the
# shortest name that can carry a convention (a scale step, `id`, `db`); one
# character cannot, and the rule still rejects those.
identifier_name:
  min_length: 2

disabled_rules:
  # Both of these contradict the formatter outright, and a rule the formatter
  # re-breaks on every run is not a rule — it is a file nobody can make pass
  # without the suppression comment this config forbids.
  #
  # swift-format ADDS a trailing comma to every multi-element literal (smaller
  # diffs); this rule's default rejects exactly those commas.
  - trailing_comma
  # swift-format puts `{` on its own line when it has had to wrap a declaration
  # across lines, which is its documented layout for that case; this rule wants
  # the brace on the declaration's line, which after wrapping does not exist.
  # Seen on `DesignSystem`'s contrast tests the moment a signature got long
  # enough to wrap.
  - opening_brace

# SwiftLint only runs these under `swiftlint analyze`, never under `swiftlint
# lint` — listing them here cannot make `mise run lint` depend on a build.
# `mise run lint:analyze` is the only thing that runs them, against a compiler
# log it builds fresh for itself, and CI runs it as its own step after the
# regular build. Kept to two rules deliberately, both about dead code a full
# rebuild can see that source-only linting cannot:
analyzer_rules:
  # A `private`/`internal` declaration nothing references. Left at the
  # default `include_public_and_open: false` deliberately: every `Packages/*`
  # module is a library whose `public` surface is meant to be used from
  # outside the file that declares it, often outside the module entirely, and
  # frequently ahead of the call site that will consume it — flagging that as
  # "unused" would be flagging the API surface itself, not dead code.
  - unused_declaration
  # An `import` the file never uses.
  - unused_import

# `unused_import` gets `CGFloat`'s owning module wrong. `CGFloat` is
# ABI-special-cased by the compiler and the index data the rule reads
# attributes it to a module other than `CoreGraphics`, so a file that imports
# `CoreGraphics` for `CGFloat` and nothing else — `Tokens/PopsMetrics.swift` —
# is reported unused even though removing the import fails the build (verified
# with a clean `xcodebuild`). `always_keep_imports` is the rule's own
# documented escape for exactly this: a targeted correction to what the rule
# considers used, not a suppression of what it reports.
unused_import:
  always_keep_imports:
    - CoreGraphics
