packages:
  - 'pillars/*'
  - 'pillars/*/*'
  - 'libs/*'

# `allowBuilds` and `overrides` moved here from the `pnpm` field in
# package.json, which pnpm 11 no longer reads. It warns and ignores those keys
# rather than failing, so leaving them behind would have silently dropped both
# an install-script allowlist and two dependency pins.
#
# pnpm 11 also renamed the allowlist: `onlyBuiltDependencies` (a list of what
# may build) became `allowBuilds` (a map, so a block is stated rather than
# implied by omission).
#
# Supply-chain gate — only `true` entries may run install lifecycle scripts.
# better-sqlite3 and sharp need to compile or fetch a prebuild; esbuild and msw
# install their own binaries. msgpackr-extract is an optional accelerator that
# was never on the old allowlist, so it stays blocked — it was previously
# reported as an ignored build script on every install, and pnpm degrades to
# the pure-JS path without it.
allowBuilds:
  better-sqlite3: true
  esbuild: true
  msw: true
  sharp: true
  msgpackr-extract: false

# `@types/node` is pinned to the Node major the fleet actually runs (24), and
# the override is what makes that pin hold. Declaring `^24.13.3` in each
# package.json only binds the workspace's own resolutions; a dozen
# DefinitelyTyped packages (`@types/express-serve-static-core`, `@types/jsdom`,
# `@types/papaparse`, ...) depend on `@types/node` at `*`, which pnpm resolves
# to whatever is newest on the registry. That pulled a second, Node 25 copy
# back into the tree on a fresh install even with every manifest pinned, and it
# moves on its own whenever DefinitelyTyped publishes — so the manifests alone
# make the resolution undeclared, not wrong. Only an override reaches it.
overrides:
  '@types/node': ^24.13.3
  cssstyle: 6.0.2
  ioredis: 5.11.0

# pnpm 11 added an implicit "are deps up to date" install before running any
# script. That is incompatible with how the pillar images build: each Dockerfile
# installs a deliberate subset (`pnpm install --frozen-lockfile --filter
# @pops/<id>...`) and then runs `pnpm build`, so the re-check walks a partial
# workspace. pnpm 11 also turned an unresolvable `workspace:*` into a hard
# error, so the two together fail the build — pillars/docs copies every pillar
# manifest but no libs, and `pillars/ai` declares `@pops/ai-telemetry:
# workspace:*`:
#
#   ERR_PNPM_WORKSPACE_PKG_NOT_FOUND  no package named "@pops/ai-telemetry"
#
# Disabled rather than worked around, because pnpm 10 did not run this check at
# all — so this keeps the bump behaviour-preserving instead of adopting a new
# behaviour at the same time. The real guarantee is `--frozen-lockfile` at
# install time, which is stronger and already enforced everywhere.
verifyDepsBeforeRun: false

# Turns the root manifest's `engines.node` from advice into a refusal, so a
# shell whose PATH resolves an unpinned Node cannot run a workspace script and
# report a result that CI would not reproduce.
#
# This must live here, not in an `.npmrc`: pnpm 11 reads `engine-strict` from
# the npmrc only to warn, and runs the script anyway — the same silent-downgrade
# trap as the `pnpm` package.json field above. In `pnpm-workspace.yaml` it
# fails the command.
engineStrict: true
