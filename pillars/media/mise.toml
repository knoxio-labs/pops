[tasks.build]
description = "tsc -b → openapi snapshot → typed client"
run = [
  "tsc -b tsconfig.build.json",
  "tsx scripts/generate-openapi.ts",
  "tsx scripts/generate-api-types.ts",
]
sources = ["src/**/*.ts", "scripts/**/*.ts", "tsconfig.build.json"]
outputs = ["dist/**", "openapi/*.json", "src/**/api-types.generated.ts"]

[tasks.typecheck]
depends = ["build"]
run = ["tsc --noEmit", "tsc --noEmit -p scripts/tsconfig.json"]

[tasks.test]
depends = ["build"]
run = ["node ../../scripts/require-built-graph.mjs", "vitest run"]

[tasks.lint]
run = "oxlint src && oxfmt --check ."

[tasks.dev]
run = "tsx watch --clear-screen=false src/api/server.ts"

[tasks.start]
run = "node dist/api/server.js"

[env]
# mise's `_.path` interpolates `config_root` per config FILE, so the root
# mise.toml only ever contributes the workspace-hoisted bin dir — this unit's
# own tools (pinned via its own package.json and resolved by its own lockfile
# importer) are otherwise never on PATH, so a bare tool name above would
# silently resolve the root's node_modules/.bin instead of this unit's own.
_.path = ["{{config_root}}/node_modules/.bin"]
