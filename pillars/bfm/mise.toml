[tasks.build]
description = "tsc -b → openapi snapshot"
run = ["tsc -b tsconfig.build.json", "tsx scripts/generate-openapi.ts"]
sources = ["src/**/*.ts", "scripts/**/*.ts", "tsconfig.build.json"]
outputs = ["dist/**", "openapi/*.json"]

[tasks.typecheck]
depends = ["build"]
run = ["tsc --noEmit", "tsc --noEmit -p scripts/tsconfig.json"]

[tasks.test]
run = "vitest run"

[tasks.lint]
run = "oxlint src && oxfmt --check ."

[tasks.dev]
run = "tsx watch --clear-screen=false src/api/server.ts"

[tasks.start]
run = "node dist/api/server.js"
