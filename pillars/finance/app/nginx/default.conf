server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types application/javascript application/json text/css;
    gzip_min_length 256;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}\n';
    }

    # `finance.js` keeps its name across deploys — it is half of the
    # `assetsBaseUrl` the pillar's manifest advertises, so the registry would
    # have to change for the name to — which means a browser must revalidate
    # it or a rebuilt image goes unseen. The ETag keeps an unchanged file a
    # bodyless 304. Every chunk it pulls in beside itself is content-hashed,
    # so those are immutable and a deploy moves the entry and its chunk names
    # together. This is the split pops-shell already runs for index.html
    # against /assets/ (POPS-2573 is the same defect on the other side of it).
    location = /finance.js {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = /finance.js.map {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Anything else here is a hashed chunk or its sourcemap. No SPA fallback:
    # this server hosts an ES module and its chunks, not a page, and an
    # unknown path answered with a 200 would reach the browser as a module it
    # cannot parse rather than as the 404 it is.
    location / {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
}
