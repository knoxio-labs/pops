# require-built-graph.mjs refuses a missing sibling dist; an incremental build can no-op when only .tsbuildinfo survives.
[tasks.typecheck]
run = ["node ../../../scripts/require-built-graph.mjs", "tsc --noEmit"]

[tasks.test]
run = ["node ../../../scripts/require-built-graph.mjs", "vitest run"]

[tasks.lint]
run = "oxlint src && oxfmt --check ."

[tasks.build]
run = "pnpm run build:remote"
