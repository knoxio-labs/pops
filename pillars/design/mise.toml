[tasks.build]
description = "the API into dist/api (tsc -b) and the playground into dist/web (vite)"
run = "tsc -b tsconfig.build.json && vite build"
sources = [
  "src/**/*",
  "index.html",
  "vite.config.ts",
  "tsconfig.json",
  "tsconfig.build.json",
  "package.json",
]
outputs = ["dist/**"]

[tasks."dev:api"]
run = "tsx watch --clear-screen=false src/api/server.ts"

[tasks."dev:all"]
description = "Run the playground and its comment API together — the local comment loop needs both"
run = "mise run -j 2 dev ::: dev:api"

[tasks.start]
run = "node dist/api/server.js"

[tasks.dev]
run = "vite"

[tasks.typecheck]
run = "tsc --noEmit"

[tasks.test]
run = "vitest run"

[tasks.lint]
run = "oxlint src && oxfmt --check ."

[env]
# See pillars/shell/mise.toml — same reason (POPS-2715). `vite` is this unit's
# own dependency, so `build` and `dev` had no way to find it, and `build` is
# in the `run-all` fan-out behind `openapi:generate`.
_.path = ["{{config_root}}/node_modules/.bin"]
