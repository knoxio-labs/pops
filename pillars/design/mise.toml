[tasks.build]
run = "tsc --noEmit && vite build"
sources = ["src/**/*", "index.html", "vite.config.ts", "tsconfig.json", "package.json"]
outputs = ["dist/**"]

[tasks.dev]
run = "vite"

[tasks.typecheck]
run = "tsc --noEmit"

[tasks.test]
run = "vitest run"

[tasks.lint]
run = "oxlint src && oxfmt --check ."
