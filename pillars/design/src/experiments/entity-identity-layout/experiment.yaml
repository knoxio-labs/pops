name: Entity identity layout
question: Should the entity's poster/avatar/colour compose as a banner-forward
  profile header, or a compact accent-led header with no reserved poster space?
status: decided
screen: contacts/entity-details
variants:
  compact: Compact, accent-led
decided: 2026-09-06
rationale: >-
  Banner-forward. Poster and avatar are the entity's identity when either is
  set, and the compact header demotes a poster to a thumbnail, losing most of
  its visual payoff for the sake of header height. The colour-only case (most
  entities, at least until avatars/posters are widely uploaded) degrades fine
  under the banner too: a flat tint plus initials-on-ring, not an empty band.
  No `chosen` is recorded because the incumbent won and the registry only
  accepts a variant id there.
