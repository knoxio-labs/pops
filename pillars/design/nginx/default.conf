server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}\n';
    }

    # The bundle is built with `base: /design/` (vite.config.ts), so its asset
    # URLs carry that prefix. Behind the shell the prefix is stripped before
    # the request reaches this server, so `/assets/…` must resolve at the root;
    # a direct hit on the container keeps the prefix, so `/design/…` must
    # resolve too. Both alias the same tree.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /design/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /design/index.html;
    }

    # index.html keeps its name across deploys, so browsers must revalidate
    # it or a rebuilt image goes unseen; the ETag keeps an unchanged file a
    # bodyless 304. Every unknown path is a client-side route.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
