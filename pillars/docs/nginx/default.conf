server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"ok":true}\n';
    }

    location = /catalog.json {
        default_type application/json;
        add_header Cache-Control "no-store";
        try_files /catalog.json =404;
    }

    location /openapi/ {
        default_type application/json;
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
    }

    # Nothing served from the root is content-hashed — index.html and
    # styles.css keep their names across deploys — so without an explicit
    # directive browsers fall back to heuristic freshness and a rebuilt
    # image goes unseen. Revalidate every time; the ETag keeps an unchanged
    # file a bodyless 304. The /openapi/ and /catalog.json blocks above set
    # their own policy and are unaffected.
    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }
}
