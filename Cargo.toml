# POPS Cargo workspace root — lives at the repo root.
#
# Introduced for `pillars/contacts`, the first Rust pillar (ADR-033 covers why
# a pillar may be written in another language at all). Future Rust libraries
# (`pops-ai`, `pops-settings`) join `[workspace].members` here; they do NOT
# create a second workspace. One lockfile, one shared dependency set, one Rust
# CI lane — a second workspace would fork all three and break `cargo deny`'s
# single-graph view.
#
# Members are referenced by repo-relative path: shared libraries under `libs/`
# and pillar crates under `pillars/`, each pillar crate colocated with its TS
# frontend so a pillar stays one directory.
[workspace]
resolver = "2"
members = ["pillars/contacts", "libs/pops-ai", "libs/pops-settings"]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

# Shared dependency versions every member crate inherits via
# `dep = { workspace = true }`. New Rust pillars pin their deps here so the
# workspace resolves a single coherent set.
[workspace.dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate"] }
utoipa = { version = "5", features = ["axum_extras"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
futures = "0.3"
